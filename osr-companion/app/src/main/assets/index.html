<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>OSR Companion</title>
<style>
:root {
  --bg: #f3f0f8;
  --bg-2: #ebe5f4;
  --surface: #ffffff;
  --surface-2: #f4f0fa;
  --surface-3: #e9e2f5;
  --ink: #1d1730;
  --ink-2: #5b5272;
  --ink-3: #8a82a0;
  --line: rgba(29, 23, 48, .09);
  --line-2: rgba(29, 23, 48, .16);
  --accent: #6a46d6;
  --accent-ink: #ffffff;
  --accent-soft: rgba(106, 70, 214, .12);
  --gold: #a87717;
  --gold-soft: rgba(196, 146, 40, .16);
  --red: #c4314a;
  --red-soft: rgba(196, 49, 74, .12);
  --green: #23855c;
  --green-soft: rgba(35, 133, 92, .12);
  --amber: #b06d00;
  --amber-soft: rgba(214, 140, 20, .15);
  --blue: #2d6fc4;
  --blue-soft: rgba(45, 111, 196, .12);
  --hero-a: #2b1d55;
  --hero-b: #5b3bb5;
  --hero-c: #b0479a;
  --shadow: 0 1px 2px rgba(29, 23, 48, .06), 0 6px 24px rgba(29, 23, 48, .07);
  --shadow-lg: 0 10px 40px rgba(20, 12, 40, .22);
  --r: 20px;
  --r-sm: 14px;
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", serif;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #110d1a; --bg-2: #171125; --surface: #1b1529; --surface-2: #221a34; --surface-3: #2c2342;
    --ink: #efeafb; --ink-2: #b1a7ca; --ink-3: #7f7699; --line: rgba(255, 255, 255, .07); --line-2: rgba(255, 255, 255, .14);
    --accent: #a98bea; --accent-ink: #160f26; --accent-soft: rgba(169, 139, 234, .16);
    --gold: #e7b95a; --gold-soft: rgba(231, 185, 90, .14); --red: #ff6b81; --red-soft: rgba(255, 107, 129, .14);
    --green: #4fd19a; --green-soft: rgba(79, 209, 154, .13); --amber: #f5b04a; --amber-soft: rgba(245, 176, 74, .14);
    --blue: #7fb2ff; --blue-soft: rgba(127, 178, 255, .14);
    --hero-a: #1d1338; --hero-b: #432a8c; --hero-c: #8c2f7a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .28); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #110d1a; --bg-2: #171125; --surface: #1b1529; --surface-2: #221a34; --surface-3: #2c2342;
  --ink: #efeafb; --ink-2: #b1a7ca; --ink-3: #7f7699; --line: rgba(255, 255, 255, .07); --line-2: rgba(255, 255, 255, .14);
  --accent: #a98bea; --accent-ink: #160f26; --accent-soft: rgba(169, 139, 234, .16);
  --gold: #e7b95a; --gold-soft: rgba(231, 185, 90, .14); --red: #ff6b81; --red-soft: rgba(255, 107, 129, .14);
  --green: #4fd19a; --green-soft: rgba(79, 209, 154, .13); --amber: #f5b04a; --amber-soft: rgba(245, 176, 74, .14);
  --blue: #7fb2ff; --blue-soft: rgba(127, 178, 255, .14);
  --hero-a: #1d1338; --hero-b: #432a8c; --hero-c: #8c2f7a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .28); color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.4; }
body { overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- pages */
#stack { position: fixed; inset: 0; }
.page { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; background: var(--bg); -webkit-overflow-scrolling: touch; padding-bottom: 110px; }
.page.sub { z-index: 5; box-shadow: -10px 0 40px rgba(0, 0, 0, .18); animation: pageIn .32s cubic-bezier(.2, .8, .2, 1); }
.page.sub.out { animation: pageOut .24s ease-in forwards; }
.page.under { display: none; }
@keyframes pageIn { from { transform: translateX(40%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pageOut { to { transform: translateX(45%); opacity: 0; } }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

.bar { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); border-bottom: 1px solid transparent; transition: border-color .2s; }
.bar.scrolled { border-bottom-color: var(--line); }
.bar h2 { flex: 1; margin: 0; font: 650 18px/1.2 var(--ui); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title-sm { flex: 1; min-width: 0; font-weight: 650; font-size: 16px; opacity: 0; transform: translateY(4px); transition: .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar.scrolled .title-sm { opacity: 1; transform: none; }
.ibtn { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: var(--ink); flex: none; transition: background .15s, transform .1s; }
.ibtn:active { background: var(--surface-3); transform: scale(.94); }
.mode { height: 34px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); box-shadow: var(--shadow); font-weight: 650; font-size: 13px; color: var(--ink-2); }
.mode b { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.mode.adv { color: var(--green); } .mode.adv b { background: var(--green); }
.mode.dis { color: var(--red); } .mode.dis b { background: var(--red); }

/* ---------- hero */
.hero { position: relative; margin: 6px 0 14px; padding: 18px; border-radius: 26px; color: #fff; overflow: hidden; background: radial-gradient(120% 140% at 100% 0%, var(--hero-c) 0%, transparent 55%), linear-gradient(140deg, var(--hero-a), var(--hero-b)); box-shadow: var(--shadow-lg); }
.hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(1.4px 1.4px at 20% 30%, rgba(255,255,255,.8), transparent), radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,.7), transparent), radial-gradient(1.2px 1.2px at 85% 70%, rgba(255,255,255,.6), transparent), radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,.5), transparent), radial-gradient(1.5px 1.5px at 60% 55%, rgba(255,255,255,.5), transparent); opacity: .7; pointer-events: none; }
.hero-top { position: relative; display: flex; gap: 14px; align-items: center; }
.sigil { width: 66px; height: 66px; border-radius: 22px; flex: none; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22); display: grid; place-items: center; }
.sigil svg { width: 46px; height: 46px; }
.hero h1 { margin: 0; font: 600 25px/1.1 var(--display); letter-spacing: .005em; }
.hero .cls { margin: 4px 0 0; font-size: 13.5px; opacity: .88; }
.hero .chips { position: relative; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.hero .chip { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .16); }
.vbadge { position: relative; margin-top: 12px; width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: rgba(10, 6, 24, .32); border: 1px solid rgba(255, 255, 255, .14); color: #fff; text-align: left; font-size: 13px; }
.vbadge .dot { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.vbadge .dot svg { width: 16px; height: 16px; stroke-width: 2.4; }
.vbadge .grow { flex: 1; min-width: 0; }
.vbadge small { display: block; opacity: .75; font-size: 11.5px; }

/* ---------- cards */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; margin-bottom: 14px; }
.card-h { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
.card-h h3 { flex: 1; margin: 0; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.card-h .link { font-size: 13px; font-weight: 600; color: var(--accent); padding: 4px 6px; margin: -4px -6px; }
.sec-title { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin: 20px 4px 8px; }

/* vitals */
.vitals { display: grid; grid-template-columns: 128px 1fr; gap: 14px; align-items: center; }
.ring { position: relative; width: 128px; height: 128px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--surface-3); }
.ring .val { stroke: var(--green); transition: stroke-dashoffset .6s cubic-bezier(.2, .8, .2, 1), stroke .3s; }
.ring .tmp { stroke: var(--blue); transition: stroke-dashoffset .6s; }
.ring .ctr { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .ctr b { font: 700 32px/1 var(--ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ring .ctr span { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.ring .ctr em { font-style: normal; font-size: 11.5px; color: var(--blue); font-weight: 650; }
.meters { display: grid; gap: 10px; }
.meter-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; color: var(--ink-2); margin-bottom: 5px; }
.meter-h b { color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
.meter { height: 9px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.meter.vit i { background: linear-gradient(90deg, #e2584b, #f39a4b); }
.meter.acu i { background: linear-gradient(90deg, #7b5cf0, #c48af5); }
.meter-note { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
.btnrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.btn { height: 44px; border-radius: 14px; background: var(--surface-2); font-weight: 650; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; transition: transform .1s, background .15s; }
.btn:active { transform: scale(.97); }
.btn svg.i { width: 18px; height: 18px; }
.btn.red { color: var(--red); background: var(--red-soft); }
.btn.green { color: var(--green); background: var(--green-soft); }
.btn.accent { color: var(--accent-ink); background: var(--accent); }
.btn.soft { color: var(--accent); background: var(--accent-soft); }
.btn.ghost { background: transparent; border: 1px solid var(--line-2); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; font-size: 13px; margin-top: 12px; }
.banner.conc { background: var(--blue-soft); color: var(--blue); }
.banner.down { background: var(--red-soft); color: var(--red); }
.banner .grow { flex: 1; }
.banner button { font-weight: 700; }

.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
.stat { background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 10px 4px 8px; text-align: center; position: relative; }
.stat b { display: block; font: 700 20px/1.1 var(--ui); font-variant-numeric: tabular-nums; }
.stat span { display: block; font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 650; margin-top: 3px; }
.stat.ac { background: linear-gradient(160deg, var(--surface), var(--surface-2)); }
.stat.roll::after { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .65; }
.stat .warnmark { color: var(--amber); }

/* resources */
.res { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.res:first-of-type { border-top: 0; padding-top: 2px; }
.res .nm { flex: 1; min-width: 0; }
.res .nm b { display: block; font-size: 14px; font-weight: 650; }
.res .nm small { color: var(--ink-3); font-size: 12px; }
.pips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pip { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--accent); background: var(--accent); transition: .2s; display: grid; place-items: center; }
.pip.used { background: transparent; border-color: var(--line-2); }
.pip.gold { border-color: var(--gold); background: var(--gold); }
.pip.gold.used { background: transparent; border-color: var(--line-2); }
.pip.dia { transform: rotate(45deg) scale(.82); border-radius: 6px; }
.mini { height: 30px; padding: 0 10px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; flex: none; }
.mini.gold { background: var(--gold-soft); color: var(--gold); }

/* abilities */
.abil { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ab { background: var(--surface-2); border-radius: 16px; padding: 10px 6px 9px; text-align: center; position: relative; transition: transform .1s, background .15s; }
.ab:active { transform: scale(.96); background: var(--surface-3); }
.ab .k { font-size: 11px; font-weight: 750; letter-spacing: .1em; color: var(--ink-3); }
.ab .m { font: 750 26px/1.1 var(--ui); margin: 2px 0; letter-spacing: -.02em; }
.ab .s { display: inline-block; font-size: 12px; font-weight: 650; padding: 1px 9px; border-radius: 99px; background: var(--surface); color: var(--ink-2); }
.ab .pf { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }

/* list rows */
.rows { display: grid; grid-template-columns: minmax(0, 1fr); }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); }
.row .ic.gold { background: var(--gold-soft); color: var(--gold); }
.row .ic.red { background: var(--red-soft); color: var(--red); }
.row .ic.blue { background: var(--blue-soft); color: var(--blue); }
.row .ic.green { background: var(--green-soft); color: var(--green); }
.row .ic svg { width: 20px; height: 20px; }
.tx { flex: 1; min-width: 0; }
.tx b { display: block; font-weight: 650; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx small { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .val { font: 700 18px/1 var(--ui); font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
.pill { height: 32px; min-width: 48px; padding: 0 10px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--accent-soft); color: var(--accent); flex: none; transition: transform .1s; }
.pill:active { transform: scale(.94); }
.pill.dmg { background: var(--red-soft); color: var(--red); }
.pill.heal { background: var(--green-soft); color: var(--green); }
.pill.save { background: var(--gold-soft); color: var(--gold); }
.pill.plain { background: var(--surface-2); color: var(--ink-2); }
.tag { display: inline-flex; align-items: center; height: 19px; padding: 0 6px; border-radius: 6px; font-size: 10.5px; font-weight: 750; letter-spacing: .03em; background: var(--surface-3); color: var(--ink-2); vertical-align: 1px; }
.tag.tfl { background: var(--red-soft); color: var(--red); }
.tag.clr { background: var(--gold-soft); color: var(--gold); }
.tag.free { background: var(--accent-soft); color: var(--accent); }
.tag.c { background: var(--blue-soft); color: var(--blue); }

/* explore grid (sub menus) */
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); box-shadow: var(--shadow); border-radius: 18px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 10px; min-height: 104px; transition: transform .12s; }
.tile:active { transform: scale(.97); }
.tile .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
.tile b { font-size: 15px; font-weight: 650; }
.tile small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }

/* launcher */
.launch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 4px; }
.launch button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 2px; border-radius: 16px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.launch button:active { background: var(--surface-2); }
.launch .ic { width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center; }

/* ---------- sheets */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(10, 6, 20, .45); animation: fade .2s; }
.scrim.out { animation: fadeOut .2s forwards; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0; padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); animation: up .3s cubic-bezier(.2, .9, .25, 1); max-width: 720px; margin: 0 auto; }
.sheet.out { animation: down .22s ease-in forwards; }
.sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line-2); margin: 4px auto 12px; }
.sheet h3 { margin: 2px 0 4px; font: 650 20px/1.2 var(--ui); }
.sheet .lead { margin: 0 0 14px; color: var(--ink-2); font-size: 13.5px; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes down { to { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }

/* keypad */
.amount { text-align: center; font: 750 46px/1 var(--ui); letter-spacing: -.02em; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.amount-note { text-align: center; color: var(--ink-3); font-size: 12.5px; min-height: 18px; margin-bottom: 10px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.keypad button { height: 52px; border-radius: 16px; background: var(--surface-2); font: 650 20px var(--ui); }
.keypad button:active { background: var(--surface-3); }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.two { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

/* ---------- forms */
.field { display: grid; gap: 5px; margin-bottom: 12px; }
.field label, .flabel { font-size: 12px; font-weight: 650; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 10px 12px; outline: none; }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.45; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.stepper { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.stepper button { width: 36px; height: 36px; border-radius: 10px; font-size: 20px; font-weight: 600; color: var(--accent); }
.stepper button:active { background: var(--surface-3); }
.stepper output { min-width: 34px; text-align: center; font-weight: 750; font-variant-numeric: tabular-nums; }
.frow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.frow:first-child { border-top: 0; }
.frow .grow { flex: 1; min-width: 0; }
.frow small { display: block; color: var(--ink-3); font-size: 12px; }
.switch { width: 50px; height: 30px; border-radius: 99px; background: var(--surface-3); position: relative; transition: .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: .2s; }
.switch.on { background: var(--accent); }
.switch.on::after { left: 23px; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; height: 36px; border-radius: 9px; font-weight: 650; font-size: 13px; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chipset { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { height: 34px; padding: 0 12px; border-radius: 11px; background: var(--surface-2); font-weight: 600; font-size: 13px; color: var(--ink-2); border: 1px solid transparent; }
.chipbtn.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.chipbtn.bad { background: var(--red-soft); color: var(--red); }
.chipbtn .ct { opacity: .7; margin-left: 4px; }

/* validation */
.vsum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.vsum div { border-radius: 16px; padding: 12px; text-align: center; }
.vsum b { display: block; font: 750 26px/1 var(--ui); }
.vsum span { font-size: 12px; font-weight: 650; }
.vi { display: flex; gap: 12px; padding: 12px 2px; border-top: 1px solid var(--line); }
.vi:first-child { border-top: 0; }
.vi .dot { width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.vi .dot svg { width: 16px; height: 16px; stroke-width: 2.4; }
.vi b { font-weight: 650; font-size: 14px; display: block; }
.vi p { margin: 3px 0 0; color: var(--ink-2); font-size: 13px; }
.vi .area { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.lv-error .dot { background: var(--red-soft); color: var(--red); }
.lv-warn .dot { background: var(--amber-soft); color: var(--amber); }
.lv-info .dot { background: var(--blue-soft); color: var(--blue); }
.lv-ok .dot { background: var(--green-soft); color: var(--green); }
.audit { width: 100%; border-collapse: collapse; font-size: 13px; }
.audit th { text-align: left; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; padding: 0 4px 6px; }
.audit td { padding: 7px 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.audit td:nth-child(2), .audit td:nth-child(3), .audit th:nth-child(2), .audit th:nth-child(3) { text-align: right; }
.audit .ok { color: var(--green); font-weight: 700; text-align: center; }
.audit .no { color: var(--amber); font-weight: 700; text-align: center; }
.audit small { display: block; color: var(--ink-3); font-size: 11px; }

details.x { border-top: 1px solid var(--line); }
details.x:first-child { border-top: 0; }
details.x > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 2px; cursor: pointer; }
details.x > summary::-webkit-details-marker { display: none; }
details.x > summary .chev { transition: transform .2s; color: var(--ink-3); }
details.x[open] > summary .chev { transform: rotate(90deg); }
details.x .body { padding: 0 2px 14px 50px; color: var(--ink-2); font-size: 13.5px; }
details.x .body p { margin: 0 0 10px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* gear */
.loadbar { position: relative; height: 12px; border-radius: 99px; background: var(--surface-3); overflow: visible; margin: 18px 0 26px; }
.loadbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--green); transition: width .4s; }
.loadbar.enc i { background: var(--amber); } .loadbar.heavy i, .loadbar.over i { background: var(--red); }
.loadbar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink-3); border-radius: 2px; }
.loadbar .tick span { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.coins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.coin { text-align: center; }
.coin .face { width: 100%; aspect-ratio: 1; max-width: 54px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.coin input { width: 100%; text-align: center; height: 36px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); }
.c-pp { background: linear-gradient(145deg, #e8eef5, #a9b6c6); color: #2b3443; }
.c-gp { background: linear-gradient(145deg, #ffe08a, #d39a1c); color: #4a3200; }
.c-ep { background: linear-gradient(145deg, #e7e3cf, #b5a978); color: #3c351c; }
.c-sp { background: linear-gradient(145deg, #f3f4f7, #b7bcc6); color: #33373f; }
.c-cp { background: linear-gradient(145deg, #f0b48a, #b8622e); color: #3d1a05; }
.item { display: grid; grid-template-columns: 1fr 86px 58px 32px; gap: 6px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item input { height: 38px; padding: 6px 8px; border-radius: 10px; border: 1px solid transparent; background: var(--surface-2); width: 100%; min-width: 0; }
.item input:focus { border-color: var(--accent); outline: none; }
.item .del { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-3); }

/* conditions, saves */
.dsave { display: flex; gap: 8px; align-items: center; }
.dsave .pip { width: 22px; height: 22px; border-radius: 50%; }
.dsave .pip.f { border-color: var(--red); background: var(--red); }
.dsave .pip.s { border-color: var(--green); background: var(--green); }
.dsave .pip.used { background: transparent; border-color: var(--line-2); }

/* ---------- FAB + dice layer */
.fab { position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 20; width: 62px; height: 62px; border-radius: 22px; background: linear-gradient(145deg, #7a55ea, #4b2fb0); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 28px rgba(74, 44, 170, .45), inset 0 1px 0 rgba(255, 255, 255, .25); transition: transform .15s; }
.fab:active { transform: scale(.92) rotate(-8deg); }
.fab svg { width: 32px; height: 32px; stroke-width: 1.6; }
#dice-layer { position: fixed; inset: 0; z-index: 50; display: none; }
#dice-layer.on { display: block; }
#dice-layer .dim { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 35%, rgba(40, 24, 80, .55), rgba(8, 4, 18, .82)); animation: fade .25s; }
#dice-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.result { position: absolute; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; background: var(--surface); border-radius: 26px; padding: 16px; box-shadow: var(--shadow-lg); transform: translateY(130%); transition: transform .38s cubic-bezier(.2, .9, .25, 1.1); }
.result.show { transform: none; }
.result .lbl { display: flex; align-items: center; gap: 8px; font-weight: 650; }
.result .lbl small { color: var(--ink-3); font-weight: 600; margin-left: auto; font-size: 12px; }
.result .total { display: flex; align-items: baseline; gap: 12px; margin: 6px 0 8px; }
.result .total b { font: 800 56px/1 var(--ui); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.result .total .flag { font-weight: 800; font-size: 13px; letter-spacing: .08em; padding: 4px 9px; border-radius: 8px; }
.flag.crit { background: var(--gold-soft); color: var(--gold); }
.flag.fumble { background: var(--red-soft); color: var(--red); }
.flag.okf { background: var(--green-soft); color: var(--green); }
.result .bd { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--ink-2); font-size: 13px; margin-bottom: 12px; }
.die-chip { min-width: 30px; height: 30px; padding: 0 8px; border-radius: 9px; background: var(--surface-2); display: inline-grid; place-items: center; font-weight: 750; color: var(--ink); font-variant-numeric: tabular-nums; }
.die-chip small { font-size: 9px; color: var(--ink-3); font-weight: 650; display: block; line-height: 1; margin-top: -1px; }
.die-chip.drop { text-decoration: line-through; opacity: .45; }
.die-chip.max { background: var(--gold-soft); color: var(--gold); }
.die-chip.min { background: var(--red-soft); color: var(--red); }
.result .acts { margin-top: 0; }
.result .acts .btn { flex: 1 1 auto; }
.result .hint { text-align: center; color: var(--ink-3); font-size: 11.5px; margin-top: 10px; }
.shuffle { animation: shake .5s; }
@keyframes shake { 20% { transform: rotate(-6deg) scale(1.05); } 40% { transform: rotate(5deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(2deg); } }

/* dice tray */
.tray { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.dbtn { position: relative; height: 74px; border-radius: 18px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 750; font-size: 13px; transition: transform .1s; }
.dbtn:active { transform: scale(.94); }
.dbtn svg { width: 32px; height: 32px; color: var(--accent); stroke-width: 1.5; }
.dbtn .cnt { position: absolute; top: 6px; right: 8px; min-width: 20px; height: 20px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 11.5px; display: grid; place-items: center; padding: 0 5px; }
.palette { display: flex; gap: 10px; flex-wrap: wrap; }
.palette button { width: 44px; height: 44px; border-radius: 14px; border: 3px solid transparent; }
.palette button.on { border-color: var(--accent); }
.log .row .val { font-size: 20px; }

.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translate(-50%, -16px); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 600; opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); box-shadow: var(--shadow-lg); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.empty { color: var(--ink-3); font-size: 13px; padding: 6px 2px; }
.muted { color: var(--ink-3); }
.note { font-size: 12.5px; color: var(--ink-3); margin: 6px 2px 0; }
@media (min-width: 560px) { .stats { gap: 10px; } .grid2 { grid-template-columns: repeat(3, 1fr); } }
@media (prefers-reduced-motion: reduce) { .page.sub, .sheet, .scrim { animation: none; } }
</style>
