ACT.statInfo=el=>{const c=C(),K=calc(c),k=el.dataset.k;const pl=c.pl;const R=s=>K.R(s,'cur');const A=a=>K.A[a].cur;
  const info={
    bd:[`(AGI ${A('AGI')} + SEN ${A('SEN')} + Dodge ${R('Dodge')}) × 2`,'Attacks that don\'t reach your Base Defense miss automatically. Ranged attacks add Range Dice to it.'],
    md:[`(WILL ${A('WILL')} + Fate ${A('FATE')} + Focus ${R('Focus')}) × 2`,'Hostile Spells must beat Magic Defense + Spell Dice.'],
    med:[`(EMP ${A('EMP')} + WILL ${A('WILL')} + Courage ${R('Courage')}) × 2`,'Used like Base Defense against some mental attacks.'],
    wl:[`4 + STR ${A('STR')} + END ${A('END')} + WILL ${A('WILL')} + Resilience ${R('Resilience')} + PL ${pl}`,'TSV at or above WL deals a Wound; at or above half deals an Injury; double WL forces a Death Roll.'],
    tl:[`4 + WILL ${A('WILL')} + EMP ${A('EMP')} + PRE ${A('PRE')} + Courage ${R('Courage')} + PL ${pl}`,'Mental attacks at or above TL deal a Mental Wound; half deals an Injury; double forces an Insanity Roll.']}[k];
  openModal({title:{bd:'Base Defense',md:'Magic Defense',med:'Mental Defense',wl:'Wound Level',tl:'Terror Level'}[k],body:`<div class="note">${info[0]}${(k==='wl'&&(hasAbil(c,'Grit I')||hasAbil(c,'Grit II')))||(k==='bd'&&hasAbil(c,'Hard to Hit I'))||(k==='tl'&&hasAbil(c,'Unbreakable I'))||(k==='md'&&hasAbil(c,'Magical Null I'))||(k==='med'&&hasAbil(c,'Mental Conditioning I'))?' + ability bonuses':''}${c.mods&&c.mods[k]?` ${sgn(c.mods[k])} misc`:''}</div><p class="muted">${info[1]}</p>`});};
ACT.openLog=()=>{const c=C();openModal({title:'Roll log',sub:'Most recent first',body:c.log.length?`<div class="list">${c.log.map(l=>`<div class="log-item"><b>${l.total}</b><div class="d"><strong>${esc(l.label)}</strong>${l.pen?` · net ${l.net}`:''}${l.tn!=null?` · TN ${l.tn}: <span class="${l.ok?'good':'bad'}">${l.ok?l.los+' LoS':(-l.los)+' LoF'}</span>`:''}${l.ex?` · ${l.ex} explosion${l.ex>1?'s':''}`:''}<br><span class="faint">${new Date(l.t).toLocaleString()}</span></div></div>`).join('')}</div>`:'<div class="empty">No rolls yet.</div>',foot:c.log.length?`<button class="btn danger" id="lg-clr">Clear log</button><button class="btn" data-close>Close</button>`:'',onMount:m=>{const b=$('#lg-clr',m);if(b)b.onclick=()=>{c.log=[];touch(c);closeModal(true);};}});};
ACT.sheetMenu=()=>{const c=C();
  openModal({title:'Character',body:`<div class="stack">
    <button class="btn block" id="mn-rest">End encounter & rest</button>
    <button class="btn block" id="mn-opt">Optional rules</button>
    <button class="btn block" id="mn-comp">${IC.book} Rules compendium</button>
    <button class="btn block" id="mn-exp">Export character (JSON)</button>
    <button class="btn block" id="mn-dup">Duplicate character</button>
    <button class="btn block" id="mn-theme">${IC.sun} Theme: ${STORE.theme}</button>
    <button class="btn block danger" id="mn-del">${IC.trash} Delete character</button></div>`,
    onMount:m=>{
      $('#mn-rest',m).onclick=()=>{closeModal(true);ACT.rest();};
      $('#mn-opt',m).onclick=()=>{closeModal(true);openOptions(c);};
      $('#mn-comp',m).onclick=()=>{closeModal(true);openCompendium();};
      $('#mn-exp',m).onclick=()=>{closeModal(true);exportChars([c]);};
      $('#mn-dup',m).onclick=()=>{const d=deep(c);d.id=uid();d.bio.name=(d.bio.name||'Unnamed')+' (copy)';STORE.chars.push(d);save();closeModal(true);UI.charId=d.id;render();toast('Duplicated');};
      $('#mn-theme',m).onclick=()=>{cycleTheme();closeModal(true);ACT.sheetMenu();};
      $('#mn-del',m).onclick=()=>{confirmBox(`Delete <b>${esc(c.bio.name||'this character')}</b>? This can't be undone.`,'Delete',()=>{deleteChars([c.id]);UI.view='home';render();toast('Character deleted');});};
    }});};
function openOptions(c){
  const o=c.opt;
  const row=(k,l,s)=>`<label class="opt-row"><span>${l}<small>${s}</small></span><input type="checkbox" data-opt="${k}" ${o[k]?'checked':''} style="width:20px;height:20px;accent-color:var(--steel)"></label>`;
  openModal({title:'Optional rules',sub:'Per character. Match your GM\'s table.',body:`
    ${row('deadlyHead','Deadlier head strikes','Head hits add 10 instead of 5.')}
    ${row('lessWE','Less impactful Wound Effects','+1 Wound Effect Die on every wound.')}
    ${row('falterHard','Harder Falter Rolls','Falter Rolls don\'t add Wound Level.')}
    ${row('enc','Encumbrance','Track Encumbrance Points against (END + Stamina) × 10.')}
    ${row('moreSpells','More Spells & Powers','Focus × 3 instead of × 2.')}
    <div class="opt-row"><span>Death Rolls<small>Standard adds WL; dangerous adds nothing; safer adds WL × 2.</small></span><select id="op-death" style="width:auto">${[['std','Standard'],['danger','More dangerous'],['safe','Less dangerous']].map(([k,l])=>`<option value="${k}" ${o.death===k?'selected':''}>${l}</option>`).join('')}</select></div>`,
    onMount:m=>{$$('[data-opt]',m).forEach(cb=>cb.onchange=()=>{o[cb.dataset.opt]=cb.checked;touch(c);});$('#op-death',m).onchange=e=>{o.death=e.target.value;touch(c);};},onClose:()=>refreshView(true)});
}

/* ===================== COMBAT: AP track, defenses, weapons, armor, wounds ===================== */
const WE_TABLES={
 Head:[['Critical',['INT','SEN','COM']],['Critical',['INT','SEN']],['Critical',['INT','COM']],['Critical',['SEN','COM']],['Critical',['INT']],['Critical',['SEN']],['Critical',['COM']],['Serious',['INT','SEN','COM']],['Serious',['INT','SEN']],['Serious',['INT','COM']],['Serious',['SEN','COM']],['Serious',['INT']],['Serious',['SEN']],['Serious',['COM']],['Minor',['INT','SEN']],['Minor',['INT','COM']],['Minor',['SEN','COM']],['Minor',['INT']],['Minor',['SEN']],['Minor',['COM']]],
 Torso:[['Critical',['STR','END','DEX']],['Critical',['STR','END']],['Critical',['STR','DEX']],['Critical',['END','DEX']],['Critical',['STR']],['Critical',['END']],['Critical',['DEX']],['Serious',['STR','END','DEX']],['Serious',['STR','END']],['Serious',['STR','DEX']],['Serious',['END','DEX']],['Serious',['STR']],['Serious',['END']],['Serious',['DEX']],['Minor',['STR','END']],['Minor',['STR','DEX']],['Minor',['END','DEX']],['Minor',['STR']],['Minor',['END']],['Minor',['DEX']]],
 Arm:[['Critical',['STR','AGI','DEX']],['Critical',['STR','AGI']],['Critical',['STR','DEX']],['Critical',['AGI','DEX']],['Critical',['STR']],['Critical',['AGI']],['Critical',['DEX']],['Serious',['STR','AGI','DEX']],['Serious',['STR','AGI']],['Serious',['STR','DEX']],['Serious',['AGI','DEX']],['Serious',['STR']],['Serious',['AGI']],['Serious',['DEX']],['Minor',['STR','AGI']],['Minor',['STR','DEX']],['Minor',['AGI','DEX']],['Minor',['STR']],['Minor',['AGI']],['Minor',['DEX']]],
 Leg:[['Critical',['STR','AGI','END']],['Critical',['STR','AGI']],['Critical',['STR','END']],['Critical',['AGI','END']],['Critical',['STR']],['Critical',['AGI']],['Critical',['END']],['Serious',['STR','AGI','END']],['Serious',['STR','AGI']],['Serious',['STR','END']],['Serious',['AGI','END']],['Serious',['STR']],['Serious',['AGI']],['Serious',['END']],['Minor',['STR','AGI']],['Minor',['STR','END']],['Minor',['AGI','END']],['Minor',['STR']],['Minor',['AGI']],['Minor',['END']]],
 Mental:[['Critical',['WILL','EMP','PRE']],['Critical',['WILL','PRE']],['Critical',['EMP','PRE']],['Critical',['WILL','EMP']],['Critical',['WILL']],['Critical',['EMP']],['Critical',['PRE']],['Serious',['WILL','EMP','PRE']],['Serious',['WILL','PRE']],['Serious',['EMP','PRE']],['Serious',['WILL','EMP']],['Serious',['WILL']],['Serious',['EMP']],['Serious',['PRE']],['Minor',['WILL','EMP','PRE']],['Minor',['WILL','PRE']],['Minor',['EMP','PRE']],['Minor',['WILL','EMP']],['Minor',['WILL']],['Minor',['EMP']]]
};
function locBase(loc){return /Head/.test(loc)?'Head':/Arm/.test(loc)?'Arm':/Leg/.test(loc)?'Leg':/Torso/.test(loc)?'Torso':'Mental';}
function armorLoc(loc){return /Head/.test(loc)?'Head':/Arm/.test(loc)?'Arms':/Leg/.test(loc)?'Legs':'Torso';}
function severity(c,w){const K=calc(c);const lvl=w.type==='M'?K.tl.max:K.wl.max;const d=w.tsv-lvl;return d>=11?'Terrible':d>=5?'Moderate':'Superficial';}
function weDice(c,w){const sev=severity(c,w);let n=sev==='Superficial'?2:sev==='Moderate'?1:0;if(c.opt.lessWE)n++;if(w.type==='M')n+=traitLv(c,'Indomitable');return n;}
function rollWoundEffect(c,w){const n=3+weDice(c,w);const dice=rollPlain(n);const tot=sum(dice);const tbl=WE_TABLES[w.type==='M'?'Mental':locBase(w.loc)];
  if(tot>=23)return {rank:'None',attrs:[],roll:tot,dice};const e=tbl[tot-3];return {rank:e[0],attrs:e[1].slice(),roll:tot,dice};}
function weaponQ(w,name){const m=(w.q||'').match(new RegExp(name+'\\s*(\\d+)','i'));return m?+m[1]:((w.q||'').match(new RegExp('\\b'+name+'\\b','i'))?true:0);}
function aspectsOf(w){return {S:w.s||0,P:w.p||0,B:w.b||0,O:w.o||0};}
function bestAspect(w){const a=aspectsOf(w);return Object.entries(a).sort((x,y)=>y[1]-x[1])[0][0];}
const ASPN={S:'Slashing',P:'Piercing',B:'Bludgeoning',O:'Other'};

function tabCombat(c,K){
  const ord=[...c.cbt.track,{id:'me',name:c.bio.name||'You',ap:c.cbt.ap,init:c.cbt.init==null?-1:c.cbt.init,me:true}].sort((a,b)=>a.ap-b.ap||(b.init-a.init));
  const whBoxes=[];for(let i=0;i<K.wth;i++)whBoxes.push(`<i class="${i<K.wh?'on':''}"></i>`);if(c.cbt.wh>K.wth)whBoxes.push(`<i class="over" title="Over threshold"></i>`);
  const physW=c.wounds.filter(w=>w.type!=='M'),mentW=c.wounds.filter(w=>w.type==='M');
  return `
  <div class="grid2" style="margin-bottom:14px">
    <div class="panel"><div class="sec">Combat track<span class="act"><button class="btn sm" data-act="newCombat">New combat</button></span></div>
      <div class="ap-big">
        <div><div class="lbl" style="text-align:center">My AP</div><div class="ap-num">${c.cbt.ap}</div></div>
        <div class="stack" style="flex:1;gap:8px">
          <div class="ap-quick">${[1,2,3,4,5].map(n=>`<button class="btn sm" data-act="apAdd" data-n="${n}">+${n}</button>`).join('')}<button class="btn sm ghost" data-act="apAdd" data-n="-1" aria-label="Undo 1 AP">−1</button></div>
          <div class="row"><button class="btn sm pri" data-act="actionPicker">Take an action</button><button class="btn sm" data-act="rollInit">Initiative${c.cbt.init!=null?`: <b class="num">${c.cbt.init}</b>`:''}</button></div>
        </div>
      </div>
      <details style="margin-top:10px" ${c.cbt.track.length?'open':''}><summary class="lbl" style="padding:6px 0">Turn order (${ord.length}) · lowest AP acts next</summary>
        <div class="track" style="margin-top:6px">${ord.map((t,i)=>`<div class="trk${t.me?' me':''}${i===0?' next':''}"><span class="ord">${i+1}</span><span>${esc(t.name)} <span class="faint" style="font-size:12px">init ${t.init<0?'—':t.init}</span></span>
          ${t.me?`<span class="num"><b>${t.ap}</b> AP</span><span></span>`:`<span class="row nw" style="gap:4px"><button class="btn sm" data-act="trkAp" data-id="${t.id}" data-n="1">+1</button><button class="btn sm" data-act="trkAp" data-id="${t.id}" data-n="3">+3</button><b class="num" style="min-width:28px;text-align:right">${t.ap}</b></span><button class="icon-btn" data-act="trkDel" data-id="${t.id}" aria-label="Remove">${IC.x}</button>`}</div>`).join('')}</div>
        <div class="row" style="margin-top:8px"><input type="text" id="trk-n" placeholder="Ally or enemy name" style="flex:2;min-width:140px"><input type="number" id="trk-i" placeholder="Init" class="inline-num" style="width:76px"><button class="btn sm" data-act="trkAdd">${IC.plus} Add</button></div>
      </details>
    </div>
    <div class="panel"><div class="sec">Condition<span class="act"><button class="btn sm" data-act="rest">Rest</button></span></div>
      <div class="hp-strip">
        <div><div class="lbl">Wound Hardships ${K.wh}/${K.wth}</div><div class="meter" style="margin-top:5px">${whBoxes.join('')}</div><div class="row" style="margin-top:6px">${stepper('cbt:wh',c.cbt.wh,0,20)}</div></div>
        <div><div class="lbl">Injuries (−3 each)</div><div style="font-size:30px;font-weight:800;color:${K.inj?'var(--ember)':'var(--ink-3)'}" class="num">${K.inj?-3*K.inj:0}</div><div class="row" style="margin-top:2px">${stepper('cbt:inj',c.cbt.inj,0,30)}</div></div>
      </div>
      <div class="thr" style="margin-top:12px"><div><small>Injury</small><b>${K.il.cur}</b></div><div><small>Wound</small><b>${K.wl.cur}</b></div><div><small>Mortal</small><b>${K.mth.cur}</b></div><div><small>Instant ☠</small><b>${K.mth.cur*2}</b></div></div>
      <div class="thr" style="margin-top:6px"><div><small>Fear</small><b>${K.fl.cur}</b></div><div><small>Terror</small><b>${K.tl.cur}</b></div><div><small>Insanity</small><b>${K.ith.cur}</b></div><div><small>Mental AR</small><b>${K.mar}</b></div></div>
      <div class="row" style="margin-top:12px"><button class="btn sm pri" data-act="takeHit">Take a hit</button><button class="btn sm" data-act="deathRoll">Death roll</button><button class="btn sm" data-act="falterRoll">Falter roll</button><button class="btn sm" data-act="insanityRoll">Insanity roll</button></div>
    </div>
  </div>
  <div class="sec">Defense</div>
  <div class="stats" style="margin-bottom:8px">
    <div class="stat key"><span class="k">Base Def.</span><span class="v">${K.bd.cur}</span><span class="s">passive</span></div>
    <button class="stat" data-act="rollDef" data-kind="dodge"><span class="k">Dodge</span><span class="v num">${(()=>{const p=poolFor(K.A[govAttr(c,'Dodge')].cur,K.R('Dodge','cur'),0,0);return `r${p.rolled}/k${p.kept}`;})()}</span><span class="s">1 AP · tap to roll</span></button>
    ${c.weapons.filter(w=>w.equipped!==false&&!w.ranged||weaponQ(w,'Shield')).map((w,i)=>`<button class="stat" data-act="rollDef" data-kind="parry" data-w="${w.id}"><span class="k">${weaponQ(w,'Shield')?'Block':'Parry'}</span><span class="v" style="font-size:16px;line-height:1.5">${esc(w.n)}</span><span class="s">${esc(w.skill)}${weaponQ(w,'Shield')?` · +${weaponQ(w,'Shield')*c.pl}`:''}</span></button>`).join('')}
  </div>
  ${K.shield?`<div class="faint" style="font-size:13px;margin-bottom:14px">Shield modifier +${K.shield} (${esc(K.shieldName)}) on Block/Parry. Shields can block ranged attacks with 1 Hardship.</div>`:'<div style="height:6px"></div>'}
  <div class="sec">Weapons<span class="act"><button class="btn sm" data-act="addWeapon">${IC.plus} Add</button></span></div>
  ${c.weapons.length?`<div class="grid2" style="margin-bottom:16px">${c.weapons.map(w=>weaponCard(c,K,w)).join('')}</div>`:`<div class="empty" style="margin-bottom:16px">No weapons. Add one from the ${c.era} list or make your own.</div>`}
  <div class="sec">Armor${K.shield?` · Shield +${K.shield}`:''}</div>
  <div class="panel" style="margin-bottom:16px;padding:6px 12px"><div class="hscroll"><table class="armor-tbl"><thead><tr><th>Location</th><th>Piece</th><th>Slash</th><th>Pierce</th><th>Bludg.</th><th>Other</th><th></th></tr></thead><tbody>
    ${LOCS.map(L=>{const a=K.ar[L];return `<tr><td><b>${L}</b></td><td class="pc">${a.piece?esc(a.piece.n)+(a.piece.q?` <span class="faint">· ${esc(a.piece.q)}</span>`:''):'<span class="faint">—</span>'}</td><td>${a.S}</td><td>${a.P}</td><td>${a.B}</td><td>${a.O}</td><td><button class="btn sm ghost" data-act="setArmor" data-l="${L}">${a.piece?'Change':'Equip'}</button></td></tr>`;}).join('')}
  </tbody></table></div><div class="faint" style="font-size:12.5px;padding:6px 0">Values include +${c.pl} for Power Level on worn pieces${traitLv(c,'Impervious')||traitList(c,'Natural Armor').length?' and ancestry armor':''}. Medieval armor is halved vs Modern weapons and useless vs Futuristic; Modern armor is halved vs Futuristic.</div></div>
  <div class="sec">Wounds<span class="act"><button class="btn sm" data-act="addWound">${IC.plus} Record</button></span></div>
  ${c.wounds.length?`<div class="stack" style="margin-bottom:16px">${physW.concat(mentW).map(w=>woundCard(c,K,w)).join('')}</div>`:'<div class="empty" style="margin-bottom:16px">No wounds. Use <b>Take a hit</b> during a fight and wounds are recorded for you.</div>'}
  <div class="sec">Actions quick reference</div>
  <details class="panel"><summary class="row"><b>Offensive & defensive actions</b><span class="spacer"></span><span class="faint">${DB.actions.length} actions</span></summary><div class="list" style="margin-top:8px">${DB.actions.map(a=>`<div class="item"><span class="pill ${a.k==='Defensive'?'moss':'steel'}">${a.ap} AP</span><div class="main"><b>${esc(a.n)}</b> <span class="faint" style="font-size:12.5px">${esc(a.ty)} · p.${a.pg}</span><p>${esc(a.d)}</p></div></div>`).join('')}</div></details>`;
}
function weaponCard(c,K,w){
  const a=aspectsOf(w),best=bestAspect(w);
  const ammo=w.ranged&&w.ammo&&/\d+\/\d+/.test(w.ammo);
  const cap=ammo?+w.ammo.split('/')[1]:0;
  const p=poolFor(K.A[govAttr(c,w.skill)].cur,K.R(w.skill,'cur'),0,0);
  return `<div class="wcard"><div class="hd"><div class="t"><b>${esc(w.n)}</b><div class="faint" style="font-size:12.5px">${esc(w.skill)} · r${p.rolled}/k${p.kept}${w.ranged?` · Range ${w.range||'—'} · ROF ${esc(w.rof||1)}`:''}${w.era?` · ${w.era}`:''}</div></div>
    <button class="icon-btn" data-act="editWeapon" data-w="${w.id}" aria-label="Edit weapon">${IC.edit}</button></div>
    <div class="aspects">${['S','P','B','O'].map(k=>`<div class="${a[k]===0?'zero':''}${k===best&&a[k]?' hi':''}"><small>${ASPN[k].slice(0,5).toUpperCase()}</small><b>${a[k]}</b></div>`).join('')}</div>
    ${w.q?`<div class="tagrow">${w.q.split(',').map(q=>q.trim()).filter(Boolean).map(q=>`<button class="chip" data-act="qInfo" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`:''}
    <div class="row">${ammo?`<span class="row nw" style="gap:6px"><span class="lbl">Ammo</span>${stepper('ammo:'+w.id,w.ammoCur==null?cap:w.ammoCur,0,cap)}<button class="btn sm" data-act="reload" data-w="${w.id}">Reload</button></span>`:''}<span class="spacer"></span><button class="btn pri" data-act="attack" data-w="${w.id}">${IC.dice} Attack</button></div>
  </div>`;
}
function woundCard(c,K,w){
  const sev=severity(c,w);const e=w.eff;const heal=w.heal||{};
  const effTxt=!e?'<span class="warn">Effect not rolled yet</span>':e.rank==='None'?'No lasting effect':`${e.rank}: ${e.attrs.map(a=>`${a}${heal[a]?` <span class="good">(healed${e.rank!=='Minor'?' '+heal[a]:''})</span>`:''}`).join(', ')} <span class="faint">${e.rank==='Critical'?'−2 each':e.rank==='Serious'?'−1 each':'−3 on checks'}</span>`;
  const done=e&&(e.rank==='None'||e.attrs.every(a=>(e.rank==='Minor'?heal[a]:(heal[a]||0)>=(e.rank==='Critical'?2:1))));
  return `<div class="wound${w.type==='M'?' mental':''}${done?' healed':''}${w.perm?' perm':''}">
    <div class="row"><b>${w.type==='M'?'Mental wound':esc(w.loc)}</b><span class="pill ${sev==='Terrible'?'blood':sev==='Moderate'?'ember':''}">${sev}</span><span class="pill">TSV ${w.tsv}</span>${w.perm?'<span class="pill">Permanent</span>':''}<span class="spacer"></span>
    <span class="treat" title="Treatments">${[0,1,2].map(i=>`<i class="${w.treated&&w.treated[i]?'on':''}"></i>`).join('')}</span></div>
    <div style="font-size:14px">${effTxt}</div>
    ${w.notes?`<div class="faint" style="font-size:13px">${esc(w.notes)}</div>`:''}
    <div class="row">${!e?`<button class="btn sm pri" data-act="rollWE" data-w="${w.id}">Roll wound effect</button>`:''}${e&&!done&&!w.perm?`<button class="btn sm" data-act="treatWound" data-w="${w.id}">Treat</button>`:''}<button class="btn sm ghost" data-act="editWound" data-w="${w.id}">Edit</button></div>
  </div>`;
}

/* ---------- actions */
ACT.apAdd=el=>{const c=C();c.cbt.ap=Math.max(0,c.cbt.ap+(+el.dataset.n));touch(c);refreshView(true);};
ACT.newCombat=()=>{const c=C();c.cbt.ap=0;c.cbt.init=null;c.cbt.track.forEach(t=>t.ap=0);touch(c);refreshView(true);toast('AP reset. Roll Initiative.');};
ACT.trkAdd=()=>{const c=C();const n=$('#trk-n').value.trim();if(!n)return toast('Enter a name');c.cbt.track.push({id:uid(),name:n,ap:0,init:+($('#trk-i').value||0)});touch(c);refreshView(true);};
ACT.trkAp=el=>{const c=C();const t=c.cbt.track.find(x=>x.id===el.dataset.id);if(t)t.ap+=(+el.dataset.n);touch(c);refreshView(true);};
ACT.trkDel=el=>{const c=C();c.cbt.track=c.cbt.track.filter(x=>x.id!==el.dataset.id);touch(c);refreshView(true);};
ACT.actionPicker=()=>{const c=C();let f='Offensive';
  const draw=()=>{const b=modalBody();b.innerHTML=`<div class="seg" style="align-self:flex-start"><button data-f="Offensive" aria-pressed="${f==='Offensive'}">Offensive</button><button data-f="Defensive" aria-pressed="${f==='Defensive'}">Defensive</button></div>
   <div class="list">${DB.actions.filter(a=>a.k===f).map(a=>{const opts=a.ap.includes('-')||a.ap==='X'?(a.ap==='X'?[1,2,3,4,5]:(()=>{const m=a.ap.match(/(\d+)\s*-\s*(\d+)/);const r=[];if(m)for(let i=+m[1];i<=+m[2];i++)r.push(i);return r;})()):[parseInt(a.ap)];return `<div class="item"><div class="main"><b>${esc(a.n)}</b> <span class="faint" style="font-size:12.5px">${esc(a.ty)}</span><p>${esc(a.d)}</p></div><div class="row nw" style="gap:4px">${opts.map(n=>`<button class="btn sm" data-ap="${n}" data-n="${esc(a.n)}">${n} AP</button>`).join('')}</div></div>`;}).join('')}</div>`;
   $$('[data-f]',b).forEach(x=>x.onclick=()=>{f=x.dataset.f;draw();});
   $$('[data-ap]',b).forEach(x=>x.onclick=()=>{c.cbt.ap+=+x.dataset.ap;c.log.unshift({t:Date.now(),label:`${x.dataset.n} (${x.dataset.ap} AP)`,total:c.cbt.ap,net:c.cbt.ap,ok:null,tn:null,pen:0,ex:0});touch(c);closeModal(true);refreshView(true);toast(`${x.dataset.n}: now at ${c.cbt.ap} AP`);});};
  openModal({title:'Take an action',sub:'Adds its AP to your place on the Combat Track',body:'',onMount:draw});};
ACT.rollInit=()=>{const c=C();const useLead=hasAbil(c,'Tactical Advantage');
  const sk=useLead&&rank(c,'Leadership')>rank(c,'Reaction')?'Leadership':'Reaction';
  openRoll(c,{skill:sk,title:'Initiative',sub:`${sk} check · ties go to higher SEN, then Reaction rank`,ctx:{init:true},onResult:res=>{c.cbt.init=res.net;c.cbt.ap=0;}});};
ACT.qInfo=el=>{const q=el.dataset.q;const base=q.replace(/\s*\d+.*$/,'').trim();const e=DB.wq.find(x=>x.n.replace(/ X.*$/,'')===base)||DB.aq.find(x=>x.n.replace(/ X.*$/,'')===base);openModal({title:q,body:`<p>${esc(e?e.d:'Custom quality.')}</p>`});};
ACT.reload=el=>{const c=C();const w=c.weapons.find(x=>x.id===el.dataset.w);w.ammoCur=+w.ammo.split('/')[1];touch(c);refreshView(true);toast(`Reloaded (${weaponQ(w,'Slow')?'Reload Slow, 5 AP':'3 AP'})`);};
ACT.rest=()=>{const c=C();const newW=c.wounds.filter(w=>!w.eff);
  openModal({title:'End encounter & rest',body:`<p>Clears ${c.cbt.wh} Wound Hardship${c.cbt.wh===1?'':'s'} and ${c.cbt.inj} Injur${c.cbt.inj===1?'y':'ies'}, and resets AP. Wounds themselves stay until healed.</p>${newW.length?`<label class="check"><input type="checkbox" id="rs-we" checked> Roll Wound Effects for ${plural(newW.length,'new wound')}</label>`:''}`,
   foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="rs-go">Rest</button>`,onMount:m=>$('#rs-go',m).onclick=()=>{
     c.cbt.wh=0;c.cbt.inj=0;c.cbt.ap=0;c.cbt.init=null;const cb=$('#rs-we',m);let msg='Rested';
     if(cb&&cb.checked){newW.forEach(w=>{w.eff=rollWoundEffect(c,w);});msg=`Rested. ${newW.map(w=>w.eff.rank==='None'?'no effect':w.eff.rank+' '+w.eff.attrs.join('/')).join('; ')}`;}
     touch(c);closeModal(true);refreshView(true);toast(msg);}});};

/* ---------- defense rolls */
ACT.rollDef=el=>{const c=C(),K=calc(c),kind=el.dataset.kind;
  if(kind==='dodge')return openRoll(c,{skill:'Dodge',title:'Dodge',sub:'Reactive · 1 AP · not vs ranged unless adjacent or thrown',ap:1,ctx:{}});
  const w=c.weapons.find(x=>x.id===el.dataset.w);const shield=weaponQ(w,'Shield');const def=+weaponQ(w,'Defensive')||0;
  const armDef=Math.max(0,...LOCS.map(L=>c.armor[L]?(+((c.armor[L].q||'').match(/Defensive\s*(\d+)/i)||[])[1]||0):0));
  const unw=+weaponQ(w,'Unwieldy')||0;const mods=[];
  if(def)mods.push({label:`${w.n}: Defensive ${def}${hasAbil(c,'Duelist')?' +1 (Duelist)':''}`,ben:def+(hasAbil(c,'Duelist')?1:0),src:'weapon'});
  if(armDef)mods.push({label:`Armor: Defensive ${armDef}`,ben:armDef,src:'armor'});
  if(shield)mods.push({label:`Shield ${shield} × PL`,mod:shield*c.pl,src:'weapon'});
  if(unw)mods.push({label:`Unwieldy ${unw} (defending)`,har:Math.max(1,Math.ceil(unw/2)),src:'weapon'});
  if(/Light/.test(w.q||'')&&!['Hand to Hand','Short Blades'].includes(w.skill))mods.push({label:'Light weapon: can\'t parry with this skill',har:0,src:'weapon',on:false});
  if(hasAbil(c,'Defensive'))mods.push({label:'Defensive ability (Level-1 set)',ben:bonusSet(1,c.pl).ben,mod:bonusSet(1,c.pl).mod,src:'ability'});
  openRoll(c,{skill:w.skill,title:(shield?'Block':'Parry')+' with '+w.n,sub:'Reactive · 1 AP',ap:1,mods,ctx:{weapon:w}});};

/* ---------- attack */
const ATK_ACTIONS=[
  {n:'Standard Attack',ap:3},{n:'Reckless Attack',ap:4,ben:3,melee:true},{n:'Cautious Attack',ap:3,har:1,melee:true},{n:'Rushed Attack',ap:2,har:1,noAim:true},
  {n:'Called Shot',ap:4,called:true},{n:'Charge',ap:5,har:1,melee:true,dmgX:2},{n:'Lunge',ap:4,mod:-3,melee:true},{n:'Hit & Run',ap:4,mod:-3,melee:true},
  {n:'Off-Hand Attack',ap:3,har:1,half:true},{n:'Two-Weapon Attack',ap:5,har:2},{n:'Run & Gun',ap:4,mod:-3,ranged:true,noAim:true},{n:'Draw & Attack',ap:5,har:1},
  {n:'Opportunity Attack',ap:3,har:1,melee:true},{n:'Counterstrike',ap:3,har:2,melee:true},{n:'Split-Attack',ap:5,melee:true},{n:'Spray & Suppress',ap:5,ranged:true}];
ACT.attack=el=>{const c=C();const w=c.weapons.find(x=>x.id===el.dataset.w);const K=calc(c);
  const isR=!!w.ranged;
  const rofs=String(w.rof||'1').match(/\d+/g)||['1'];
  const init={act:'Standard Attack',called:'Torso',aim:0,rof:+rofs[0],band:isR?'Medium':'Adjacent',twoHand:/Two-Handed/.test(w.q||''),reachAdj:false,thrown:false};
  const extra={
    html(R){const x=R.x;const acts=ATK_ACTIONS.filter(a=>!(a.melee&&isR&&!x.thrown)&&!(a.ranged&&!isR));
      return `<div class="panel"><div class="sec">Attack with ${esc(w.n)}</div>
      <div class="field"><span>Action</span><select id="at-act">${acts.map(a=>`<option ${x.act===a.n?'selected':''}>${a.n}</option>`).join('')}</select></div>
      ${x.act==='Called Shot'?`<div class="row" style="margin-top:8px">${['Head','Torso','Arm','Leg'].map(l=>`<button class="chip" data-called="${l}" aria-pressed="${x.called===l}">${l}</button>`).join('')}</div>`:''}
      <div class="grid2" style="margin-top:8px">
        ${!(ATK_ACTIONS.find(a=>a.n===x.act)||{}).noAim?`<div class="opt-row"><span>Aim<small>Benefits from earlier Aim actions</small></span>${stepper('aim',x.aim,0,Math.max(1,isR?6-x.rof:5))}</div>`:'<div></div>'}
        ${isR&&rofs.length>1?`<div class="opt-row"><span>Rate of fire</span><span class="seg">${rofs.map(r=>`<button data-rof="${r}" aria-pressed="${x.rof===+r}">${r}</button>`).join('')}</span></div>`:''}
        ${isR?`<div class="field"><span>Range band (defender adds Range Dice)</span><select id="at-band">${['Adjacent','Point Blank','Close','Medium','Long','Extreme'].map(b=>`<option ${x.band===b?'selected':''}>${b}</option>`).join('')}</select></div>`:''}
        ${/Adaptable/.test(w.q||'')?`<label class="check"><input type="checkbox" id="at-2h" ${x.twoHand?'checked':''}> Two hands (+STR÷2 damage)</label>`:''}
        ${/Reach/.test(w.q||'')?`<label class="check"><input type="checkbox" id="at-adj" ${x.reachAdj?'checked':''}> Target adjacent (Reach: 1 Hardship)</label>`:''}
        ${/Thrown/.test(w.q||'')&&!isR?`<label class="check"><input type="checkbox" id="at-thr" ${x.thrown?'checked':''}> Throw it (Thrown skill, range STR×2)</label>`:''}
      </div></div>`;},
    bind(root,R){const x=R.x;const s=$('#at-act',root);if(s)s.onchange=()=>{x.act=s.value;const a=ATK_ACTIONS.find(q=>q.n===x.act);R.ap=a.ap;if(a.noAim)x.aim=0;renderRoll();};
      $$('[data-called]',root).forEach(b=>b.onclick=()=>{x.called=b.dataset.called;renderRoll();});
      $$('[data-rof]',root).forEach(b=>b.onclick=()=>{x.rof=+b.dataset.rof;renderRoll();});
      const bd=$('#at-band',root);if(bd)bd.onchange=()=>{x.band=bd.value;renderRoll();};
      const t2=$('#at-2h',root);if(t2)t2.onchange=()=>{x.twoHand=t2.checked;renderRoll();};
      const ad=$('#at-adj',root);if(ad)ad.onchange=()=>{x.reachAdj=ad.checked;renderRoll();};
      const th=$('#at-thr',root);if(th)th.onchange=()=>{x.thrown=th.checked;R.skill=x.thrown?'Thrown':w.skill;R.attr=govAttr(c,R.skill);R.rnk=calc(c).R(R.skill,'cur');renderRoll();};
      bindSteppers(root.querySelector('.panel'),id=>x[id],(id,v)=>{x[id]=v;renderRoll();});},
    calc(R){const x=R.x;const a=ATK_ACTIONS.find(q=>q.n===x.act)||{};let ben=(a.ben||0)+x.aim,har=a.har||0,mod=a.mod||0;const notes=[];
      if(a.called){har+=x.called==='Head'?2:x.called==='Torso'?0:1;}
      if(isR){const r=x.rof;if(r===2)har+=1;if(r===3){har+=1;mod-=3;}if(r===4)har+=2;if(r>=5){har+=2;mod-=3;}
        if(/Long/.test(w.q||'')&&['Adjacent','Point Blank','Close'].includes(x.band)){har+=1;notes.push('Long weapon at close range: 1 Hardship');}
        if(/Short/.test(w.q||'')&&['Long','Extreme'].includes(x.band))notes.push('Short weapon: can\'t hit at long or extreme range');
        const rd={Adjacent:0,'Point Blank':0,Close:1,Medium:2,Long:3,Extreme:4}[x.band];let rdn=rd;if(hasAbil(c,'Sniper')&&rd>=3)rdn--;notes.push(`Target BDV = Base Defense + ${rdn} Range Dice${x.band==='Adjacent'?' (or an active defense)':''}`);}
      const unw=+weaponQ(w,'Unwieldy')||0;const ctl=hasAbil(c,'Controlled',w.n)?1:0;if(unw&&calc(c).A.STR.cur<unw-ctl){har+=1;notes.push(`Unwieldy ${unw}: STR too low (1 Hardship)`);}
      if(/Inaccurate/.test(w.q||''))har+=1;if(/Improvised/.test(w.q||''))har+=1;
      if(x.reachAdj)har+=1;
      if(x.act==='Off-Hand Attack'&&(hasAbil(c,'Ambidextrous')||/Off-Handed/.test(w.q||'')||traitLv(c,'Multiple Arms')))har-=1;
      if(x.act==='Two-Weapon Attack'&&(hasAbil(c,'Ambidextrous')||traitLv(c,'Multiple Arms')))har-=1;
      return {ben,har:Math.max(0,har),mod,notes};},
    after(R,res){const x=R.x;const a=ATK_ACTIONS.find(q=>q.n===x.act)||{};const asp=aspectsOf(w);const K2=calc(c);
      const melee=!isR&&!x.thrown;const out={};
      Object.keys(asp).forEach(k=>{let v=asp[k];if(x.thrown&&(k==='S'))v=0;
        if(melee&&K2.size>1&&k!=='O')v*=K2.size;
        if(isR)v*=x.rof;if(a.dmgX)v*=a.dmgX;if(a.half)v=Math.floor(v/2);
        if(isR&&/Short/.test(w.q||'')&&x.band==='Medium')v=Math.floor(v/2);
        if(v>0||asp[k]>0){if(x.twoHand&&/Adaptable/.test(w.q||''))v+=Math.floor(K2.A.STR.cur/2);
          const lw=c.abil.filter(ab=>(ab.n==='Lethal Weapon I'||ab.n==='Lethal Weapon II')&&(ab.spec||'').toLowerCase()===w.n.toLowerCase()).length;v+=lw*(2+c.pl);
          if(x.act==='Reckless Attack'&&hasAbil(c,'Aggressive'))v+=K2.A.STR.cur+c.pl;}
        out[k]=v;});
      const loc=x.act==='Called Shot'?x.called:res.hit.loc;
      const locMod=loc==='Head'?(c.opt.deadlyHead?10:5):loc==='Torso'?0:-3;
      const pierce=[];if(/Piercing/.test(w.q||''))pierce.push(`ignores ${Math.floor(K2.A.DEX.cur/2)} Piercing AR`);if(/Slashing/.test(w.q||''))pierce.push(`ignores ${Math.floor(K2.A.AGI.cur/2)} Slashing AR`);if(/Crushing/.test(w.q||''))pierce.push(`ignores ${Math.floor(K2.A.STR.cur/2)} Bludgeoning AR`);
      const mort=/Mortal/.test(w.q||'')||hasAbil(c,'Mortal Danger',w.n);
      if(w.ammoCur!=null||(w.ammo&&/\d+\/\d+/.test(w.ammo))){const cap=+w.ammo.split('/')[1];w.ammoCur=Math.max(0,(w.ammoCur==null?cap:w.ammoCur)-(isR?x.rof:0));}
      x.aim=0;
      return `<div class="sec" style="margin-top:12px">Damage if it hits</div>
        <div class="aspects">${['S','P','B','O'].map(k=>`<div class="${out[k]?'':'zero'}${k===bestAspect(w)&&out[k]?' hi':''}"><small>${ASPN[k].slice(0,5).toUpperCase()}</small><b>${out[k]}</b></div>`).join('')}</div>
        <div class="faint" style="font-size:12.5px;margin-top:6px">TSV = (net attack − defender's BDV) + damage − armor, then ${loc} ${sgn(locMod)}.${pierce.length?' Quality: '+pierce.join('; ')+'.':''}${mort?' Mortal: a Wound also deals 1 Injury.':''}${a.dmgX?' Charge doubles damage.':''}</div>`;}
  };
  openRoll(c,{skill:w.skill,title:`Attack · ${w.n}`,sub:`${w.skill} · ${isR?'Ranged':'Melee'}`,ap:3,showHit:true,ctx:{weapon:w},extra,init});
};

/* ---------- taking damage */
ACT.takeHit=()=>{const c=C();const K=calc(c);
  const st={type:'P',direct:false,bsv:0,dmg:0,asp:'S',loc:'Torso',side:'Right',digit:'',arOv:null,tsv:0,era:'same'};
  const compute=()=>{const K2=calc(c);if(st.type==='M'){const raw=st.direct?st.tsv:st.bsv+st.dmg;return Math.max(0,raw-K2.mar);}
    const L=armorLoc(st.loc);let ar=st.arOv!=null?st.arOv:K2.ar[L][st.asp];
    if(st.arOv==null&&K2.ar[L].piece){const pe=K2.ar[L].piece.era||c.era;const raw=ar;if(st.era==='modern'&&pe==='Medieval')ar=Math.max(1,Math.floor(raw/2));if(st.era==='futuristic'&&pe==='Medieval')ar=raw-((K2.ar[L].piece[st.asp.toLowerCase()]||0)+c.pl);if(st.era==='futuristic'&&pe==='Modern')ar=Math.max(1,Math.floor(raw/2));}
    if(st.direct)return st.tsv;let t=Math.max(0,st.bsv+st.dmg-ar);const lm=st.loc==='Head'?(c.opt.deadlyHead?10:5):st.loc==='Torso'?0:-3;return Math.max(0,t+lm);};
  const outcome=t=>{const K2=calc(c);if(st.type==='M'){if(t>=K2.ith.cur*2)return {k:'insane',txt:'Instant insanity (double the Insanity Threshold).'};if(t>=K2.ith.cur)return {k:'iroll',txt:'Insanity Roll needed, then a Mental Wound.'};if(t>=K2.tl.cur)return {k:'wound',txt:'Mental Wound + Wound Hardship + Falter Roll.'};if(t>=K2.fl.cur)return {k:'inj',txt:'Injury (−3).'};return {k:'none',txt:'Shrugged off. No effect.'};}
    if(t>=K2.mth.cur*2)return {k:'dead',txt:'Dead. TSV is at least double the Mortality Threshold.'};if(t>=K2.mth.cur)return {k:'droll',txt:'Death Roll needed. If you survive, take the Wound.'};if(t>=K2.wl.cur)return {k:'wound',txt:K2.wh+1>K2.wth?'Wound, but Hardships would exceed your Wound Threshold: Death Roll, then an Injury instead of a Hardship.':'Wound + 1 Wound Hardship + Falter Roll.'};if(t>=K2.il.cur)return {k:'inj',txt:'Injury (−3).'};return {k:'none',txt:'Armor soaked it or it\'s a scratch. No effect.'};};
  const draw=()=>{const b=modalBody();const K2=calc(c);const t=compute();const o=outcome(t);const L=armorLoc(st.loc);
    b.innerHTML=`<div class="seg" style="align-self:flex-start"><button data-ty="P" aria-pressed="${st.type==='P'}">Physical</button><button data-ty="M" aria-pressed="${st.type==='M'}">Mental</button></div>
    <label class="check"><input type="checkbox" id="th-direct" ${st.direct?'checked':''}> I already know the TSV</label>
    ${st.direct?`<div class="opt-row"><span>Total Success Value</span><input type="number" id="th-tsv" class="inline-num" value="${st.tsv}"></div>`:`
    <div class="grid2"><div class="opt-row"><span>Base Success Value<small>Attack total − your defense</small></span><input type="number" id="th-bsv" class="inline-num" value="${st.bsv}"></div>
    <div class="opt-row"><span>${st.type==='M'?'Mental damage':'Weapon damage'}</span><input type="number" id="th-dmg" class="inline-num" value="${st.dmg}"></div></div>`}
    ${st.type==='P'?`<div class="field"><span>Hit location</span><div class="row">${['Head','Torso','Arm','Leg'].map(l=>`<button class="chip" data-loc="${l}" aria-pressed="${st.loc.startsWith(l)}">${l}</button>`).join('')}${/Arm|Leg/.test(st.loc)?`<span class="seg"><button data-side="Left" aria-pressed="${st.side==='Left'}">Left</button><button data-side="Right" aria-pressed="${st.side==='Right'}">Right</button></span>`:''}
      <label class="row nw" style="gap:6px"><span class="lbl">or digit</span><input type="number" id="th-dig" class="inline-num" min="0" max="9" value="${esc(st.digit)}"></label></div></div>
    ${!st.direct?`<div class="field"><span>Damage aspect</span><div class="row">${['S','P','B','O'].map(k=>`<button class="chip" data-asp="${k}" aria-pressed="${st.asp===k}">${ASPN[k]} · AR ${K2.ar[L][k]}</button>`).join('')}</div></div>
    ${K2.ar[L].piece?`<div class="field"><span>Attacker's weapon era vs your ${K2.ar[L].piece.era||c.era} armor</span><select id="th-era"><option value="same" ${st.era==='same'?'selected':''}>Same or older era: full AR</option><option value="modern" ${st.era==='modern'?'selected':''}>Modern weapon</option><option value="futuristic" ${st.era==='futuristic'?'selected':''}>Futuristic weapon</option></select></div>`:''}
    <div class="opt-row"><span>Armor Reduction override<small>Use when a weapon quality ignores part of your armor</small></span><input type="number" id="th-ar" class="inline-num" placeholder="auto" value="${st.arOv==null?'':st.arOv}"></div>`:''}`:`<div class="faint">Mental AR from Brave: ${K2.mar}</div>`}
    <div class="panel" style="border-color:color-mix(in srgb,var(--blood) 45%,var(--line))"><div class="row"><div><div class="lbl">TSV</div><div style="font-size:40px;font-weight:800" class="num">${t}</div></div><div style="flex:1;min-width:180px"><b class="${o.k==='none'?'good':o.k==='inj'?'warn':'bad'}">${o.txt}</b><div class="faint" style="font-size:12.5px">${st.type==='M'?`FL ${K2.fl.cur} · TL ${K2.tl.cur} · ITh ${K2.ith.cur}`:`IL ${K2.il.cur} · WL ${K2.wl.cur} · MTh ${K2.mth.cur}`}</div></div></div></div>`;
    $$('[data-ty]',b).forEach(x=>x.onclick=()=>{st.type=x.dataset.ty;draw();});
    $('#th-direct',b).onchange=e=>{st.direct=e.target.checked;draw();};
    const n=(id,k)=>{const el=$('#'+id,b);if(el)el.onchange=()=>{st[k]=el.value===''?(k==='arOv'?null:0):+el.value;draw();};};
    n('th-tsv','tsv');n('th-bsv','bsv');n('th-dmg','dmg');n('th-ar','arOv');
    const dg=$('#th-dig',b);if(dg)dg.onchange=()=>{st.digit=dg.value;if(dg.value!==''){const d=+dg.value%10;const l=HIT_LOC(d);st.loc=l;st.side=d%2?'Left':'Right';}draw();};
    const er=$('#th-era',b);if(er)er.onchange=()=>{st.era=er.value;draw();};
    $$('[data-loc]',b).forEach(x=>x.onclick=()=>{st.loc=x.dataset.loc;draw();});
    $$('[data-side]',b).forEach(x=>x.onclick=()=>{st.side=x.dataset.side;draw();});
    $$('[data-asp]',b).forEach(x=>x.onclick=()=>{st.asp=x.dataset.asp;draw();});};
  openModal({title:'Take a hit',sub:'Works out Injury, Wound or Death Roll',body:'',foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="th-apply">Apply</button>`,onMount:m=>{draw();$('#th-apply',m).onclick=()=>{const t=compute();const o=outcome(t);applyHit(c,st,t,o);};}});
};
function applyHit(c,st,t,o){
  const K=calc(c);const loc=st.type==='M'?'Mind':(/Arm|Leg/.test(st.loc)?st.side+' '+st.loc:st.loc);
  const addWound=()=>{c.wounds.push({id:uid(),type:st.type,tsv:t,loc,date:new Date().toLocaleDateString(),eff:null,heal:{},treated:[false,false,false],perm:false,notes:''});};
  closeModal(true);
  if(o.k==='none'){toast('No effect');return;}
  if(o.k==='inj'){c.cbt.inj++;touch(c);refreshView(true);toast('Injury taken (−3)');
    if(hasAbil(c,'Mortal Danger')){}return;}
  if(o.k==='dead'||o.k==='insane'){addWound();touch(c);refreshView(true);openModal({title:o.k==='dead'?'Fatal blow':'Lost to madness',body:`<p>${o.txt}</p><p class="muted">If your table uses Knockout Death Rolls, you fall unconscious instead. Burning Fate for a major scene detail may also save you, if the GM allows.</p>`});return;}
  const needDeath=o.k==='droll'||(o.k==='wound'&&st.type==='P'&&K.wh+1>K.wth)||o.k==='iroll'||(o.k==='wound'&&st.type==='M'&&K.wh+1>K.wth);
  const finish=(survived,viaThreshold)=>{
    if(!survived){addWound();touch(c);refreshView(true);openModal({title:st.type==='M'?'Insanity':'Death',body:`<p>${st.type==='M'?'The character suffers a total mental breakdown and must be retired.':'The character dies.'}</p><p class="muted">Check with your GM about Knockout Death Rolls or burning Fate.</p>`});return;}
    addWound();
    if(K.wh+1>K.wth){c.cbt.inj++;toast('Survived. Injury instead of a Wound Hardship.');}else{c.cbt.wh++;}
    touch(c);refreshView(true);
    setTimeout(()=>falterRoll(c),50);
  };
  if(needDeath){const mental=st.type==='M';
    openRoll(c,deathSpec(c,mental,t,res=>{setTimeout(()=>{closeModal(true);finish(res.ok);},900);}));}
  else finish(true);
}
function deathSpec(c,mental,tn,onResult){const K=calc(c);
  const mods=[];let skill=mental?'Courage':'Resilience';
  if(!mental&&hasAbil(c,'Never Say Die')&&rank(c,'Courage')>rank(c,'Resilience'))skill='Courage';
  const lvl=mental?K.tl.cur:K.wl.cur;const mult=c.opt.death==='danger'?0:c.opt.death==='safe'?2:1;
  if(mult)mods.push({label:`${mental?'Terror':'Wound'} Level${mult===2?' × 2':''}`,mod:lvl*mult,lock:true});
  if(!mental){if(hasAbil(c,'Hardy')){const b=bonusSet(1,c.pl);mods.push({label:'Hardy (Level-1 set)',ben:b.ben,mod:b.mod});}
    traitList(c,'Tough').filter(t=>/death/i.test(t.spec||'')).forEach(t=>{if((t.lv||1)<3)mods.push({label:`Tough: END × PL × ${Math.min(2,t.lv||1)}`,mod:K.A.END.cur*c.pl*Math.min(2,t.lv||1)});else mods.push({label:'Tough 3: once per session auto-success',mod:0,on:false});});
    if(hasFlaw(c,'Doomed'))mods.push({label:'Doomed',mod:-3});}
  return {skill,title:mental?'Insanity Roll':'Death Roll',sub:`${skill} + ${mental?'TL':'WL'} vs TSV ${tn}. Wound Hardships and Injuries don't apply.`,noWounds:true,tn,mods,onResult};}
function falterRoll(c){const K=calc(c);const mods=[];
  if(!c.opt.falterHard)mods.push({label:'Wound Level',mod:K.wl.cur,lock:true});
  if(hasAbil(c,'Hardy')){const b=bonusSet(1,c.pl);mods.push({label:'Hardy (Level-1 set)',ben:b.ben,mod:b.mod});}
  traitList(c,'Tough').filter(t=>/falter/i.test(t.spec||'')).forEach(t=>mods.push({label:`Tough: END × PL × ${Math.min(2,t.lv||1)}`,mod:K.A.END.cur*c.pl*Math.min(2,t.lv||1)}));
  const mp=traitLv(c,'Machine Physiology');if(mp){const b=bonusSet(Math.min(3,mp),c.pl);mods.push({label:`Machine Physiology (Level-${Math.min(3,mp)} set)`,ben:b.ben,mod:b.mod});}
  if(traitLv(c,'Undead'))mods.push({label:'Undead never Falter',mod:0,on:false});
  openRoll(c,{skill:'Stamina',title:'Falter Roll',sub:`Challenging Stamina + WL. Fail: drop everything, fall Prone, helpless for ${Math.max(1,calc(c).wh)*5} AP.`,tn:'Challenging',mods,ctx:{falter:true}});}
ACT.deathRoll=()=>{const c=C();openRoll(c,deathSpec(c,false,null));};

ACT.treatWound=el=>{const c=C();const w=c.wounds.find(x=>x.id===el.dataset.w);const used=w.treated.filter(Boolean).length;
  const st={total:'',periods:0,who:'other'};
  const skill=w.type==='M'?'Rhetoric':'Healing',self=w.type==='M'?'Fortitude':'Recovery';
  const draw=()=>{const b=modalBody();const t=st.total===''?null:+st.total;const los=t==null?null:t-w.tsv;
    const tiers=los==null?0:los>=11?3:los>=5?2:los>=0?1:0;
    b.innerHTML=`<p class="muted">Treatment ${used+1} of 3. The TN is the wound's TSV (${w.tsv}). Each Healing Period since the wound adds 1 Hardship${hasAbil(c,'Expert Care')||hasAbil(c,'Bedside Manner')?' (your ability removes the extra difficulty on re-treatment)':''}.</p>
     <div class="opt-row"><span>Healing Periods since wounded</span>${stepper('periods',st.periods,0,20)}</div>
     <div class="row"><button class="btn" id="tw-self">${IC.dice} Roll my ${self} (natural healing)</button><button class="btn" id="tw-heal">${IC.dice} Roll my ${skill}</button></div>
     <div class="opt-row"><span>Healing roll total<small>Or enter a healer's result</small></span><input type="number" id="tw-total" class="inline-num" value="${esc(st.total)}"></div>
     ${t!=null?`<div class="note ${tiers?'steel':'blood'}">${tiers?`Success by ${los}: heal ${w.eff.rank==='Minor'?`skills under ${tiers} attribute${tiers>1?'s':''}`:`up to ${tiers} attribute point${tiers>1?'s':''}`}.`:'Treatment failed.'}${used+1>=3?' This is the last treatment; anything left becomes permanent.':''}</div>`:''}`;
    bindSteppers(b,()=>st.periods,(id,v)=>{st.periods=v;draw();});
    $('#tw-total',b).onchange=e=>{st.total=e.target.value;draw();};
    const rollWith=(s,healSelf)=>{const hard=st.periods;openRoll(c,{skill:s,title:`${s}: treat wound`,sub:`TN ${w.tsv} (wound TSV)`,tn:w.tsv,har:hard,ctx:{healP:w.type!=='M',healSelf:true},onResult:res=>{st.total=String(res.total-res.pen.total);setTimeout(()=>{closeModal(true);reopen();},700);}});};

    const t=st.total===''?null:+st.total;w.treated[used]=true;

      if(w.eff.rank==='Minor'){w.eff.attrs.forEach(a=>{if(tiers>0&&!w.heal[a]){w.heal[a]=1;tiers--;}});}
      else{const per=w.eff.rank==='Critical'?2:1;let pts=tiers;w.eff.attrs.forEach(a=>{while(pts>0&&(w.heal[a]||0)<per){w.heal[a]=(w.heal[a]||0)+1;pts--;}});}}
    const left=w.eff.attrs.some(a=>w.eff.rank==='Minor'?!w.heal[a]:(w.heal[a]||0)<(w.eff.rank==='Critical'?2:1));
    if(w.treated.every(Boolean)&&left){w.perm=true;toast('Remaining effects are now permanent. Add a Permanent Wound flaw in Kit.');}else toast(left?'Treatment recorded':'Wound effect healed');
    touch(c);closeModal(true);refreshView(true);};}});
  reopen();};

    const items=o.items.filter(it=>(!ql||(o.search?o.search(it):JSON.stringify(it)).toLowerCase().includes(ql))&&(grp==='All'||!o.groupBy||o.groupBy(it)===grp));

    ${groups&&groups.length>2?`<div class="row" style="gap:6px">${groups.map(g=>`<button class="chip" data-g="${esc(g)}" aria-pressed="${grp===g}">${esc(g)}</button>`).join('')}</div>`:''}

    <div class="picker-list">${items.map((it,i)=>`<button class="pick${o.blocked&&o.blocked(it)?' blocked':''}" data-i="${o.items.indexOf(it)}" style="border:0;background:none;text-align:left;width:100%">${o.row(it)}</button>`).join('')||'<div class="empty">Nothing matches.</div>'}</div>`;
    const qi=$('#pk-q',b);qi.oninput=()=>{q=qi.value;const pos=qi.selectionStart;draw();const n=$('#pk-q',modalBody());n.focus();n.setSelectionRange(pos,pos);};
    $$('[data-g]',b).forEach(x=>x.onclick=()=>{grp=x.dataset.g;draw();});
    const cu=$('#pk-custom',b);if(cu)cu.onclick=()=>{closeModal(true);o.onCustom();};
    $$('[data-i]',b).forEach(x=>x.onclick=()=>{const it=o.items[+x.dataset.i];if(o.keepOpen){o.onPick(it,draw);}else{closeModal(true);o.onPick(it);}});
    if(o.onMount)o.onMount(MODAL.el);};
  openModal({title:o.title,sub:o.sub||'',wide:o.wide,body:'',onMount:draw});
}

function askSpec(c,spec,title,cb,cur=''){
  if(!spec)return cb('');
  let opts=null;
  if(spec.t==='choice')opts=spec.o;
  if(spec.t==='skill')opts=skillList(c).map(s=>s.n);
  if(spec.t==='weapon')opts=[...new Set([...c.weapons.map(w=>w.n),...DB.weapons.filter(w=>ERAS.indexOf(w.era)<=ERAS.indexOf(c.era)).map(w=>w.n)])];
  if(spec.t==='action')opts=DB.actions.filter(a=>a.k==='Offensive').map(a=>a.n);
  if(spec.t==='man'){return openPicker({title:title+': choose a Manifestation',items:DB.mans,groupBy:m=>m.sc,row:m=>`<span class="school-dot" style="background:var(${SCHOOLS[m.sc].v})"></span><div class="main"><b>${esc(m.n)}</b> <span class="faint">${m.sc}</span><p>${esc(m.d)}</p></div>`,search:m=>m.n+' '+m.sc,onPick:m=>cb(m.n)});}
  openModal({title,body:`<label class="field"><span>${esc(spec.l||'Choose')}</span>${opts?`<select id="sp-v">${opts.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input type="text" id="sp-v" value="${esc(cur)}" placeholder="${esc(spec.ph||'')}">`}</label>`,
    foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="sp-ok">OK</button>`,onMount:m=>{const i=$('#sp-v',m);if(i.focus)i.focus();$('#sp-ok',m).onclick=()=>{const v=i.value.trim();closeModal(true);cb(v);};}});
}

/* ---------- pickers for abilities, traits, flaws */
function openAbilityPicker(c,o){
  // o.mode: 'free' | 'xp' | 'gen'; o.price(ab)->string; o.onBuy(entry, ab) ; o.onDone()
  const items=DB.abilities.filter(a=>c.useFate||!(a.cat==='Fate'||/Fate Score|Fate is used/.test(a.pre)));
  openPicker({title:o.title||'Add ability',sub:o.sub||'',wide:true,items,groupBy:a=>a.cat,
    search:a=>a.n+' '+a.d+' '+a.cat,
    blocked:a=>!prereqCheck(c,a).ok,
    row:a=>{const p=prereqCheck(c,a);const owned=c.abil.filter(x=>x.n===a.n).length;
      return `<div class="main"><b>${esc(a.n)}</b> <span class="faint" style="font-size:12px">${a.cat} · p.${a.pg}</span>${owned?` <span class="pill moss">Owned${owned>1?' ×'+owned:''}</span>`:''}
      <p>${esc(a.d)}</p><p class="${p.ok?(p.gm?'warn':'faint'):'bad'}" style="font-size:12.5px">Prerequisite: ${esc(a.pre||'None')}${!p.ok?' · '+esc(p.msg):''}</p></div><span class="cost">${o.price?o.price(a):a.c}</span>`;},
    keepOpen:o.mode==='gen',
    onPick:(a,redraw)=>{const p=prereqCheck(c,a);
      const go=()=>{
        if(a.n==='Spell X'||a.n==='Power X'){return pickManifestation(c,a.n==='Spell X'?'spell':'power',(entry)=>{if(o.onBuy)o.onBuy(entry,a,redraw);else{c.magic.push(entry);touch(c);o.onDone&&o.onDone();}});}
        askSpec(c,SPEC[a.n],a.n,spec=>{const entry={id:uid(),n:a.n,cat:a.cat,spec,cost:abilCostNum(a)};
          if(o.onBuy)return o.onBuy(entry,a,redraw);
          c.abil.push(entry);touch(c);toast(`${a.n} added`);o.onDone&&o.onDone();});};
      if(!p.ok){confirmBox(`${esc(p.msg)}. Add <b>${esc(a.n)}</b> anyway (GM approval)?`,'Add anyway',go,false);}else go();}
  });
}
function pickManifestation(c,kind,cb){
  openPicker({title:kind==='spell'?'Learn a Spell':'Buy a Power',sub:kind==='spell'?'Spell X · 4 Ability Points':'Power X · 4 + 1 per extra Effect Level',items:DB.mans,groupBy:m=>m.sc,
    search:m=>m.n+' '+m.sc+' '+m.d,
    row:m=>`<span class="school-dot" style="background:var(${SCHOOLS[m.sc].v})"></span><div class="main"><b>${esc(m.n)}</b> <span class="faint" style="font-size:12px">${m.sc} · ${SCHOOLS[m.sc].skill} · ${m.use} · p.${m.pg}</span><p>${esc(m.d)}</p><p class="faint" style="font-size:12.5px">Enhance: ${esc(m.ve||'—')}</p></div>`,
    onPick:m=>{if(kind==='spell')return cb({id:uid(),kind:'spell',n:m.n,lv:{},cost:4,src:'ability'});
      const lv={p:0,du:0,r:0,t:0};const valid=validKeys(m);const K=calc(c);const capX=Math.max(0,K.focus*2);
      const draw=()=>{const b=modalBody();const extra=sum(Object.values(lv));b.innerHTML=`<p>${esc(m.d)}</p><p class="muted">Powers are fixed when bought. Add extra Effect Levels now (max Focus × 2 = ${capX}). Each adds 1 Ability Point.</p>
        ${valid.map(k=>`<div class="opt-row"><span>${VLAB[k]}<small>Base ${esc(m[k][0])}${m[k][1]?' · '+esc(m[k][1])+' per level':''}</small></span>${stepper(k,lv[k],0,capX)}</div>`).join('')||'<div class="faint">No enhanceable effects.</div>'}
        <div class="kv"><span>Cost</span><b class="cost">${4+extra} Ability Points</b></div>${extra>capX?`<div class="note ember">Over your Focus limit of ${capX} extra levels.</div>`:''}`;
        bindSteppers(b,k=>lv[k],(k,v)=>{lv[k]=v;draw();});};
      openModal({title:`Power: ${m.n}`,body:'',foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="pw-ok">Buy power</button>`,onMount:mm=>{draw();$('#pw-ok',mm).onclick=()=>{closeModal(true);cb({id:uid(),kind:'power',n:m.n,lv:deep(lv),cost:4+sum(Object.values(lv)),src:'ability'});};}});}});
}
const VLAB={p:'Potency',du:'Duration',r:'Range',t:'Targets'};
function validKeys(m){const v=(m.ve||'').toLowerCase();const k=[];if(v.includes('potency'))k.push('p');if(v.includes('duration'))k.push('du');if(v.includes('range'))k.push('r');if(v.includes('targets'))k.push('t');return k;}
function openTraitPicker(c,cb,opt={}){
  let all=!!opt.all;const own=ancTraits(c.bio.ancestry).map(parseTraitName);
  const allowed=n=>own.some(t=>t.n===n);
  const draw=()=>{closeModal(true);
    const items=all?DB.traits:DB.traits.filter(t=>allowed(t.n));
    openPicker({title:opt.title||'Add ancestry trait',sub:all?'All traits (GM permission)':`${c.bio.ancestry} traits`,wide:true,items,
      extraTop:`<label class="check"><input type="checkbox" id="tp-all" ${all?'checked':''}> Show every trait (custom ancestry / GM permission)</label>`,
      search:t=>t.n+' '+t.d,row:t=>{const o=own.find(x=>x.n===t.n);return `<div class="main"><b>${esc(t.n)}</b>${o&&o.spec?` <span class="muted">(${esc(o.spec)})</span>`:''} <span class="faint" style="font-size:12px">p.${t.pg} · levels ${t.st==='Yes'?'stack':t.st==='No'?'replace':'—'}</span><p>${esc(t.d)}</p><p class="faint" style="font-size:12.5px">1: ${esc(t.l[0]||'')}</p></div>${opt.price?`<span class="cost">${opt.price}</span>`:''}`;},
      onMount:m=>{const x=$('#tp-all',m);if(x)x.onchange=()=>{all=x.checked;draw();};},
      onPick:t=>{const o=own.find(x=>x.n===t.n);const preset=o&&o.spec&&!/^Any/i.test(o.spec)?o.spec:'';
        const fin=spec=>cb({id:uid(),n:t.n,lv:1,spec});
        if(preset)fin(preset);else askSpec(c,TSPEC[t.n],t.n,fin);}});};
  draw();
}
function openFlawPicker(c,cb,opt={}){
  openPicker({title:opt.title||'Add flaw',sub:'Flaws are assigned by the GM with your input',wide:true,items:DB.flaws.filter(f=>c.useFate||f.cat!=='Fate'),groupBy:f=>f.cat,search:f=>f.n+' '+f.d,

function innatePowers(c){return traitList(c,'Innate Power').map(t=>({id:'tr-'+t.id,kind:'power',n:(t.spec||'').replace(/^Any .*$/,''),lvAll:t.lv||1,src:'trait'})).filter(p=>DB.man[p.n]);}
function tabMagic(c,K){

  const list=[...c.magic,...innatePowers(c)];

  const head=`<div class="stats" style="margin-bottom:14px">
    <div class="stat"><span class="k">Focus</span><span class="v">${K.focus}</span><span class="s">surge if explosions &gt; ${surgeFocus(c,'standard',false)}</span></div>
    <div class="stat"><span class="k">Magic Def.</span><span class="v">${K.md.cur}</span><span class="s">${K.md.cur!==K.md.max?'max '+K.md.max:''}</span></div>
    <div class="stat${K.spells>K.spellCap?' down':''}"><span class="k">Spells</span><span class="v">${K.spells}<span class="faint" style="font-size:15px">/${K.spellCap}</span></span><span class="s">${mu?'Magic User':arc?'Arcana only':'—'}</span></div>
    <div class="stat${K.powers>K.spellCap?' down':''}"><span class="k">Powers</span><span class="v">${K.powers}<span class="faint" style="font-size:15px">/${K.spellCap}</span></span><span class="s">${sp?'Super Powers':'—'}</span></div>
    <div class="stat"><span class="k">Fate</span><span class="v">${c.fp}<span class="faint" style="font-size:15px">/${c.attrs.FATE.max}</span></span><span class="s">FP / score</span></div></div>`;
  if(!can)return head+`<div class="panel"><div class="sec">No magic yet</div><p class="muted">Spells need the <b>Magic User</b> ability (or ranks in Arcana, cast with 1 Hardship). Powers need <b>Super Powers</b>. Both require Fate 1+. ${UI.edit?'Add them from the Kit tab.':'Buy them with XP using Advance, or switch on Edit mode.'}</p></div>`;
  const card=x=>{const m=DB.man[x.n];if(!m)return '';const skl=SCHOOLS[m.sc].skill;const isP=x.kind==='power';
    const lvTxt=isP?(x.src==='trait'?`Innate · Level ${x.lvAll} effects`:Object.entries(x.lv||{}).filter(([k,v])=>v).map(([k,v])=>`${VLAB[k]} +${v}`).join(', ')||'Base level'):'Enhance when cast';

      <div class="row"><span class="faint" style="font-size:12.5px">${esc(lvTxt)}</span><span class="spacer"></span><button class="btn pri" data-act="cast" data-id="${x.id}">${IC.magic} ${isP?'Activate':'Cast'}</button></div></div>`;};
  return head+`<div class="sec">Spells & Powers<span class="act">${UI.edit?`<button class="btn sm" data-act="addSpell">${IC.plus} Spell</button> <button class="btn sm" data-act="addPower">${IC.plus} Power</button>`:`<button class="btn sm brass" data-act="advance">Learn with XP</button>`}</span></div>
  ${list.length?`<div class="grid2" style="margin-bottom:16px">${list.map(card).join('')}</div>`:'<div class="empty" style="margin-bottom:16px">No Spells or Powers known yet.</div>'}
  <div class="sec">Surges</div>

    <div class="row" style="margin-top:10px"><button class="btn" data-act="manualSurge">Roll a Surge Effect</button></div></div>`;
}
ACT.addSpell=()=>{const c=C();pickManifestation(c,'spell',e=>{c.magic.push(e);touch(c);refreshView(true);});};
ACT.addPower=()=>{const c=C();pickManifestation(c,'power',e=>{c.magic.push(e);touch(c);refreshView(true);});};
ACT.delMagic=el=>{const c=C();c.magic=c.magic.filter(x=>x.id!==el.dataset.id);touch(c);refreshView(true);};

/* ---------- casting */
function surgeFocus(c,mode,repeat){let f=calc(c).focusMag;if(mode==='careful')f+=2;if(mode==='quick')f-=1;if(repeat)f-=1;if(hasAbil(c,'Focused'))f+=1;if(hasFlaw(c,'Wild Caster'))f-=1;return Math.max(0,f);}
function quickCheck(c,skill){const K=calc(c);const gm=gatherMods(c,skill,{});let ben=0,har=K.wh,mod=-3*K.inj;gm.mods.forEach(m=>{if(m.on){ben+=m.ben;har+=m.har;mod+=m.mod;}});
  const pool=poolFor(K.A[govAttr(c,skill)].cur,K.R(skill,'cur'),ben,0);const r=rollDice({rolled:pool.rolled,kept:pool.kept,explode:rank(c,skill)>0,reroll1:gm.flags.reroll1});const pen=rollPenalty(har);
  return {r,pen,total:r.total+pool.bonus+mod,net:r.total+pool.bonus+mod-pen.total,pool,mod,har};}
ACT.cast=el=>{const c=C();const id=el.dataset.id;const x=[...c.magic,...innatePowers(c)].find(q=>q.id===id);const m=DB.man[x.n];const isP=x.kind==='power';
  const K=calc(c);const school=SCHOOLS[m.sc].skill;const useArc=!isP&&(!hasAbil(c,'Magic User')||rank(c,school)<1)&&rank(c,'Arcana')>0;
  const valid=validKeys(m);
  const init={mode:'standard',repeat:false,lv:{p:0,du:0,r:0,t:0},target:/^N\/A/.test(m.res)?'willing':'unwilling',md:'',useArc,spell:null,surge:null};
  const skillName=()=>RS.x.useArc?'Arcana':school;
  const extra={
    html(R){const X=R.x;const sd=1+sum(Object.values(X.lv))+(hasFlaw(c,'Weak Caster')?1:0)-(hasAbil(c,'Powerful Magic',m.sc)&&sum(Object.values(X.lv))>0?1:0);
      return `<div class="panel" style="border-left:4px solid var(${SCHOOLS[m.sc].v})"><div class="sec">${isP?'Activate power':'Cast spell'} · ${esc(m.n)}</div>
       <div class="seg" style="margin-bottom:8px">${[['quick','Quickly · 2 AP'],['standard','Standard · 3 AP'],['careful','Carefully · 5 AP']].map(([k,l])=>`<button data-cm="${k}" aria-pressed="${X.mode===k}">${l}</button>`).join('')}</div>
       ${!isP&&rank(c,'Arcana')>0&&hasAbil(c,'Magic User')&&rank(c,school)>0?`<label class="check"><input type="checkbox" id="cs-arc" ${X.useArc?'checked':''}> Cast with Arcana instead (1 Hardship)</label>`:''}
       <label class="check"><input type="checkbox" id="cs-rep" ${X.repeat?'checked':''}> Repeated use of this Manifestation (Focus −1)</label>
       ${!isP?`<div class="sec" style="margin-top:8px">Enhance · ${sd} Spell Dice</div>${valid.map(k=>`<div class="opt-row"><span>${VLAB[k]}<small>${esc(m[k][0])}${m[k][1]?' · '+esc(m[k][1])+' per level':''}</small></span>${stepper('lv:'+k,X.lv[k],0,10)}</div>`).join('')||'<div class="faint">No enhanceable effects.</div>'}`:''}
       <div class="sec" style="margin-top:8px">Target</div>
       <div class="seg"><button data-tg="unwilling" aria-pressed="${X.target==='unwilling'}">Unwilling (Magic Defense)</button><button data-tg="willing" aria-pressed="${X.target==='willing'}">Willing / no target</button></div>
       ${X.target==='unwilling'?`<div class="opt-row"><span>Target's Magic Defense</span><input type="number" id="cs-md" class="inline-num" value="${esc(X.md)}" placeholder="MD"></div>`:''}
       <div class="faint" style="font-size:12.5px">${isP?(X.target==='unwilling'?`If your roll beats their Magic Defense, they resist with ${esc(m.res)}.`:`Difficulty: Challenging ${PLD[c.pl].tn[1]}.`):`TN = ${X.target==='unwilling'?'Magic Defense':'Challenging '+PLD[c.pl].tn[1]} + ${sd} Spell Dice (rolled after your check).`} Surge if explosions exceed ${surgeFocus(c,X.mode,X.repeat)}.</div></div>`;},
    bind(root,R){const X=R.x;
      $$('[data-cm]',root).forEach(b=>b.onclick=()=>{X.mode=b.dataset.cm;R.ap=X.mode==='quick'?2:X.mode==='careful'?5:3;renderRoll();});
      $$('[data-tg]',root).forEach(b=>b.onclick=()=>{X.target=b.dataset.tg;renderRoll();});
      const a=$('#cs-arc',root);if(a)a.onchange=()=>{X.useArc=a.checked;R.skill=skillName();R.attr=govAttr(c,R.skill);R.rnk=calc(c).R(R.skill,'cur');R.mods=gatherMods(c,R.skill,{}).mods;renderRoll();};
      const rp=$('#cs-rep',root);if(rp)rp.onchange=()=>{X.repeat=rp.checked;renderRoll();};
      const md=$('#cs-md',root);if(md)md.onchange=()=>{X.md=md.value;renderRoll();};
      bindSteppers(root.querySelector('.panel'),id=>X.lv[id.split(':')[1]],(id,v)=>{X.lv[id.split(':')[1]]=v;renderRoll();});
      const sb=$('#cs-surge',root);if(sb)sb.onclick=()=>doSurge(c,R,m,isP);},
    calc(R){const X=R.x;let har=0;const notes=[];if(X.useArc){har+=1;notes.push('Arcana casting: 1 Hardship');}if(X.mode==='quick')har+=1;
      if(X.target==='unwilling'&&X.md==='')notes.push('Enter the target\'s Magic Defense (blank counts as 0).');const md=hasAbil(c,'Magic User')||hasAbil(c,'Super Powers')||X.useArc||x.src==='trait';if(!md)notes.push('You need Magic User/Super Powers, or Arcana for Spells.');
      if(rank(c,skillName())<1)notes.push(`${skillName()} 0: magic Skills can't be used untrained.`);
      return {har,notes};},
    after(R,res){const X=R.x;const fcs=surgeFocus(c,X.mode,X.repeat);const skillSurge=res.r.explosions>fcs;
      let html='';
      if(!isP){const sd=Math.max(1,1+sum(Object.values(X.lv))+(hasFlaw(c,'Weak Caster')?1:0)-(hasAbil(c,'Powerful Magic',m.sc)&&sum(Object.values(X.lv))>0?1:0));
        const sdr=rollPenalty(sd);const base=X.target==='unwilling'?(+X.md||0):PLD[c.pl].tn[1];const tn=base+sdr.total+res.pen.total;const ok=res.total>=tn;const spellSurge=sdr.explosions>fcs;
        X.spell={sd,sdr,base,tn,ok,los:res.total-tn};X.surge=(skillSurge||spellSurge)?{skill:skillSurge,spell:spellSurge,vs:Math.max(skillSurge?res.total:0,spellSurge?sdr.total:0),skillName:skillName()}:null;
        html=`<div class="sec" style="margin-top:12px">Spell Dice (${sd})</div>${diceHTML(sdr.dice,'pen')}
          <div class="roll-total" style="margin-top:8px"><span class="verdict ${ok?'ok':'no'}">${ok?'Spell succeeds':'Spell fails'}</span><span class="muted">${res.total} vs ${base} ${X.target==='unwilling'?'MD':'Challenging'} + ${sdr.total} Spell Dice${res.pen.total?` + ${res.pen.total} penalty`:''} = ${tn}${ok?` · ${res.total-tn} LoS`:''}</span></div>`;
      }else{const base=X.target==='unwilling'?(+X.md||0):PLD[c.pl].tn[1];const ok=res.net>=base;X.surge=skillSurge?{skill:true,spell:false,vs:res.total,skillName:skillName()}:null;
        html=`<div class="roll-total" style="margin-top:10px"><span class="verdict ${ok?'ok':'no'}">${X.target==='unwilling'?(ok?'Beats Magic Defense':'Below Magic Defense'):(ok?'Activated':'Fails')}</span><span class="muted">${res.net} vs ${base}${X.target==='unwilling'&&ok?` · target may resist with ${esc(m.res)}; you need to beat their roll`:''}</span></div>`;}
      if(X.surge)html+=`<div class="note blood" style="margin-top:10px"><b>Surge!</b> ${X.surge.skill?`Skill Check had ${res.r.explosions} explosions`:''}${X.surge.skill&&X.surge.spell?' and ':''}${X.surge.spell?`Spell Dice had ${X.spell.sdr.explosions} explosions`:''} (Focus ${fcs}). Make a Focus check against ${X.surge.vs}.<div style="margin-top:8px"><button class="btn sm pri" id="cs-surge">Roll Focus to contain it</button></div><div id="cs-surge-out"></div></div>`;
      else html+=`<div class="faint" style="font-size:12.5px;margin-top:6px">No Surge (${res.r.explosions}${X.spell?' + '+X.spell.sdr.explosions:''} explosions vs Focus ${fcs}).</div>`;
      return html;}
  };
  const skl=useArc?'Arcana':school;
  openRoll(c,{skill:skl,title:`${isP?'Activate':'Cast'} · ${m.n}`,sub:`${m.sc} · ${skl}`,ap:3,extra,init,ctx:{magic:true}});
};
function doSurge(c,R,m,isP){const X=R.x;const s=X.surge;const fr=quickCheck(c,'Focus');const K=calc(c);
  const out=$('#cs-surge-out');let html=`<div style="margin-top:8px">Focus: <b class="num">${fr.net}</b> vs ${s.vs}</div>${diceHTML(fr.r.dice)}`;
  if(fr.net>=s.vs){html+=`<div class="verdict ok" style="font-size:16px;margin-top:6px">Surge contained</div>`;}
  else{const sfv=s.vs-fr.net;const md=K.md.cur;
    if(sfv<md){html+=`<div style="margin-top:6px">Failed by ${sfv}, below your Magic Defense ${md}: <b>no Surge Effect</b>.</div>`;}
    else{const lvl=sfv>=md+11?'Terrible':sfv>=md+5?'Moderate':'Superficial';let dice=lvl==='Superficial'?2:lvl==='Moderate'?1:0;if(s.skill&&s.spell)dice=Math.max(0,dice-1);
      const tbl=isP?DB.surge.power[s.skillName]:DB.surge.magic[s.skillName];const rolls=rollPlain(3+dice);const tot=sum(rolls);const max=isP?20:23;
      const row=tot>=max?null:tbl.find(r=>r.r===tot);
      html+=`<div style="margin-top:6px">SFV ${sfv} vs MD ${md}: <b>${lvl}</b> surge · ${3+dice}d10 = <b>${tot}</b></div><div class="dice">${rolls.map(v=>`<div class="die kept"><span>${v}</span></div>`).join('')}</div><div class="panel" style="margin-top:6px"><b>${isP?'Power':'Spell'} Surge · ${esc(s.skillName)} ${tot}</b><p style="margin-top:4px">${row?esc(row.t):'No Surge.'}</p></div>`;}}
  logRoll(c,'Surge: Focus check',fr);save();
  if(out)out.innerHTML=html;$('#cs-surge').disabled=true;}
ACT.manualSurge=()=>{const c=C();const st={kind:'magic',skill:'Arcana',sev:'Superficial',both:false,res:null};
  const draw=()=>{const b=modalBody();const tables=Object.keys(DB.surge[st.kind]);if(!tables.includes(st.skill))st.skill=tables[0];
    b.innerHTML=`<div class="seg"><button data-k="magic" aria-pressed="${st.kind==='magic'}">Traditional Magic</button><button data-k="power" aria-pressed="${st.kind==='power'}">Super Powers</button></div>

    <div class="row">${['Superficial','Moderate','Terrible'].map(s=>`<button class="chip" data-s="${s}" aria-pressed="${st.sev===s}">${s}</button>`).join('')}</div>
    ${st.kind==='magic'?`<label class="check"><input type="checkbox" id="ms-b" ${st.both?'checked':''}> Both a Skill and a Spell Surge (−1 die)</label>`:''}
    ${st.res?`<div class="dice anim">${st.res.rolls.map(v=>`<div class="die kept"><span>${v}</span></div>`).join('')}</div><div class="panel"><b>${st.res.tot}</b> · ${esc(st.res.t)}</div>`:''}
    <details><summary class="lbl" style="padding:6px 0">Full ${st.skill} table</summary><table class="mtable"><tbody>${DB.surge[st.kind][st.skill].map(r=>`<tr><td>${r.r}</td><td>${esc(r.t)}</td></tr>`).join('')}<tr><td>${st.kind==='magic'?'23+':'20+'}</td><td>No Surge.</td></tr></tbody></table></details>`;
    $$('[data-k]',b).forEach(x=>x.onclick=()=>{st.kind=x.dataset.k;st.res=null;draw();});$$('[data-t]',b).forEach(x=>x.onclick=()=>{st.skill=x.dataset.t;draw();});$$('[data-s]',b).forEach(x=>x.onclick=()=>{st.sev=x.dataset.s;draw();});
    const bb=$('#ms-b',b);if(bb)bb.onchange=()=>{st.both=bb.checked;};};
  openModal({title:'Surge Effect',body:'',foot:`<button class="btn" data-close>Close</button><button class="btn pri" id="ms-go">${IC.dice} Roll</button>`,onMount:m=>{draw();$('#ms-go',m).onclick=()=>{let dice=st.sev==='Superficial'?2:st.sev==='Moderate'?1:0;if(st.both&&st.kind==='magic')dice=Math.max(0,dice-1);const rolls=rollPlain(3+dice);const tot=sum(rolls);const max=st.kind==='power'?20:23;const row=DB.surge[st.kind][st.skill].find(r=>r.r===tot);st.res={rolls,tot,t:tot>=max||!row?'No Surge.':row.t};draw();};}});};

ACT.advance=()=>openAdvance(C());
function openAdvance(c){let sec='attrs',q='';

    let html=`<div class="row" style="justify-content:space-between"><div><div class="lbl">Available XP</div><div style="font-size:30px;font-weight:800;color:var(--brass)" class="num">${avail()}</div></div>

    if(sec==='skills'){const sk=skillList(c).filter(s=>!q||s.n.toLowerCase().includes(q.toLowerCase()));
      html+=`<p class="muted" style="font-size:13.5px">Skills must have been used or trained. Cost: new rank × 4, +4 if it reaches the governing Attribute (except rank 1). Rank can't exceed the Attribute.</p><div class="search">${IC.search}<input type="search" id="ad-q" placeholder="Search skills" value="${esc(q)}"></div>
      <div class="list">${sk.map(s=>{const r=rank(c,s.n);const g=govAttr(c,s.n);const capA=c.attrs[g].max;const nv=r+1;const cost=xpSkillCost(c,s.n,nv);return `<div class="item"><div class="main"><b>${esc(s.n)}</b> <span class="faint">${g}</span><div class="sub">Rank ${r} / ${capA}</div></div>${nv<=capA?`<button class="btn sm ${cost<=avail()?'brass':''}" data-adv-s="${esc(s.n)}">→ ${nv} · ${cost} XP</button>`:'<span class="faint" style="font-size:13px">at cap</span>'}</div>`;}).join('')}</div>`;}
    if(sec==='abil'){html+=`<p class="muted" style="font-size:13.5px">Abilities cost their Ability Point cost × ${hasFlaw(c,'Amnesia')?6:5} XP. The GM can veto anything unthematic.</p><button class="btn block brass" id="ad-ab">Browse abilities</button>`;}
    if(sec==='traits'){html+=`<p class="muted" style="font-size:13.5px">You can buy more levels of traits you already have (30 XP each). New traits need GM approval.</p><div class="list">${c.traits.map(t=>{const d=DB.trait[t.n];const max=d?d.lv:3;return `<div class="item"><div class="main"><b>${esc(t.n)}</b>${t.spec?` <span class="muted">(${esc(t.spec)})</span>`:''}<div class="sub">Level ${t.lv||1} / ${max}</div></div>${(t.lv||1)<max?`<button class="btn sm brass" data-adv-t="${t.id}">+1 level · 30 XP</button>`:''}</div>`;}).join('')||'<div class="faint">No traits.</div>'}</div><button class="btn block" id="ad-newt">New trait (GM permission) · 30 XP</button>`;}
    if(sec==='magic'){html+=`<p class="muted" style="font-size:13.5px">Spells cost 4 × 5 = 20 XP. Powers cost (4 + extra levels) × 5. Extra Effect Levels on an existing Power cost 5 XP each (max Focus × 2 = ${K.focus*2}).</p>
      <div class="row"><button class="btn brass" id="ad-sp">Learn a Spell · 20 XP</button><button class="btn brass" id="ad-pw">Buy a Power</button></div>
      <div class="list">${c.magic.filter(x=>x.kind==='power').map(x=>{const m=DB.man[x.n];return `<div class="item"><div class="main"><b>${esc(x.n)}</b><div class="sub">${Object.entries(x.lv||{}).filter(([k,v])=>v).map(([k,v])=>VLAB[k]+' +'+v).join(', ')||'Base level'}</div></div><span class="row nw" style="gap:4px">${validKeys(m).map(k=>`<button class="btn sm" data-pwl="${x.id}:${k}">+${VLAB[k]}</button>`).join('')}</span></div>`;}).join('')}</div>`;}
    if(sec==='log'){html+=c.xp.log.length?`<div class="list">${c.xp.log.map(l=>`<div class="kv"><span>${esc(l.d)} <span class="faint">${new Date(l.t).toLocaleDateString()}</span></span><b class="num ${l.xp>0?'good':''}">${sgn(l.xp)}</b></div>`).join('')}</div>`:'<div class="empty">No XP history yet.</div>';}
    b.innerHTML=html;
    $$('[data-sec]',b).forEach(x=>x.onclick=()=>{sec=x.dataset.sec;draw();});
    const qi=$('#ad-q',b);if(qi)qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;draw();const n=$('#ad-q',modalBody());n.focus();n.setSelectionRange(p,p);};
    $$('[data-adv-a]',b).forEach(x=>x.onclick=()=>{const a=x.dataset.advA;const nv=c.attrs[a].max+1;spend(nv*10,`${a} to ${nv}`,()=>{c.attrs[a].max=nv;c.attrs[a].adv=true;if(a==='FATE')c.fp++;});});

    $$('[data-adv-t]',b).forEach(x=>x.onclick=()=>{const t=c.traits.find(q=>q.id===x.dataset.advT);spend(30,`${t.n} level ${(t.lv||1)+1}`,()=>{t.lv=(t.lv||1)+1;});});
    $$('[data-pwl]',b).forEach(x=>x.onclick=()=>{const [id,k]=x.dataset.pwl.split(':');const p=c.magic.find(q=>q.id===id);const tot=sum(Object.values(p.lv||{}));if(tot+1>K.focus*2)return toast(`Focus limits you to ${K.focus*2} extra levels`);spend(5,`${p.n}: +${VLAB[k]}`,()=>{p.lv[k]=(p.lv[k]||0)+1;p.cost=(p.cost||4)+1;});});
    const ab=$('#ad-ab',b);if(ab)ab.onclick=()=>{closeModal(true);openAbilityPicker(c,{title:'Buy an ability with XP',price:a=>xpAbilCost(c,a,abilCostNum(a))+' XP',onBuy:(entry,a)=>{const xp=xpAbilCost(c,a,entry.cost);if(entry.kind){entry.cost=entry.cost;}spend(xp,entry.kind?`${entry.kind==='spell'?'Spell':'Power'}: ${entry.n}`:`${entry.n}${entry.spec?' ('+entry.spec+')':''}`,()=>{if(entry.kind)c.magic.push(entry);else c.abil.push(entry);});}});};
    const nt=$('#ad-newt',b);if(nt)nt.onclick=()=>{closeModal(true);openTraitPicker(c,t=>spend(30,`New trait: ${t.n}`,()=>c.traits.push(t)),{all:true,price:'30 XP'});};
    const sp=$('#ad-sp',b);if(sp)sp.onclick=()=>{closeModal(true);pickManifestation(c,'spell',e=>spend(20,`Spell: ${e.n}`,()=>c.magic.push(e)));};
    const pw=$('#ad-pw',b);if(pw)pw.onclick=()=>{closeModal(true);pickManifestation(c,'power',e=>spend(e.cost*5,`Power: ${e.n}`,()=>c.magic.push(e)));};
  };
  const openAdvanceAgain=()=>openModal({title:'Advance',sub:'Spend experience by the rules',wide:true,body:'',onMount:draw});
  openAdvanceAgain();
}

/* ===================== GENERATOR: Roll Method & Pick Method wizard, quick random hero ===================== */
const GSTEPS=['Setup','Attributes','Skills','Ancestry','Abilities','Flaws','Identity','Wealth','Review'];
function newGen(){const attrs={};ALL_ATTRS.forEach(a=>attrs[a]=a==='FATE'?0:1);
  return {step:0,pl:1,useFate:true,method:'pick',era:'Medieval',literacy:false,traitMode:'pick',
    attrs,rolls:null,base:null,flip:[],flipped:null,free:[],fate0:false,
    skills:{},pay:'auto',ancestry:'Human',literate:'Common',
    abil:[],traits:[],magic:[],flawTrades:0,flaws:[],
    bio:{name:'',player:'',career:'',age:'',gender:'',looks:'',background:''},cp:null,cpNote:'',cart:[]};}
const G=()=>UI.gen;
function gPL(){return PLD[G().pl];}
function gMin(a){return a==='FATE'?0:gPL().min;}

/* ---------- attribute helpers */
function attrPoints(){const g=G();return gPL().pick[g.useFate?'fate':'nofate'];}
function attrSpent(){const g=G();return sum(ALL_ATTRS.filter(a=>g.useFate||a!=='FATE').map(a=>g.attrs[a]));}
function rollTable(pl,d){for(const [hi,v] of PLD[pl].roll)if(d<=hi)return v;return PLD[pl].roll.at(-1)[1];}
function freePoints(){const g=G();return 1+(g.fate0?1:0);}
function rollAttrs(){const g=G();g.rolls={};g.base={};
  ALL_ATTRS.forEach(a=>{if(a==='FATE'&&(!g.useFate||g.fate0)){g.rolls[a]=null;g.base[a]=0;return;}const d=d10();g.rolls[a]=d;g.base[a]=rollTable(g.pl,d);});
  g.flipped=null;g.flip=[];g.free=[];applyRoll();}
function applyRoll(){const g=G();if(!g.base)return;const v=deep(g.base);if(g.flipped){const [a,b]=g.flipped;[v[a],v[b]]=[v[b],v[a]];}g.free.forEach(a=>v[a]++);g.attrs=v;g.skills={};}

/* ---------- skill point economy */
function catOfSkill(name,attrs){return CAT_OF[skillAttrG(name)];}
function skillAttrG(name){const s=DB.skill[name];return s?s.a:'STR';}
function skillPools(){const g=G();const p={};POOLS.forEach(k=>p[k]=sum(CATS[k].map(a=>g.useFate||a!=='FATE'?g.attrs[a]:0)));return p;}
function skillSpentBy(){const g=G();const s={Physical:0,Mental:0,Social:0,Fate:0};Object.values(g.skills).forEach(st=>st.forEach(x=>s[x.pool]+=x.cost));return s;}
function skillLeft(){const p=skillPools(),s=skillSpentBy();const o={};POOLS.forEach(k=>o[k]=p[k]-s[k]);return o;}
function gRank(n){return (G().skills[n]||[]).length;}
function rankBase(attr,nr){return (nr===attr&&attr!==1)?2:1;}
function payOptions(name){const g=G();const a=skillAttrG(name);const cat=CAT_OF[a];const nr=gRank(name)+1;const base=rankBase(g.attrs[a],nr);const left=skillLeft();const opts=[];
  POOLS.forEach(p=>{if(cat==='Fate'&&p!=='Fate')return;if(p==='Fate'&&!g.useFate)return;const cost=(p===cat||p==='Fate')?base:base*2;if(left[p]>=cost)opts.push({pool:p,cost});});return opts;}
function autoPay(name){const g=G();const opts=payOptions(name);if(!opts.length)return null;const cat=CAT_OF[skillAttrG(name)];
  if(g.pay!=='auto')return opts.find(o=>o.pool===g.pay)||null;
  const own=opts.find(o=>o.pool===cat);if(own)return own;
  const fate=opts.find(o=>o.pool==='Fate');if(fate)return fate;
  const left=skillLeft();return opts.filter(o=>o.pool!=='Fate').sort((x,y)=>left[y.pool]-left[x.pool])[0]||null;}
function buySkill(name){const g=G();const a=skillAttrG(name);if(gRank(name)>=g.attrs[a])return toast(`Rank can't exceed ${a} ${g.attrs[a]}`);const o=autoPay(name);if(!o)return toast(g.pay==='auto'?'Not enough points in any usable pool':`Not enough ${g.pay} points for that`);(g.skills[name]=g.skills[name]||[]).push(o);}
function sellSkill(name){const g=G();const st=g.skills[name];if(st&&st.length){st.pop();if(!st.length)delete g.skills[name];}}
const MAGICSK=['Essence','Harness','Psyche','Shape','Focus','Arcana'];
function autoSkills(weights){const g=G();let guard=0;const names=DB.skills.map(s=>s.n).filter(n=>(g.useFate||skillAttrG(n)!=='FATE')&&(!MAGICSK.includes(n)||(weights&&weights[n])));
  while(guard++<500){const cand=names.filter(n=>gRank(n)<g.attrs[skillAttrG(n)]&&payOptions(n).length);if(!cand.length)break;
    const w=cand.map(n=>(weights&&weights[n]?weights[n]:1)*(CAT_OF[skillAttrG(n)]===(autoPay(n)||{}).pool?3:0.4)*(gRank(n)>0?2.6:1));
    let r=Math.random()*sum(w),i=0;while(r>w[i]){r-=w[i];i++;}buySkill(cand[Math.min(i,cand.length-1)]);}}

/* ---------- ability point economy */
function abilPools(){const g=G();const p={Physical:0,Mental:0,Social:0,Fate:0};Object.entries(g.skills).forEach(([n,st])=>{p[CAT_OF[skillAttrG(n)]]+=st.length;});
  if(!g.useFate)p.Fate=0;return p;}
function abilSpent(){const g=G();const s={Physical:0,Mental:0,Social:0,Fate:0};[...g.abil,...g.traits,...g.magic].forEach(x=>{if(x.paid)Object.entries(x.paid).forEach(([k,v])=>s[k]+=v);});return s;}
function abilLeft(){const p=abilPools(),s=abilSpent();const o={};POOLS.forEach(k=>o[k]=p[k]-s[k]);return o;}
function valueOf(pool,cat){if(cat==='Fate')return pool==='Fate'?1:0;if(cat==='General'||pool==='Fate'||pool===cat)return 1;return 0.5;}
function autoAlloc(cost,cat){const left=abilLeft();const alloc={Physical:0,Mental:0,Social:0,Fate:0};let need=cost;
  const order=POOLS.filter(p=>valueOf(p,cat)>0).sort((a,b)=>{const va=valueOf(a,cat),vb=valueOf(b,cat);if(va!==vb)return vb-va;if(a==='Fate')return 1;if(b==='Fate')return -1;return cat==='General'?left[a]-left[b]:left[b]-left[a];});
  for(const p of order){const v=valueOf(p,cat);while(need>1e-9&&left[p]-alloc[p]>0){alloc[p]++;need-=v;}}
  return {alloc,ok:need<=1e-9};}
function payDialog(title,cost,cat,cb,extraHTML=''){
  const st=autoAlloc(cost,cat);const alloc=st.alloc;
  const draw=()=>{const b=modalBody();const left=abilLeft();const val=sum(POOLS.map(p=>alloc[p]*valueOf(p,cat)));
    b.innerHTML=`<p class="muted" style="font-size:13.5px">Cost <b class="cost">${cost}</b> · ${cat==='Fate'?'only Fate points can pay':cat==='General'?'any pool pays 1 for 1':`${cat} and Fate points pay 1 for 1; other pools pay half`}.</p>
    ${POOLS.filter(p=>valueOf(p,cat)>0&&(G().useFate||p!=='Fate')).map(p=>`<div class="opt-row"><span>${p} <small>${left[p]} left · worth ${valueOf(p,cat)===1?'1':'½'} each</small></span>${stepper(p,alloc[p],0,left[p])}</div>`).join('')}
    <div class="kv"><span>Value paid</span><b class="num ${val>=cost?'good':'bad'}">${val} / ${cost}</b></div>${extraHTML}`;
    bindSteppers(b,p=>alloc[p],(p,v)=>{alloc[p]=v;draw();});$('#pay-ok').disabled=val<cost;};
  openModal({title,body:'',foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="pay-ok">Buy</button>`,onMount:m=>{draw();$('#pay-ok',m).onclick=()=>{const paid={};POOLS.forEach(p=>{if(alloc[p])paid[p]=alloc[p];});closeModal(true);cb(paid);};}});
}
function gChar(){ // temp character for prereq checks & calc
  const g=G();const c=blankChar();c.pl=g.pl;c.useFate=g.useFate;c.era=g.era;c.bio=Object.assign(c.bio,g.bio,{ancestry:g.ancestry});
  ALL_ATTRS.forEach(a=>c.attrs[a].max=g.attrs[a]);Object.entries(g.skills).forEach(([n,st])=>c.skills[n]=st.length);
  c.abil=g.abil.map(x=>x.entry);c.traits=g.traits.map(x=>x.entry);c.magic=g.magic.map(x=>x.entry);c.flaws=g.flaws.slice();c.fp=g.attrs.FATE;
  if(g.literacy&&g.literate)c.abil.push({id:'lit',n:'Literate',cat:'Mental',spec:g.literate,cost:0,free:true});
  return c;}

function card(sel,act,attrs,title,body){return `<button class="ccard${sel?' sel':''}" data-act="${act}" ${attrs} style="${sel?'border-color:var(--steel);background:var(--steel-soft)':''}"><h3 style="font-size:19px">${title}</h3><div class="meta">${body}</div></button>`;}
function gSetup(){const g=G();

function gAttrs(){const g=G();const cap=gPL().cap;

function gSkills(){const g=G();const left=skillLeft(),pools=skillPools();const ql=(UI.genQ||'').toLowerCase();

function gAnc(){const g=G();const tbl=DB.anc[g.ancestry]||[];
  return `<h2>Ancestry</h2><p class="muted" style="font-size:14px;margin:4px 0 12px">Ancestry doesn't change Attributes or Skills; it decides which Ancestry Traits you can buy in the next step. Your GM decides which ancestries exist.</p>

function gAbil(){const g=G();const left=abilLeft(),pools=abilPools();const totLeft=sum(Object.values(left));const flawCap=2-g.flawTrades;

  ${totLeft>1?`<div class="note ember" style="margin-bottom:10px">${totLeft} points unspent. The rules ask you to spend all but 1.</div>`:totLeft===1?`<div class="note steel" style="margin-bottom:10px">1 point left over: it becomes ${gPL().remXP} XP.</div>`:''}
