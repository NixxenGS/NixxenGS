   ${g.traitMode==='roll'&&ANCESTRIES[g.ancestry]?`<button class="btn" data-act="gRollTrait">${IC.dice} Roll a trait (6 points)</button>`:`<button class="btn" data-act="gBuyTrait">${IC.plus} Trait level (6 points)</button>`}
   <button class="btn ghost" data-act="gAbilAuto">Spend randomly</button></div>
  <div class="faint" style="font-size:13px;margin-bottom:10px">You may take up to 2 extra Flaw levels instead of paying for trait levels (${flawCap} left).</div>

  ${g.abil.length+g.traits.length+g.magic.length?`<div class="list panel" style="padding:0 12px">

   ${g.magic.map((x,i)=>`<div class="item"><span class="pill brass">${x.entry.kind==='spell'?'Spell':'Power'}</span><div class="main"><b>${esc(x.entry.n)}</b><div class="sub">${paidTxt(x)}</div></div><button class="icon-btn" data-act="gUndo" data-k="magic" data-i="${i}" aria-label="Remove">${IC.trash}</button></div>`).join('')}
  </div>`:'<div class="empty">Nothing bought yet.</div>'}

function flawLevels(){return sum(G().flaws.map(f=>parseInt(f.lv)||1));}
function gFlaws(){const g=G();const need=1+g.flawTrades;const have=flawLevels();

function gIdent(){const g=G();const b=g.bio;
  return `<h2>Background & Career</h2><p class="muted" style="font-size:14px;margin:4px 0 12px">Now that you know what the character can do, decide who they are. Career is a couple of words; it powers the catch-all Career skill.</p>
  <div class="grid2"><label class="field"><span>Name</span><div class="row nw"><input type="text" data-gbio="name" value="${esc(b.name)}"><button class="btn" data-act="gRandName" aria-label="Random name">${IC.dice}</button></div></label>

function cartTotal(){const g=G();const c=gChar();const inh=hasAbil(c,'Inheritance II')?2:hasAbil(c,'Inheritance I')?1:0;return sum(g.cart.map(i=>{let v=i.cost;if(i.type==='armor'&&hasFlaw(c,'Obese'))v+=2;if(v>=5&&inh)v-=inh;return Math.max(i.cost>0?1:0,v);}));}
function gWealth(){const g=G();const c=gChar();
  const sk=hasAbil(c,'Well Paid')?'Career':hasAbil(c,'Entertainer')?'Perform':'Status';const bonus=(hasAbil(c,'Inheritance II')?20:hasAbil(c,'Inheritance I')?10:0)-(hasFlaw(c,'Poor')?10:0);

  return `<h2>Wealth & Equipment</h2><p class="muted" style="font-size:14px;margin:4px 0 12px">Starting Currency Points come from a ${sk} check${bonus?` (${sgn(bonus)} from ${bonus>0?'Inheritance':'Poor'})`:''}. Your GM may instead hand out gear that fits your background.</p>
  <div class="row" style="margin-bottom:12px"><button class="btn pri" data-act="gRollCP">${IC.dice} Roll ${sk} for CP</button><label class="row nw" style="gap:6px"><span class="lbl">or set CP</span><input type="number" id="g-cp" class="inline-num" value="${g.cp==null?'':g.cp}"></label>${g.cpNote?`<span class="faint" style="font-size:13px">${esc(g.cpNote)}</span>`:''}</div>
  <div class="pools" style="margin-bottom:12px"><div class="pool"><small>Currency Points</small><b>${g.cp==null?'—':g.cp}</b></div><div class="pool"><small>Cart</small><b>${spent}</b></div><div class="pool ${left!=null&&left<0?'neg':''}"><small>Left</small><b>${left==null?'—':left}</b></div></div>
  <div class="row" style="margin-bottom:12px"><button class="btn" data-act="gShop" data-t="weapon">${IC.plus} Weapon</button><button class="btn" data-act="gShop" data-t="armor">${IC.plus} Armor piece</button><button class="btn" data-act="gShop" data-t="gear">${IC.plus} Gear</button></div>
  ${g.cart.length?`<div class="list panel" style="padding:0 12px">${g.cart.map((i,ix)=>`<div class="item"><span class="pill">${i.type}${i.loc?' · '+i.loc:''}</span><div class="main"><b>${esc(i.item.n)}</b>${i.type==='gear'?`<div class="sub">L${i.item.lv} · ${esc(i.item.skill)}${i.item.desc?': '+esc(i.item.desc):''}</div>`:''}</div><span class="cost">${i.cost} CP</span><button class="icon-btn" data-act="gUncart" data-i="${ix}" aria-label="Remove">${IC.trash}</button></div>`).join('')}</div>`:'<div class="empty">Nothing in the cart.</div>'}
  <div class="faint" style="font-size:12.5px;margin-top:8px">Armor cost is per piece (Head, Torso, Arms, Legs). Gear costs ${GEAR_COST[1][ERAS.indexOf(g.era)]}/${GEAR_COST[2][ERAS.indexOf(g.era)]}/${GEAR_COST[3][ERAS.indexOf(g.era)]} CP for Levels 1/2/3 in the ${g.era} era.</div>`;}
function gIssues(){const g=G();const out=[];const cap=gPL().cap;
  if(g.method==='pick'){const l=attrPoints()-attrSpent();if(l>0)out.push(`${l} Attribute Points unspent.`);if(l<0)out.push(`Attribute Points overspent by ${-l}.`);if(ALL_ATTRS.filter(a=>g.attrs[a]>=cap).length>2)out.push(`More than two Attributes at ${cap}.`);}
  else{if(!g.base)out.push('Attributes not rolled yet.');else if(g.free.length<freePoints())out.push('Free Attribute point not assigned.');}
  const sl=sum(Object.values(skillLeft()));if(sl>0)out.push(`${sl} Skill Points unspent (they are lost).`);
  const al=sum(Object.values(abilLeft()));if(al>1)out.push(`${al} Ability Points unspent.`);if(Object.values(abilLeft()).some(v=>v<0))out.push('Ability Points overspent.');
  if(flawLevels()<1+g.flawTrades)out.push(`Needs ${1+g.flawTrades} Flaw level${g.flawTrades?'s':''}.`);
  if(!g.bio.name)out.push('No name yet.');
  if(g.cp!=null&&cartTotal()>g.cp)out.push('Equipment costs more than your Currency Points.');
  return out;}
function gReview(){const g=G();const c=gChar();const K=calc(c);const iss=gIssues();
  return `<h2>Review</h2><p class="muted" style="font-size:14px;margin:4px 0 12px">Check everything, then create the character. You can still change anything later in Edit mode.</p>
  ${iss.length?`<div class="note ember" style="margin-bottom:12px"><b>Before you finish:</b><br>${iss.map(esc).join('<br>')}</div>`:'<div class="note steel" style="margin-bottom:12px">Everything checks out.</div>'}
  <div class="panel" style="margin-bottom:12px"><h3 style="font-family:var(--f-name);font-size:24px">${esc(g.bio.name||'Unnamed')}</h3><div class="muted">${esc(ANCESTRIES[g.ancestry]?g.ancestry:(g.customAnc||'Custom ancestry'))} · ${esc(g.bio.career||'No career')} · PL ${g.pl} · ${g.method==='roll'?'Roll':'Pick'} Method</div>
   <div class="minis" style="margin-top:10px">${ALL_ATTRS.filter(a=>g.useFate||a!=='FATE').map(a=>`<div><small>${a}</small><b>${g.attrs[a]}</b></div>`).join('')}</div></div>
  <div class="grid2">
   <div class="panel"><div class="sec">Skills</div>${Object.keys(g.skills).sort().map(n=>`<div class="kv"><span>${esc(n)}</span><b class="num">${gRank(n)}</b></div>`).join('')||'<div class="faint">None</div>'}</div>
   <div class="panel"><div class="sec">Characteristics</div>
    ${[['Wound Level',K.wl.max],['Injury Level',K.il.max],['Mortality Thr.',K.mth.max],['Terror Level',K.tl.max],['Fear Level',K.fl.max],['Insanity Thr.',K.ith.max],['Base Defense',K.bd.max],['Magic Defense',K.md.max],['Mental Defense',K.med.max],['Size / Speed',K.size+' / '+K.speed],['Wound Threshold',K.wth]].map(([k,v])=>`<div class="kv"><span>${k}</span><b class="num">${v}</b></div>`).join('')}</div>
   <div class="panel"><div class="sec">Abilities, traits & magic</div>${[...c.abil.map(a=>a.n+(a.spec?` (${a.spec})`:'')),...c.traits.map(t=>`${t.n}${t.spec?` (${t.spec})`:''} ${t.lv}`),...c.magic.map(m=>`${m.kind==='spell'?'Spell':'Power'}: ${m.n}`)].map(x=>`<div class="kv"><span>${esc(x)}</span></div>`).join('')||'<div class="faint">None</div>'}</div>
   <div class="panel"><div class="sec">Flaws & gear</div>${g.flaws.map(f=>`<div class="kv"><span>${esc(f.n)}${f.spec?` (${esc(f.spec)})`:''}</span><b>L${f.lv}</b></div>`).join('')}${g.cart.map(i=>`<div class="kv"><span>${esc(i.item.n)}${i.loc?' ('+i.loc+')':''}</span><b>${i.cost} CP</b></div>`).join('')}<div class="kv"><span>CP remaining</span><b class="num">${g.cp==null?0:g.cp-cartTotal()}</b></div></div>
  </div>`;}

/* ---------- generator actions */
ACT.gStep=el=>{G().step=+el.dataset.i;render();window.scrollTo(0,0);};
ACT.gPrev=()=>{G().step--;render();window.scrollTo(0,0);};
ACT.gNext=()=>{const g=G();if(g.step===1&&g.method==='roll'&&!g.base)return toast('Roll your Attributes first');if(g.step===3&&!ANCESTRIES[g.ancestry]){const n=$('#g-ancname');g.customAnc=n?n.value:'';}g.step++;render();window.scrollTo(0,0);};
ACT.gExit=()=>{confirmBox('Leave the generator? Your progress on this character is kept until you start another one.','Leave',()=>{UI.view='home';render();},false);};
ACT.gHelp=()=>openCompendium();
ACT.gSet=el=>{const g=G();const k=el.dataset.k;let v=el.dataset.v;if(k==='pl')v=+v;
  if(k==='pl'||k==='method'){g[k]=v;resetAttrs();}else g[k]=v;
  if(k==='ancestry'){g.traits=[];}render();};
function resetAttrs(){const g=G();ALL_ATTRS.forEach(a=>g.attrs[a]=a==='FATE'?0:gMin(a));if(g.method==='pick'&&g.useFate)g.attrs.FATE=0;g.base=null;g.rolls=null;g.flipped=null;g.flip=[];g.free=[];g.skills={};g.abil=[];g.traits=[];g.magic=[];g.flawTrades=0;}
ACT.gAttrReset=()=>{resetAttrs();render();};
ACT.gAttrRandomPick=()=>{const g=G();resetAttrs();const cap=gPL().cap;let left=attrPoints()-attrSpent();const keys=ALL_ATTRS.filter(a=>g.useFate||a!=='FATE');let guard=0;
  while(left>0&&guard++<999){const a=pick(keys);const atCap=keys.filter(k=>g.attrs[k]>=cap).length;if(g.attrs[a]>=cap||(g.attrs[a]===cap-1&&atCap>=2))continue;if(a==='FATE'&&g.attrs.FATE>=3&&Math.random()<.7)continue;g.attrs[a]++;left--;}render();};
ACT.gRoll=()=>{rollAttrs();render();};
ACT.gFlipPick=el=>{const g=G();const a=el.dataset.a;if(g.flip.includes(a)){g.flip=g.flip.filter(x=>x!==a);}else g.flip.push(a);
  if(g.flip.length===2){g.flipped=g.flip.slice();g.flip=[];g.free=[];applyRoll();toast(`Swapped ${g.flipped[0]} and ${g.flipped[1]}`);}render();};
ACT.gUnflip=()=>{const g=G();g.flipped=null;g.free=[];applyRoll();render();};
ACT.gFree=el=>{const g=G();if(g.free.length>=freePoints())return;g.free.push(el.dataset.a);applyRoll();render();};
ACT.gUnfree=()=>{const g=G();g.free=[];applyRoll();render();};
ACT.gPay=el=>{G().pay=el.dataset.p;render();};
ACT.gSkill=el=>{const n=el.dataset.s;if(+el.dataset.d>0)buySkill(n);else sellSkill(n);G().abil=G().abil;refreshView(true);};
ACT.gSkillAuto=()=>{autoSkills();refreshView(true);};
ACT.gSkillReset=()=>{G().skills={};refreshView(true);};
ACT.gBuyAbil=()=>{const g=G();const c=gChar();openAbilityPicker(c,{mode:'gen',title:'Buy an ability',sub:'Ability Points · prerequisites use your current build',
  onBuy:(entry,a,redraw)=>{const cat=entry.kind?'General':a.cat;closeModal(true);payDialog(`${entry.kind?(entry.kind==='spell'?'Spell':'Power')+': ':''}${entry.n}${entry.spec?' ('+entry.spec+')':''}`,entry.cost,cat,paid=>{if(entry.kind)g.magic.push({entry,paid});else g.abil.push({entry,paid});render();toast(`${entry.n} bought`);});}});};
ACT.gBuySpell=()=>{const g=G();const c=gChar();if(!hasAbil(c,'Magic User')&&rank(c,'Arcana')<1)toast('Spells need Magic User or Arcana 1+');
  pickManifestation(c,'spell',entry=>payDialog(`Spell: ${entry.n}`,4,'General',paid=>{g.magic.push({entry,paid});render();}));};
ACT.gBuyPower=()=>{const g=G();const c=gChar();if(!hasAbil(c,'Super Powers'))toast('Powers need the Super Powers ability');
  pickManifestation(c,'power',entry=>payDialog(`Power: ${entry.n}`,entry.cost,'General',paid=>{g.magic.push({entry,paid});render();}));};
function addTraitLevel(t,payment){const g=G();const ex=g.traits.find(x=>x.entry.n===t.n&&(x.entry.spec||'')===(t.spec||''));const max=(DB.trait[t.n]||{}).lv||3;
  if(ex){if(ex.entry.lv>=max){toast(`${t.n} is already at Level ${max}`);return false;}ex.entry.lv++;ex.levels.push(payment);}else g.traits.push({entry:t,levels:[payment]});
  if(payment.viaFlaw)g.flawTrades++;return true;}
// trait entries: paid aggregated for abilSpent
function syncTraitPaid(){G().traits.forEach(x=>{const p={};x.levels.forEach(l=>{if(l.paid)Object.entries(l.paid).forEach(([k,v])=>p[k]=(p[k]||0)+v);});x.paid=p;});}
function traitPayment(name,cb){const g=G();const canFlaw=g.flawTrades<2;
  openModal({title:`Trait level: ${name}`,body:`<p class="muted">Each trait level costs 6 Ability Points from any pool, or one extra Flaw level chosen by the GM (up to 2).</p>`,
    foot:`<button class="btn" data-close>Cancel</button>${canFlaw?'<button class="btn danger" id="tp-flaw">Take a Flaw level</button>':''}<button class="btn pri" id="tp-pts">Pay 6 points</button>`,
    onMount:m=>{const f=$('#tp-flaw',m);if(f)f.onclick=()=>{closeModal(true);cb({viaFlaw:true});};$('#tp-pts',m).onclick=()=>{closeModal(true);payDialog(`Trait level: ${name}`,6,'General',paid=>cb({paid}));};}});}
ACT.gBuyTrait=()=>{const g=G();const c=gChar();openTraitPicker(c,t=>traitPayment(t.n,pay=>{if(addTraitLevel(t,pay)){syncTraitPaid();render();}}),{price:'6'});};
ACT.gRollTrait=()=>{const g=G();traitPayment('rolled',pay=>{const tbl=DB.anc[g.ancestry];let tries=0;
  const roll=()=>{const d=d10();const row=tbl.find(r=>{const [lo,hi]=r[0].split(/[–-]/).map(Number);return d>=lo&&d<=(hi||lo);});return {d,name:row?row[1]:'Nothing'};};
  let r=roll(),res;
  while(tries++<20){if(r.name==='Nothing'){res={d:r.d,txt:'Nothing. The points are lost.'};if(pay.viaFlaw)g.flawTrades++;else g.abil.push({entry:{id:uid(),n:'(Rolled trait: Nothing)',cat:'General',spec:'',cost:6,placeholder:true},paid:pay.paid});break;}
    const t=parseTraitName(r.name);const ex=g.traits.find(x=>x.entry.n===t.n&&(x.entry.spec||'')===(t.spec||''));const max=(DB.trait[t.n]||{}).lv||3;
    if(ex&&ex.entry.lv>=max){r=roll();continue;}
    const fin=spec=>{addTraitLevel({id:uid(),n:t.n,lv:1,spec},pay);syncTraitPaid();render();toast(`Rolled ${r.d}: ${t.n}${spec?' ('+spec+')':''}`);};
    if(t.spec&&!/^Any/i.test(t.spec))fin(t.spec);else askSpec(gChar(),TSPEC[t.n],t.n,fin);return;}
  syncTraitPaid();render();if(res)toast(`Rolled ${res.d}: ${res.txt}`);});};
ACT.gUndo=el=>{const g=G();const k=el.dataset.k,i=+el.dataset.i;
  if(k==='traits'){const x=g.traits[i];const l=x.levels.pop();if(l&&l.viaFlaw)g.flawTrades--;x.entry.lv--;if(!x.levels.length)g.traits.splice(i,1);syncTraitPaid();}
  else g[k].splice(i,1);render();};
ACT.gAbilAuto=()=>{autoAbilities(G());render();};
function autoAbilities(g,prefs){let guard=0;
  while(guard++<60){const left=abilLeft();const tot=sum(Object.values(left));if(tot<=1)break;const c=gChar();
    const cands=DB.abilities.filter(a=>{if(a.n==='Spell X'||a.n==='Power X'||a.n==='Power Permanence'||/Unique Item/.test(a.n))return false;const p=prereqCheck(c,a);if(!p.ok||p.gm)return false;
      if(c.abil.some(x=>x.n===a.n)&&!SPEC[a.n])return false;if(a.cat==='Fate'&&!g.useFate)return false;const cost=abilCostNum(a);return autoAlloc(cost,a.cat).ok;});
    if(!cands.length){ // try a trait level
      const own=ancTraits(g.ancestry).map(parseTraitName);if(own.length&&tot>=6&&autoAlloc(6,'General').ok){const t=pick(own);const spec=t.spec&&!/^Any/i.test(t.spec)?t.spec:(TSPEC[t.n]&&TSPEC[t.n].o?pick(TSPEC[t.n].o):'');if(!(TSPEC[t.n]&&TSPEC[t.n].t==='man')){addTraitLevel({id:uid(),n:t.n,lv:1,spec},{paid:autoAlloc(6,'General').alloc});syncTraitPaid();continue;}}
      break;}
    const w=cands.map(a=>{const pl=left[a.cat]||0;return (a.cat==='General'?1:pl>0?3:0.3)*(prefs&&prefs.includes(a.n)?6:1);});let r=Math.random()*sum(w),i=0;while(r>w[i]){r-=w[i];i++;}
    const a=cands[Math.min(i,cands.length-1)];const sp=SPEC[a.n];let spec='';
    if(sp){if(sp.t==='choice')spec=pick(sp.o);else if(sp.t==='skill')spec=pick(Object.keys(g.skills).length?Object.keys(g.skills):DB.skills.map(s=>s.n));else if(sp.t==='weapon')spec=g.cart.find(x=>x.type==='weapon')?.item.n||'Main weapon';else if(sp.t==='action')spec='Standard Attack';else spec=sp.ph||'';}
    const al=autoAlloc(abilCostNum(a),a.cat);const paid={};POOLS.forEach(p=>{if(al.alloc[p])paid[p]=al.alloc[p];});
    g.abil.push({entry:{id:uid(),n:a.n,cat:a.cat,spec,cost:abilCostNum(a)},paid});}
}

function buildFromGen(g){const c=gChar();c.id=uid();c.method=g.method;c.bio.ancestry=ANCESTRIES[g.ancestry]?g.ancestry:(g.customAnc||'Custom');
  c.abil=g.abil.filter(x=>!x.entry.placeholder).map(x=>Object.assign({},x.entry,{paid:x.paid}));
  if(g.literacy&&g.literate)c.abil.unshift({id:uid(),n:'Literate',cat:'Mental',spec:g.literate,cost:2,free:true});
  c.traits=g.traits.map(x=>Object.assign({},x.entry));c.magic=g.magic.map(x=>Object.assign({},x.entry,{paid:x.paid}));
  // Innate Power grants skill & focus ranks if 0
  c.traits.filter(t=>t.n==='Innate Power'&&DB.man[t.spec]).forEach(t=>{const sk=SCHOOLS[DB.man[t.spec].sc].skill;if(!c.skills[sk])c.skills[sk]=1;if(!c.skills.Focus)c.skills.Focus=1;});
  if(c.traits.some(t=>t.n==='Machine Physiology')&&!c.skills.Sysops)c.skills.Sysops=Math.min(1,c.attrs.KNO.max);
  const rem=sum(Object.values(abilLeft()));if(rem===1){c.xp.total+=PLD[g.pl].remXP;c.xp.log.unshift({t:Date.now(),d:'Leftover Ability Point',xp:PLD[g.pl].remXP});}
  c.cp=Math.max(0,(g.cp||0)-cartTotal());
  g.cart.forEach(i=>{if(i.type==='weapon'){const w=Object.assign(deep(i.item),{id:uid(),equipped:true});if(w.ammo&&/\d+\/\d+/.test(w.ammo))w.ammoCur=+w.ammo.split('/')[1];c.weapons.push(w);}
    if(i.type==='armor')c.armor[i.loc]=deep(i.item);if(i.type==='gear')c.gear.push(Object.assign({id:uid()},i.item));});
  c.fp=c.attrs.FATE.max;c.created=Date.now();c.updated=Date.now();
  return c;}

const ARCHETYPES={
 Warrior:{attrs:['STR','END','DEX','AGI'],skills:{Swords:5,Axes:4,Shields:4,Dodge:4,Resilience:5,Athletics:3,Stamina:3,Courage:3,Reaction:3,Intimidation:2},careers:['Soldier','Knight','Mercenary','Gladiator','Space Marine'],abil:['Grit I','Weapon Master I','Hard to Hit I','Lethal Weapon I','Stout','Hardy']},

function quickRandom(pl=1,useFate=true,era='Medieval'){
  UI.gen=newGen();const g=G();g.pl=pl;g.useFate=useFate;g.era=era;g.method='roll';g.traitMode='roll';
  const arch=useFate?pick(Object.keys(ARCHETYPES)):pick(Object.keys(ARCHETYPES).filter(k=>k!=='Mystic'));const A=ARCHETYPES[arch];
  rollAttrs();
  // flip: lowest key attribute with highest non-key attribute
  const keys=A.attrs.filter(a=>useFate||a!=='FATE');const non=ALL_ATTRS.filter(a=>!keys.includes(a)&&(useFate||a!=='FATE'));
  const low=keys.slice().sort((a,b)=>g.attrs[a]-g.attrs[b])[0],high=non.slice().sort((a,b)=>g.attrs[b]-g.attrs[a])[0];
  if(g.attrs[high]>g.attrs[low]){g.flipped=[low,high];applyRoll();}
  const cap=PLD[pl].cap;for(let i=0;i<freePoints();i++){const t=keys.filter(a=>g.attrs[a]<cap).sort((a,b)=>g.attrs[b]-g.attrs[a])[0]||ALL_ATTRS.find(a=>g.attrs[a]<cap);g.free.push(t);applyRoll();}
  autoSkills(A.skills);
  g.ancestry=pick(Object.keys(ANCESTRIES));
  // rolled trait if affordable
  const c0=gChar();
  if(arch==='Mystic'&&useFate){const mu=DB.ability['Magic User'];const al=autoAlloc(6,'General');if(al.ok&&prereqCheck(gChar(),mu).ok){const paid={};POOLS.forEach(p=>{if(al.alloc[p])paid[p]=al.alloc[p];});g.abil.push({entry:{id:uid(),n:'Magic User',cat:'General',spec:'',cost:6},paid});
    const schools=Object.keys(SCHOOLS).filter(s=>gRank(SCHOOLS[s].skill)>0);const cap2=gRank('Focus')*2;for(let i=0;i<Math.min(2,cap2);i++){const al2=autoAlloc(4,'General');if(!al2.ok)break;const ms=DB.mans.filter(m=>schools.includes(m.sc)&&!g.magic.some(x=>x.entry.n===m.n));if(!ms.length)break;const m=pick(ms);const p2={};POOLS.forEach(p=>{if(al2.alloc[p])p2[p]=al2.alloc[p];});g.magic.push({entry:{id:uid(),kind:'spell',n:m.n,lv:{},cost:4,src:'ability'},paid:p2});}}}
  autoAbilities(g,A.abil);
  const opts=DB.flaws.filter(f=>f.lv==='1'&&(useFate||f.cat!=='Fate')&&!/Permanent|Limitation|Inept/.test(f.n));const f=pick(opts);const sp=FSPEC[f.n];g.flaws.push({id:uid(),n:f.n,lv:1,spec:sp&&sp.t==='choice'?pick(sp.o):''});
  g.bio.name=pick(NAMES);g.bio.career=pick(A.careers);
  // wealth: Status roll
  const c=gChar();const pool=poolFor(g.attrs.INF,gRank('Status'),0,0);const r=rollDice({rolled:pool.rolled,kept:pool.kept,explode:gRank('Status')>0});g.cp=r.total;
  // gear: best weapon for top weapon skill
  const wsk=['Swords','Axes','Bludgeons','Polearms','Spears','Short Blades','Bows','Crossbows','Guns','Thrown','Hand to Hand'].sort((a,b)=>gRank(b)-gRank(a))[0];
  const ws=DB.weapons.filter(w=>w.skill===wsk&&ERAS.indexOf(w.era)<=ERAS.indexOf(era)).sort((a,b)=>b.cost-a.cost);
  const wpn=ws.find(w=>w.cost<=g.cp-cartTotal())||ws.at(-1);if(wpn)g.cart.push({type:'weapon',item:wpn,cost:wpn.cost});
  if(gRank('Shields')>0){const sh=DB.weapons.filter(w=>w.skill==='Shields'&&ERAS.indexOf(w.era)<=ERAS.indexOf(era)).sort((a,b)=>a.cost-b.cost)[0];if(sh&&sh.cost<=g.cp-cartTotal())g.cart.push({type:'weapon',item:sh,cost:sh.cost});}
  const arm=DB.armor.filter(a=>ERAS.indexOf(a.era)<=ERAS.indexOf(era)).sort((a,b)=>(b.s+b.p+b.b)-(a.s+a.p+a.b));
  for(const L of ['Torso','Head','Legs','Arms']){const a=arm.find(x=>x.cost<=g.cp-cartTotal()&&!/Unwieldy/.test(x.q));if(a)g.cart.push({type:'armor',item:a,cost:a.cost,loc:L});}
  if(g.cart.length&&cartTotal()>g.cp){g.cart=g.cart.slice(0,1);}
  g.bio.background=`A ${pl===1?'hard-bitten':pl===2?'heroic':'legendary'} ${g.bio.career.toLowerCase()} (${arch.toLowerCase()} archetype), generated with the Roll Method.`;
  const ch=buildFromGen(g);UI.gen=null;return ch;
}

    foot:`<button class="btn" id="ex-dl">Download file</button><button class="btn pri" id="ex-cp">Copy JSON</button>`,onMount:m=>{$('#ex-cp',m).onclick=()=>{const t=$('#ex-t',m);t.select();copyText(txt);};$('#ex-dl',m).onclick=()=>downloadText(name,txt);}});}
function openImport(){
  openModal({title:'Import characters',body:`<label class="field"><span>Choose a .json file</span><input type="file" id="im-f" accept=".json,application/json"></label><label class="field"><span>Or paste JSON</span><textarea class="json" id="im-t" placeholder='{"characters":[...]}'></textarea></label>`,
    foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="im-go">Import</button>`,onMount:m=>{
      $('#im-f',m).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#im-t',m).value=r.result;};r.readAsText(f);};
      $('#im-go',m).onclick=()=>{try{const o=JSON.parse($('#im-t',m).value);const arr=Array.isArray(o)?o:o.characters?o.characters:[o];let n=0;
        arr.forEach(c=>{if(!c||!c.attrs)return;c=migrate(c);if(STORE.chars.some(x=>x.id===c.id))c.id=uid();STORE.chars.push(c);n++;});
        save();closeModal(true);render();toast(n?`Imported ${plural(n,'character')}`:'No characters found in that JSON');}catch(err){toast('That isn\'t valid JSON. Check the text and try again.');}};}});}

/* ---------- compendium */
function openCompendium(){
  const cats={Skills:DB.skills.map(s=>({k:'Skills',n:s.n,t:`${ATTR_NAME[s.a]} skill`,d:s.d,pg:s.pg})),
    Abilities:DB.abilities.map(a=>({k:'Abilities',n:a.n,t:`${a.cat} · ${a.c} pts · Prereq: ${a.pre||'None'}`,d:a.d,pg:a.pg})),
    Traits:DB.traits.map(t=>({k:'Traits',n:t.n,t:`Ancestry trait · levels ${t.st==='Yes'?'stack':'replace'}`,d:t.d+' '+t.l.map((x,i)=>`L${i+1}: ${x}`).join(' '),pg:t.pg})),
    Flaws:DB.flaws.map(f=>({k:'Flaws',n:f.n,t:`${f.cat} flaw · level ${f.lv}`,d:f.d,pg:f.pg})),
    Actions:DB.actions.map(a=>({k:'Actions',n:a.n,t:`${a.k} · ${a.ap} AP · ${a.ty}`,d:a.d,pg:a.pg})),
    Magic:DB.mans.map(m=>({k:'Magic',n:m.n,t:`${m.sc} · ${SCHOOLS[m.sc].skill} · Resist ${m.res}`,d:`${m.d} Potency: ${m.p[0]}${m.p[1]?' ('+m.p[1]+'/lvl)':''}. Duration: ${m.du[0]}. Range: ${m.r[0]}. Targets: ${m.t[0]}.`,pg:m.pg,sc:m.sc})),
    Qualities:[...DB.wq.map(q=>({k:'Qualities',n:q.n,t:'Weapon quality',d:q.d})),...DB.aq.map(q=>({k:'Qualities',n:q.n,t:'Armor quality',d:q.d}))],
    Weapons:DB.weapons.map(w=>({k:'Weapons',n:w.n,t:`${w.era} · ${w.skill} · ${w.cost} CP`,d:`S ${w.s} / P ${w.p} / B ${w.b} / O ${w.o}${w.ranged?` · Range ${w.range} · ROF ${w.rof} · Ammo ${w.ammo}`:''} · ${w.q}`})),
    Armor:DB.armor.map(a=>({k:'Armor',n:a.n,t:`${a.era} · ${a.cost} CP per piece`,d:`S ${a.s} / P ${a.p} / B ${a.b} / O ${a.o}${a.q?' · '+a.q:''}`}))};
  const rules=[
    ['Roll & Keep','Roll Attribute + Skill dice, keep the Attribute\'s number of highest dice and total them. Benefits add rolled dice. 10s explode on trained checks.'],
    ['Maximum pool','At most 2 × Attribute dice rolled. Every 2 extra become +1 kept die; an odd extra is +3. Kept dice cap at 2 × Attribute; beyond that each is +3.'],
    ['Hardships','Each Hardship adds an exploding Penalty Die to the difficulty (or the opponent\'s total).'],
    ['Pulling back','Before rolling, keep up to WILL fewer dice (minimum 1) to reduce Surge risk.'],
    ['Opposed ties','Higher Skill rank wins with 0 LoS, then higher Attribute, then reroll.'],
    ['Hit location','Rightmost digit of the attack: 0 Head (+5 damage), 1–2 Arm (−3), 3–7 Torso, 8–9 Leg (−3). Odd = left, even = right.'],
    ['Damage','BSV = attack − defense (0 is a hit). TSV = BSV + weapon damage − armor, then location modifier. Injury at IL, Wound at WL, Death Roll at MTh, death at 2 × MTh.'],
    ['Range bands','Point blank (≤2 hexes): BD only. Close (< ½ range): +1 Range Die. Medium (½–1½): +2. Long (to 2×): +3. Extreme: +4.'],
    ['Wound effects','After combat roll 3d10 + Wound Effect Dice (Superficial 2, Moderate 1, Terrible 0) on the location table. Critical −2, Serious −1 Attribute; Minor −3 on checks.'],
    ['Healing','Up to three treatments per wound, one per Healing Period, TN = wound TSV, +1 Hardship per Healing Period of age. Success heals 1 / 2 / 3 points at TSV, +5, +11.']];
  let cat='All',q='';
  const draw=()=>{const b=modalBody();const ql=q.toLowerCase();
    const pool=cat==='All'?Object.values(cats).flat():cat==='Core rules'?[]:cats[cat];
    const items=pool.filter(i=>!ql||(i.n+' '+i.t+' '+i.d).toLowerCase().includes(ql)).slice(0,200);
    b.innerHTML=`<div class="search">${IC.search}<input type="search" id="cp-q" placeholder="Search rules, abilities, spells, weapons…" value="${esc(q)}"></div>
     <div class="row" style="gap:6px">${['All','Core rules',...Object.keys(cats)].map(k=>`<button class="chip" data-c="${k}" aria-pressed="${cat===k}">${k}</button>`).join('')}</div>
     ${cat==='Core rules'||(cat==='All'&&!ql)?`<div class="list">${rules.map(([n,d])=>`<div class="item"><div class="main"><b>${n}</b><p>${esc(d)}</p></div></div>`).join('')}</div>`:''}
     ${cat!=='Core rules'?`<div class="list">${items.map(i=>`<div class="item">${i.sc?`<span class="school-dot" style="background:var(${SCHOOLS[i.sc].v})"></span>`:''}<div class="main"><b>${esc(i.n)}</b> <span class="faint" style="font-size:12px">${esc(i.t)}</span><p>${esc(i.d)}</p></div>${i.pg?`<span class="pg">p.${i.pg}</span>`:''}</div>`).join('')||'<div class="empty">Nothing matches.</div>'}</div>`:''}`;
    const qi=$('#cp-q',b);qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;draw();const n=$('#cp-q',modalBody());n.focus();n.setSelectionRange(p,p);};
    $$('[data-c]',b).forEach(x=>x.onclick=()=>{cat=x.dataset.c;draw();});};
  openModal({title:'Rules compendium',sub:'Condensed summaries with Core Rulebook page numbers',wide:true,body:'',onMount:draw});
}

/* ---------- render loop & events */
function render(){
  const app=$('#app');
  let html='';
  if(UI.view==='sheet')html=renderSheet();
  else if(UI.view==='gen'){if(!UI.gen)UI.gen=newGen();html=renderGen();}
  else html=renderHome();
  app.innerHTML=html;
  postRender();
}
function refreshView(keep){const y=window.scrollY;render();if(keep)window.scrollTo(0,y);}
function postRender(){
  const main=$('#main');if(!main)return;
  if(UI.view==='sheet'){const c=C();
    bindInputs(main,c,(p,el)=>{touch(c);if(el.dataset.rerender!=null){if(p==='pl')c.pl=+c.pl;refreshView(true);}});
    bindSteppers(main,id=>{const [k,v]=id.split(/:(.+)/);if(k==='rank')return rank(c,v);if(k==='mod')return (c.mods||{})[v]||0;if(k==='cbt')return c.cbt[v];if(k==='cp')return c.cp;if(k==='tlv')return (c.traits.find(t=>t.id===v)||{}).lv||1;if(k==='ammo'){const w=c.weapons.find(x=>x.id===v);return w.ammoCur==null?+w.ammo.split('/')[1]:w.ammoCur;}return 0;},
      (id,val)=>{const [k,v]=id.split(/:(.+)/);if(k==='rank'){if(val>0)c.skills[v]=val;else delete c.skills[v];}if(k==='mod'){c.mods=c.mods||{};c.mods[v]=val;}if(k==='cbt')c.cbt[v]=val;if(k==='cp')c.cp=val;if(k==='tlv'){const t=c.traits.find(x=>x.id===v);if(t)t.lv=val;}if(k==='ammo'){const w=c.weapons.find(x=>x.id===v);w.ammoCur=val;}touch(c);refreshView(true);});
    const sq=$('#sk-q',main);if(sq)sq.oninput=()=>{UI.skillQ=sq.value;const p=sq.selectionStart;refreshView(true);const n=$('#sk-q');n.focus();n.setSelectionRange(p,p);};
  }
  if(UI.view==='gen'){const g=G();
    bindSteppers(main,id=>{const [k,v]=id.split(':');if(k==='ga')return g.attrs[v];return 0;},(id,val)=>{const [k,v]=id.split(':');if(k==='ga'){const cap=gPL().cap;if(val>=cap&&ALL_ATTRS.filter(a=>a!==v&&g.attrs[a]>=cap).length>=2){toast(`Only two Attributes may be ${cap}`);return;}g.attrs[v]=val;g.skills={};}refreshView(true);});
    $$('[data-gset]',main).forEach(cb=>cb.onchange=()=>{g[cb.dataset.gset]=cb.checked;if(cb.dataset.gset==='useFate')resetAttrs();render();});
    $$('[data-gsel]',main).forEach(s=>s.onchange=()=>{g[s.dataset.gsel]=s.value;render();});
    $$('[data-gbio]',main).forEach(i=>i.oninput=()=>{g.bio[i.dataset.gbio]=i.value;});
    const f0=$('#g-fate0',main);if(f0)f0.onchange=()=>{g.fate0=f0.checked;if(g.base){if(g.fate0){g.base.FATE=0;g.rolls.FATE=null;}else{const d=d10();g.rolls.FATE=d;g.base.FATE=rollTable(g.pl,d);}g.free=[];if(g.flipped&&g.flipped.includes('FATE'))g.flipped=null;applyRoll();}render();};
    const lit=$('#g-lit',main);if(lit)lit.oninput=()=>g.literate=lit.value;
    const an=$('#g-ancname',main);if(an)an.oninput=()=>g.customAnc=an.value;
    const cp=$('#g-cp',main);if(cp)cp.onchange=()=>{g.cp=cp.value===''?null:+cp.value;g.cpNote='Set by hand';render();};
    const gq=$('#gs-q',main);if(gq)gq.oninput=()=>{UI.genQ=gq.value;const p=gq.selectionStart;refreshView(true);const n=$('#gs-q');n.focus();n.setSelectionRange(p,p);};
  }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;if(MODAL&&!MODAL.el.contains(el))return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL)closeModal();});
window.refreshView=refreshView;
window.__hh={poolFor,calc,DB,xpSkillCost,prereqCheck,gatherMods,blankChar,rollDice,sampleChar:()=>sampleChar()};

/* ---------- boot */
function sampleChar(){
  const c=blankChar();c.bio=Object.assign(c.bio,{name:'Maeve',ancestry:'Human',career:'Barbarian',player:'Example',looks:'Scarred, broad-shouldered, quick to laugh and quicker to fight.',background:'Example character from the Core Rulebook walkthrough (Pick Method, PL 1). Delete her whenever you like.'});
  c.pl=1;c.useFate=true;c.method='pick';
  Object.entries({STR:3,AGI:3,DEX:3,END:4,INT:1,KNO:2,SEN:2,WILL:4,PRE:2,EMP:1,COM:1,INF:1,FATE:1}).forEach(([a,v])=>c.attrs[a].max=v);
  c.skills={Athletics:2,Axes:2,Dodge:2,Stealth:2,Shields:2,Resilience:3,Stamina:2,Perception:1,Reaction:2,Courage:4,Intimidation:2};
  c.traits=[{id:uid(),n:'Big',lv:1,spec:''}];
  c.abil=[{id:uid(),n:'Grit I',cat:'Physical',spec:'',cost:6},{id:uid(),n:'Hard to Hit I',cat:'Physical',spec:'',cost:4},{id:uid(),n:'Unbreakable I',cat:'Mental',spec:'',cost:6},{id:uid(),n:'Skilled I',cat:'General',spec:'Courage',cost:2}];
  c.flaws=[{id:uid(),n:'Cultural Naivete',lv:2,spec:''}];
  const ax=DB.weapons.find(w=>w.n==='Battle Axe'),sh=DB.weapons.find(w=>w.n==='Round'),lea=DB.armor.find(a=>a.n==='Leather');
  if(ax)c.weapons.push(Object.assign(deep(ax),{id:uid(),equipped:true}));if(sh)c.weapons.push(Object.assign(deep(sh),{id:uid(),n:'Round Shield',equipped:true}));
  if(lea){c.armor.Head=deep(lea);c.armor.Torso=deep(lea);}
  c.cp=1;c.fp=1;c.sample=true;c.updated=c.created;c.items=[{id:uid(),n:'Waterskin',qty:1,enc:'',notes:''},{id:uid(),n:'Bedroll',qty:1,enc:'',notes:''}];
  return c;}
function boot(){loadStore();applyTheme();
  if(!STORE.chars.length&&!STORE.seeded){STORE.chars.push(sampleChar());STORE.seeded=true;save();}
  render();setTimeout(cloudInit,0);}
boot();

})();</script>
