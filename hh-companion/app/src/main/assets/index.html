}

  --bg:#e9ecf0; --bg-2:#e1e5ea; --panel:#ffffff; --panel-2:#f3f5f8; --line:#d3d8e0; --line-2:#bcc3ce;
  --ink:#1a1e26; --ink-2:#4b515c; --ink-3:#7a808a;
  --steel:#1d6a87; --steel-ink:#ffffff; --steel-soft:rgba(29,106,135,.11);
  --brass:#8f620c; --brass-ink:#ffffff; --brass-soft:rgba(143,98,12,.12);
  --blood:#b42f27; --blood-soft:rgba(180,47,39,.1);
  --ember:#b65c14; --ember-soft:rgba(182,92,20,.11);
  --moss:#3b7a3d; --moss-soft:rgba(59,122,61,.11);
  --sc-alacrity:#a38a10; --sc-cosmos:#b63a30; --sc-divination:#2f62b0; --sc-force:#7044ad; --sc-mentalism:#5f666f; --sc-metamorphosis:#b65c14; --sc-nature:#3f7d34; --sc-soul:#7b766a;
  --shadow:0 10px 30px rgba(20,30,50,.18);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#e9ecf0; --bg-2:#e1e5ea; --panel:#ffffff; --panel-2:#f3f5f8; --line:#d3d8e0; --line-2:#bcc3ce;
  --ink:#1a1e26; --ink-2:#4b515c; --ink-3:#7a808a;
  --steel:#1d6a87; --steel-ink:#ffffff; --steel-soft:rgba(29,106,135,.11);
  --brass:#8f620c; --brass-ink:#ffffff; --brass-soft:rgba(143,98,12,.12);
  --blood:#b42f27; --blood-soft:rgba(180,47,39,.1);
  --ember:#b65c14; --ember-soft:rgba(182,92,20,.11);
  --moss:#3b7a3d; --moss-soft:rgba(59,122,61,.11);
  --sc-alacrity:#a38a10; --sc-cosmos:#b63a30; --sc-divination:#2f62b0; --sc-force:#7044ad; --sc-mentalism:#5f666f; --sc-metamorphosis:#b65c14; --sc-nature:#3f7d34; --sc-soul:#7b766a;
  --shadow:0 10px 30px rgba(20,30,50,.18);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1217; --bg-2:#141820; --panel:#181d25; --panel-2:#1f2530; --line:#2b3240; --line-2:#3a4354;
  --ink:#ebe6da; --ink-2:#aaa69b; --ink-3:#74716a;
  --steel:#8ccbe0; --steel-ink:#0c2630; --steel-soft:rgba(140,203,224,.14);
  --brass:#d9b25c; --brass-ink:#1c1406; --brass-soft:rgba(217,178,92,.15);
  --blood:#e0584e; --blood-soft:rgba(224,88,78,.16);
  --ember:#e8913f; --ember-soft:rgba(232,145,63,.16);
  --moss:#7fbb7f; --moss-soft:rgba(127,187,127,.15);
  --sc-alacrity:#dcc451; --sc-cosmos:#e06459; --sc-divination:#6c9be0; --sc-force:#a77ddb; --sc-mentalism:#a5abb3; --sc-metamorphosis:#e8913f; --sc-nature:#79b866; --sc-soul:#ece9e0;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-variant-numeric:lining-nums;font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.num,input[type=number]{font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
p{margin:0}
a{color:var(--steel)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:10px;min-height:56px}
.topbar .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar .ttl b{font-family:var(--f-name);font-weight:700;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl span{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandmark{width:30px;height:34px;flex:none}
main.view{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px));width:100%;max-width:1320px;margin:0 auto}
main.view.notabs{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg-2);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{background:none;border:0;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-family:var(--f-display);font-size:12.5px;letter-spacing:.06em}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--steel)}
.tabbar button[aria-current="page"] svg{filter:drop-shadow(0 0 6px var(--steel-soft))}
@media (min-width:960px){
  .tabbar{top:56px;bottom:0;right:auto;width:92px;grid-template-columns:1fr;grid-auto-rows:76px;align-content:start;border-top:0;border-right:1px solid var(--line);padding-top:10px}
  .tabbar button{height:auto}
  main.view.withtabs{padding-left:calc(92px + max(24px,env(safe-area-inset-left,0px)));padding-bottom:40px;max-width:none}
}

/* ---------- primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:var(--r-sm);padding:9px 14px;min-height:40px;font-weight:600;letter-spacing:.01em;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn.danger{color:var(--blood);border-color:color-mix(in srgb,var(--blood) 45%,var(--line))}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13.5px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:40px;height:40px;flex:none;border-radius:var(--r-sm);border:1px solid transparent;background:none;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.icon-btn.on{color:var(--steel);background:var(--steel-soft)}
.icon-btn svg{width:21px;height:21px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel.flat{background:none;border-color:var(--line)}
.sec{display:flex;align-items:center;gap:10px;margin:2px 0 10px;font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec .act{order:3;text-transform:none;letter-spacing:0}
.sec b{color:var(--ink);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-2);font-size:13px;white-space:nowrap}
.chip.on,.chip[aria-pressed="true"]{background:var(--steel-soft);border-color:var(--steel);color:var(--steel)}
button.chip{min-height:32px}
.pill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.steel{color:var(--steel);border-color:color-mix(in srgb,var(--steel) 50%,transparent);background:var(--steel-soft)}
.pill.brass{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 50%,transparent);background:var(--brass-soft)}
.pill.blood{color:var(--blood);border-color:color-mix(in srgb,var(--blood) 50%,transparent);background:var(--blood-soft)}
.pill.ember{color:var(--ember);border-color:color-mix(in srgb,var(--ember) 50%,transparent);background:var(--ember-soft)}
.pill.moss{color:var(--moss);border-color:color-mix(in srgb,var(--moss) 50%,transparent);background:var(--moss-soft)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--panel-2);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 13px;min-height:38px;font-weight:600;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--steel-ink)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span,.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;min-height:40px}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--steel);outline:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
input.inline-num{width:76px;flex:none;text-align:center;min-height:36px;padding:4px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--bg-2);overflow:hidden}
.stepper button{width:36px;height:36px;border:0;background:none;font-size:19px;color:var(--ink-2);display:grid;place-items:center}
.stepper button:hover{background:var(--panel-2);color:var(--ink)}
.stepper button:disabled{opacity:.3}
.stepper output{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums lining-nums}
.stepper.lg button{width:44px;height:44px}
.stepper.lg output{min-width:44px;font-size:20px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--steel)}
.list{display:flex;flex-direction:column}
.list>*+*{border-top:1px solid var(--line)}
.empty{padding:22px 14px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:var(--r)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.kv span{color:var(--ink-2)}
.warn{color:var(--ember)} .bad{color:var(--blood)} .good{color:var(--moss)}
.note{font-size:13.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px}
.note.steel{border-color:color-mix(in srgb,var(--steel) 40%,var(--line));background:var(--steel-soft);color:var(--ink)}
.note.ember{border-color:color-mix(in srgb,var(--ember) 45%,var(--line));background:var(--ember-soft);color:var(--ink)}
.note.blood{border-color:color-mix(in srgb,var(--blood) 45%,var(--line));background:var(--blood-soft);color:var(--ink)}
.pg{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
hr.rule{border:0;border-top:1px solid var(--line);margin:4px 0}
.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- attributes */
.attr-wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.attr-wrap{grid-template-columns:1fr}}
.attr-col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.attr-col header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);font-family:var(--f-display);letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.attr-col header .num{font-size:13px;color:var(--ink-2);letter-spacing:0}
.attr{display:grid;grid-template-columns:52px 1fr auto auto;align-items:center;gap:10px;padding:8px 12px}
.attr+.attr{border-top:1px solid var(--line)}
.attr .code{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;font-size:15px}
.attr .nm{font-size:13px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attr .val{font-size:26px;font-weight:800;line-height:1;min-width:30px;text-align:right;font-variant-numeric:tabular-nums lining-nums}
.attr .val.low{color:var(--blood)}
.attr .mx{font-size:12px;color:var(--ink-3);text-align:right;min-width:42px}
.adv{width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:3px;display:inline-block;vertical-align:middle}
.adv.on{background:var(--brass);border-color:var(--brass)}
@media (max-width:560px){.attr{grid-template-columns:52px 1fr auto auto}}

/* ---------- stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
@media (min-width:960px){.stats{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
button.stat:hover{border-color:var(--line-2)}
.stat .k{font-family:var(--f-display);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums lining-nums}
.stat .s{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.down .v{color:var(--blood)}
.stat.key{border-color:color-mix(in srgb,var(--steel) 40%,var(--line))}

/* ---------- fate */
.fate-row{display:flex;gap:6px;flex-wrap:wrap}
.fp{width:30px;height:30px;border-radius:50%;border:2px solid var(--brass);display:grid;place-items:center;background:var(--brass-soft)}
.fp.spent{background:none;border-style:dashed;opacity:.55}
.fp.burnt{border-color:var(--ink-3);background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line-2) 3px 5px);opacity:.6}

/* ---------- skills */
.skill-group{margin-bottom:16px}
.skill-row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px;padding:8px 4px 8px 10px;border-radius:var(--r-sm)}
.skill-row:hover{background:var(--panel-2)}
.skill-row .sn{min-width:0}
.skill-row .sn b{font-weight:600}
.skill-row .sn small{display:block;font-size:12px;color:var(--ink-3)}
.skill-row.untrained .sn b{color:var(--ink-2);font-weight:500}
.rank-dots{display:flex;gap:3px}
.rank-dots i{width:9px;height:9px;border-radius:2px;border:1.5px solid var(--line-2);transform:rotate(45deg)}
.rank-dots i.on{background:var(--steel);border-color:var(--steel)}
.rank-dots i.cap{border-style:dotted}
.rk{font-weight:700;font-size:13px;color:var(--ink-2);min-width:52px;text-align:right;font-variant-numeric:tabular-nums lining-nums}
.rollbtn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:var(--r-sm);height:36px;min-width:48px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;color:var(--steel)}
.rollbtn:hover{border-color:var(--steel);background:var(--steel-soft)}
.rollbtn svg{width:17px;height:17px}

/* ---------- cards */
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 2px}
.item .main{flex:1;min-width:0}
.item .main b{font-weight:700}
.item .main .sub{font-size:13px;color:var(--ink-2)}
.item .main p{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.wcard .hd{display:flex;align-items:flex-start;gap:10px}
.wcard .hd .t{flex:1;min-width:0}
.wcard .hd .t b{font-size:16px}
.aspects{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.aspects div{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:center}
.aspects div small{display:block;font-family:var(--f-display);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3)}
.aspects div b{font-size:17px;font-variant-numeric:tabular-nums lining-nums}
.aspects div.hi{border-color:color-mix(in srgb,var(--steel) 55%,var(--line))}
.aspects div.zero b{color:var(--ink-3)}
.armor-tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums lining-nums}
.armor-tbl th,.armor-tbl td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
.armor-tbl th{font-family:var(--f-display);font-size:11.5px;letter-spacing:.1em;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.armor-tbl td:first-child,.armor-tbl th:first-child{text-align:left}
.armor-tbl td.pc{font-size:12.5px;color:var(--ink-2);text-align:left}

/* ---------- AP track */
.ap-big{display:flex;align-items:center;gap:14px}
.ap-num{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums lining-nums;color:var(--steel);min-width:72px;text-align:center}
.ap-quick{display:flex;flex-wrap:wrap;gap:6px}
.track{display:flex;flex-direction:column;gap:6px}
.trk{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-sm);background:var(--panel-2);border:1px solid var(--line)}
.trk.me{border-color:color-mix(in srgb,var(--steel) 50%,var(--line))}
.trk.next{box-shadow:inset 3px 0 0 var(--brass)}
.trk .ord{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg-2);font-size:12px;font-weight:800;color:var(--ink-2)}

/* ---------- health */
.hp-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.meter{display:flex;gap:4px;flex-wrap:wrap}
.meter i{width:22px;height:22px;border-radius:4px;border:1.5px solid var(--line-2);background:var(--bg-2)}
.meter i.on{background:var(--blood);border-color:var(--blood)}
.meter i.over{background:repeating-linear-gradient(45deg,var(--blood) 0 3px,transparent 3px 6px);border-color:var(--blood)}
.thr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-variant-numeric:tabular-nums lining-nums}
.thr div{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center}
.thr small{display:block;font-family:var(--f-display);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3)}
.thr b{font-size:18px}
.wound{border:1px solid var(--line);border-left:4px solid var(--blood);border-radius:var(--r-sm);padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.wound.mental{border-left-color:var(--sc-divination)}
.wound.healed{border-left-color:var(--moss);opacity:.75}
.wound.perm{border-left-color:var(--ink-3)}
.treat{display:flex;gap:5px}
.treat i{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--line-2)}
.treat i.on{background:var(--ink-2);border-color:var(--ink-2)}

/* ---------- dice */
.dice{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.die{position:relative;width:38px;height:42px;display:grid;place-items:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums lining-nums;color:var(--ink-2)}
.die::before{content:"";position:absolute;inset:0;background:var(--panel-2);border:1.5px solid var(--line-2);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);z-index:0}
.die::after{content:"";position:absolute;inset:1.5px;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);background:var(--panel-2);z-index:0}
.die span{position:relative;z-index:1;margin-top:6px}
.die.kept{color:var(--steel-ink)}
.die.kept::before{background:var(--steel)}
.die.kept::after{background:var(--steel)}
.die.boom::before{background:var(--brass)}
.die.boom.kept::after{background:var(--brass)}
.die.pen{color:#fff}
.die.pen::before,.die.pen::after{background:var(--blood)}
.die.drop{opacity:.45}
.chain{display:inline-flex;align-items:flex-end;gap:2px;padding:2px;border-radius:8px;background:var(--brass-soft)}
.chain .die{width:32px;height:36px;font-size:14px}
.roll-total{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.roll-total .big{font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums lining-nums}
.verdict{font-family:var(--f-display);font-size:20px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.verdict.ok{color:var(--moss)} .verdict.no{color:var(--blood)}
@keyframes tumble{0%{transform:rotate(-30deg) scale(.6);opacity:0}70%{transform:rotate(8deg) scale(1.06);opacity:1}100%{transform:none}}
.dice.anim .die{animation:tumble .35s ease-out both}
@media (prefers-reduced-motion:reduce){.dice.anim .die{animation:none}}

/* ---------- modal sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:.4}}
.sheet{width:100%;max-width:640px;max-height:min(92%,940px);background:var(--panel);border:1px solid var(--line-2);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:rise .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.wide{max-width:880px}
@media (min-width:700px){.scrim{align-items:center;padding:24px}.sheet{border-radius:14px;border-bottom:1px solid var(--line-2);padding-bottom:0}}
.sheet>header{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line)}
.sheet>header h2{flex:1;font-size:19px;min-width:0}
.sheet>header .sub{display:block;font-family:var(--f-body);font-size:13px;color:var(--ink-2);font-weight:400;letter-spacing:0}
.sheet .body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet>footer{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.opt-row>span{min-width:0}
.opt-row>span small{display:block;color:var(--ink-3);font-size:12.5px}
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:rise .2s ease-out;max-width:100%}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px));z-index:30;width:56px;height:56px;border-radius:16px;border:0;background:var(--steel);color:var(--steel-ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:28px;height:28px}
@media (min-width:960px){.fab{bottom:24px}.toast-wrap{bottom:24px}}

/* ---------- home */
.hero{display:flex;gap:18px;align-items:center;padding:18px 0 8px}
.hero h1{font-family:var(--f-name);font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:.01em}
.hero p{color:var(--ink-2);max-width:60ch;margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.ccard h3{font-family:var(--f-name);font-size:21px;font-weight:700;letter-spacing:0}
.ccard .meta{color:var(--ink-2);font-size:13.5px}
.minis{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.minis div{background:var(--bg-2);border-radius:5px;padding:3px 0;text-align:center;font-variant-numeric:tabular-nums lining-nums}
.minis small{display:block;font-size:9.5px;font-family:var(--f-display);letter-spacing:.08em;color:var(--ink-3)}
.minis b{font-size:14px}
.newcard{border:1.5px dashed var(--line-2);background:none;justify-content:center;align-items:flex-start;min-height:150px}
.newcard:hover{border-color:var(--steel)}

/* ---------- wizard */
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:0;background:none;padding:6px 9px;border-radius:6px;font-family:var(--f-display);font-size:13px;letter-spacing:.08em;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.steps button i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);font-size:11px;font-weight:800}
.steps button.done{color:var(--ink-2)} .steps button.done i{background:var(--moss-soft);border-color:var(--moss);color:var(--moss)}
.steps button.cur{color:var(--ink);background:var(--panel-2)} .steps button.cur i{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.wiz{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1080px){.wiz{grid-template-columns:minmax(0,1fr) 320px}.wiz aside{position:sticky;top:76px;align-self:start}}
.wiz-nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.pools{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.pool{border:1.5px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:8px 10px;text-align:left;display:flex;flex-direction:column}
.pool small{font-family:var(--f-display);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.pool b{font-size:24px;font-variant-numeric:tabular-nums lining-nums;line-height:1.15}
.pool span{font-size:12px;color:var(--ink-3)}
.pool.on{border-color:var(--steel);background:var(--steel-soft)}
.pool.zero b{color:var(--ink-3)}
.pool.neg b{color:var(--blood)}
.gen-attr{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;padding:7px 10px}
.gen-attr+.gen-attr{border-top:1px solid var(--line)}
.gen-attr .rolled{font-size:12px;color:var(--ink-3)}
.gen-attr.sel{background:var(--steel-soft)}
.bigdie{width:44px;height:48px}
.picker-list{display:flex;flex-direction:column;max-height:none}
.pick{display:flex;gap:10px;align-items:flex-start;padding:10px 4px}
.pick+.pick{border-top:1px solid var(--line)}
.pick .main{flex:1;min-width:0}
.pick .main p{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.pick.blocked .main b{color:var(--ink-3)}
.cost{font-weight:800;color:var(--brass);font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.school-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;margin-top:6px}
.mtable{width:100%;border-collapse:collapse;font-size:13.5px}
.mtable td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.mtable td:first-child{color:var(--ink-3);font-family:var(--f-display);letter-spacing:.08em;font-size:12px;width:76px;text-transform:uppercase}
.search{position:relative}
.search input{padding-left:36px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--bg-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
textarea.json{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:180px}
.log-item{padding:9px 0;display:flex;gap:10px;align-items:baseline}
.log-item b{font-variant-numeric:tabular-nums lining-nums;min-width:38px;text-align:right;font-size:18px}
.log-item .d{flex:1;min-width:0;font-size:13.5px;color:var(--ink-2)}
.log-item .d strong{color:var(--ink);font-weight:600}

function ancTraits(anc){const rows=DB.anc[anc]||[];return rows.filter(r=>r[1]!=='Nothing').map(r=>r[1]);}
function parseTraitName(s){ // "Driven: Mental" -> {n:'Driven',spec:'Mental'}; "Innate Power (Any Nature Manifestation)" -> spec
  let m=s.match(/^([^:(]+?)\s*:\s*(.+)$/); if(m) return {n:m[1].trim(),spec:m[2].trim()};
  m=s.match(/^([^(]+?)\s*\((.+)\)$/); if(m) return {n:m[1].trim(),spec:m[2].trim()};
  return {n:s.trim(),spec:''};
}

/* ---------- storage */
const LS_KEY='hh-companion-v1';
let STORE={chars:[],active:null,theme:'system'};
function loadStore(){try{const s=localStorage.getItem(LS_KEY);if(s){const o=JSON.parse(s);if(o&&Array.isArray(o.chars))STORE=Object.assign(STORE,o);}}catch(e){}
  STORE.chars=STORE.chars.map(migrate);}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250);}
function saveNow(){try{localStorage.setItem(LS_KEY,JSON.stringify(STORE));}catch(e){}cloudSchedule();}
function deleteChars(ids){ids.forEach(id=>{STORE.chars=STORE.chars.filter(c=>c.id!==id);(STORE.tomb=STORE.tomb||[]).push(id);});save();}
/* ---------- optional account sync (only inside the claude.ai artifact viewer; standalone builds stay local) */
const CLOUD={db:null,uid:null,on:false,hashes:{},queue:Promise.resolve(),status:'local',t:null};
async function cloudInit(){
  try{
    const cl=window.claude;if(!cl||typeof cl.use!=='function')return;
    const [db,user]=await Promise.all([cl.use('db'),cl.use('user')]);if(!db||!user)return;
    const id=await user.id();if(!id)return;
    CLOUD.db=db;CLOUD.uid=id;CLOUD.status='syncing';
    const snap=await db.collection('data/users/'+id).get();
    const remote=snap.docs.filter(d=>d.exists&&d.data()&&d.data().c).map(d=>JSON.parse(JSON.stringify(d.data().c)));
    const tomb=new Set(STORE.tomb||[]);
    let local=STORE.chars;if(remote.length)local=local.filter(c=>!(c.sample&&c.updated===c.created));
    const byId=new Map(local.map(c=>[c.id,c]));
    remote.forEach(r=>{if(tomb.has(r.id))return;const l=byId.get(r.id);if(!l||(r.updated||0)>(l.updated||0))byId.set(r.id,migrate(r));});
    STORE.chars=[...byId.values()];
    remote.forEach(r=>{const m=byId.get(r.id);if(m&&m.updated===r.updated)CLOUD.hashes[r.id]=JSON.stringify(m);});
    CLOUD.on=true;CLOUD.status='synced';
    try{localStorage.setItem(LS_KEY,JSON.stringify(STORE));}catch(e){}
    cloudPush();
    if(!MODAL&&window.refreshView&&(typeof UI==='undefined'||UI.view!=='gen'))window.refreshView(true);
  }catch(e){CLOUD.status=CLOUD.on?'error':'local';}
}
function cloudSchedule(){if(!CLOUD.on)return;clearTimeout(CLOUD.t);CLOUD.t=setTimeout(cloudPush,1500);}
function cloudEnqueue(fn){CLOUD.queue=CLOUD.queue.then(fn).then(()=>{if(CLOUD.status!=='error')CLOUD.status='synced';}).catch(e=>{CLOUD.status='error';CLOUD.err=(e&&e.code)||'error';});}
function cloudPush(){if(!CLOUD.on)return;const base='data/users/'+CLOUD.uid+'/';
  STORE.chars.forEach(c=>{if(c.log&&c.log.length>60)c.log.length=60;let h=JSON.stringify(c);if(h.length>240000){c.log=[];h=JSON.stringify(c);}
    if(CLOUD.hashes[c.id]!==h){CLOUD.hashes[c.id]=h;const body={c:JSON.parse(h),updated:c.updated||Date.now()};CLOUD.status='syncing';cloudEnqueue(()=>CLOUD.db.doc(base+c.id).set(body));}});
  const t=STORE.tomb||[];if(t.length){STORE.tomb=[];t.forEach(id=>{delete CLOUD.hashes[id];cloudEnqueue(()=>CLOUD.db.doc(base+id).delete());});try{localStorage.setItem(LS_KEY,JSON.stringify(STORE));}catch(e){}}
}
function getChar(id){return STORE.chars.find(c=>c.id===id);}

/* ---------- character model */
function blankChar(){
  const attrs={};ALL_ATTRS.forEach(a=>attrs[a]={max:a==='FATE'?0:1,temp:0,adv:false});
  return {id:uid(),v:1,created:Date.now(),updated:Date.now(),
    bio:{name:'',player:'',ancestry:'Human',career:'',age:'',gender:'',looks:'',background:'',notes:''},
    pl:1,useFate:true,method:'pick',era:'Medieval',
    attrs,skills:{},custom:[],gov:{},
    abil:[],traits:[],flaws:[],magic:[],
    weapons:[],armor:{Head:null,Torso:null,Arms:null,Legs:null},gear:[],items:[],cp:0,
    wounds:[],cbt:{ap:0,init:null,wh:0,inj:0,track:[]},
    fp:0,xp:{total:0,spent:0,log:[]},mods:{},opt:{deadlyHead:false,lessWE:false,death:'std',falterHard:false,enc:false,moreSpells:false},
    log:[]};
}
function migrate(c){const b=blankChar();
  for(const k of Object.keys(b)) if(c[k]===undefined) c[k]=deep(b[k]);
  ALL_ATTRS.forEach(a=>{if(!c.attrs[a])c.attrs[a]={max:a==='FATE'?0:1,temp:0,adv:false};});
  for(const k of Object.keys(b.cbt)) if(c.cbt[k]===undefined)c.cbt[k]=deep(b.cbt[k]);
  for(const k of Object.keys(b.opt)) if(c.opt[k]===undefined)c.opt[k]=b.opt[k];
  for(const k of Object.keys(b.bio)) if(c.bio[k]===undefined)c.bio[k]='';
  return c;}

/* ---------- lookups on a character */
function hasAbil(c,n,spec){return c.abil.some(a=>a.n===n&&(spec==null||(a.spec||'').toLowerCase()===String(spec).toLowerCase()));}
function abilSpecs(c,n){return c.abil.filter(a=>a.n===n).map(a=>a.spec||'');}
function traitLv(c,n,spec){return sum(c.traits.filter(t=>t.n===n&&(spec==null||(t.spec||'').toLowerCase().includes(String(spec).toLowerCase()))).map(t=>t.lv||0));}
function traitList(c,n){return c.traits.filter(t=>t.n===n);}
function hasFlaw(c,n){return c.flaws.some(f=>f.n===n);}
function flawSpecs(c,n){return c.flaws.filter(f=>f.n===n).map(f=>f.spec||'');}
function skillList(c){return [...DB.skills.map(s=>({n:s.n,a:s.a,base:true})),...c.custom.map(s=>({n:s.n,a:s.a,custom:true}))];}
function govAttr(c,skill){
  if(c.gov&&c.gov[skill])return c.gov[skill];
  if(skill==='Hand to Hand'&&hasAbil(c,'Be Water'))return 'AGI';
  if(skill==='Sciences'&&hasAbil(c,'Book Smart'))return 'KNO';
  if(abilSpecs(c,'Brawn Before Skill').some(s=>s&&skill.toLowerCase().startsWith(s.toLowerCase().replace('small blades','short blades'))))return 'STR';
  const s=DB.skill[skill];if(s)return s.a;const cs=c.custom.find(x=>x.n===skill);return cs?cs.a:'STR';
}
function rank(c,skill){return c.skills[skill]||0;}

/* ---------- wound effects on attributes */
function woundReduction(c){
  const red={},minor={};ALL_ATTRS.forEach(a=>{red[a]=0;minor[a]=0;});
  c.wounds.forEach(w=>{
    if(!w.eff||!w.eff.rank||w.perm)return;
    const healed=w.heal||{};
    w.eff.attrs.forEach(a=>{
      if(w.eff.rank==='Critical'||w.eff.rank==='Serious'){const amt=(w.eff.rank==='Critical'?2:1)-(healed[a]||0);if(amt>0)red[a]+=amt;}
      else if(w.eff.rank==='Minor'){if(!healed[a])minor[a]-=3;}
    });
  });
  return {red,minor};
}

/* ---------- derived statistics */
function calc(c){
  const pl=c.pl, W=woundReduction(c);
  const A={};
  ALL_ATTRS.forEach(a=>{const at=c.attrs[a];const max=at.max;const cur=Math.max(0,max+(at.temp||0)-W.red[a]);A[a]={max,cur,low:cur<max,minor:W.minor[a]};});
  const R=(s,mode)=>{const r=rank(c,s);if(mode==='max')return r;const g=govAttr(c,s);return Math.min(r,A[g]?A[g].cur:r);};
  const lv=(n)=>c.abil.filter(a=>a.n===n).length;
  const both=(fn)=>({max:fn('max'),cur:fn('cur')});
  const at=(a,mode)=>mode==='max'?A[a].max:A[a].cur;
  const m=c.mods||{};
  const out={A,pl};
  out.size=1+traitLv(c,'Big')+(m.size||0);
  out.speed=1+traitLv(c,'Fast')+(m.speed||0); if(hasFlaw(c,'Obese'))out.speed=Math.min(out.speed,1);
  out.wth=2+lv('Stout')+(m.wth||0);
  out.bd=both(md=>(at('AGI',md)+at('SEN',md)+R('Dodge',md))*2+(lv('Hard to Hit I')+lv('Hard to Hit II'))*(1+pl)+(traitLv(c,'Incorporeal')>=1&&traitLv(c,'Incorporeal')<3?5*pl:0)+(m.bd||0));
  out.md=both(md=>(at('WILL',md)+at('FATE',md)+R('Focus',md))*2+(lv('Magical Null I')+lv('Magical Null II'))*(1+pl)+(m.md||0));
  out.med=both(md=>(at('EMP',md)+at('WILL',md)+R('Courage',md))*2+(lv('Mental Conditioning I')+lv('Mental Conditioning II'))*(1+pl)+(m.med||0));
  out.wl=both(md=>4+at('STR',md)+at('END',md)+at('WILL',md)+R('Resilience',md)+pl+(lv('Grit I')+lv('Grit II'))*(1+pl)+(m.wl||0));
  out.il={max:Math.floor(out.wl.max/2),cur:Math.floor(out.wl.cur/2)};
  out.mth={max:out.wl.max*2,cur:out.wl.cur*2};
  out.tl=both(md=>4+at('WILL',md)+at('EMP',md)+at('PRE',md)+R('Courage',md)+pl+(lv('Unbreakable I')+lv('Unbreakable II'))*(1+pl)+(m.tl||0));
  out.fl={max:Math.floor(out.tl.max/2),cur:Math.floor(out.tl.cur/2)};
  out.ith={max:out.tl.max*2,cur:out.tl.cur*2};
  out.cat={};POOLS.forEach(p=>out.cat[p]=sum(CATS[p].map(a=>A[a].max)));
  // armor
  const imp=traitLv(c,'Impervious')*4*pl;
  const nat={S:0,P:0,B:0};traitList(c,'Natural Armor').forEach(t=>{const s=(t.spec||'').toLowerCase();const k=s.startsWith('s')?'S':s.startsWith('p')?'P':s.startsWith('b')?'B':null;if(k)nat[k]+=8*pl*(t.lv||1);});
  out.ar={};LOCS.forEach(L=>{const p=c.armor[L];const base=k=>p?(p[k]||0)+pl:0;out.ar[L]={S:base('s')+imp+nat.S,P:base('p')+imp+nat.P,B:base('b')+imp+nat.B,O:base('o')+imp,piece:p};});
  out.mar=traitLv(c,'Brave')*2*pl;
  // shield
  let sh=0,shn='';c.weapons.forEach(w=>{if(w.equipped===false)return;const mm=(w.q||'').match(/Shield (\d+)/);if(mm&&+mm[1]*pl>sh){sh=+mm[1]*pl;shn=w.n;}});
  out.shield=sh;out.shieldName=shn;
  // fate & magic
  out.fate=A.FATE.max; out.focus=rank(c,'Focus');
  const subst=hasAbil(c,'Arcane Substitution')?Math.max(out.focus,rank(c,'Arcana')):out.focus;
  out.focusMag=subst;
  out.spellCap=subst*(c.opt.moreSpells?3:2);
  out.spells=c.magic.filter(x=>x.kind==='spell'&&x.src!=='trait').length;
  out.powers=c.magic.filter(x=>x.kind==='power'&&x.src!=='trait').length;
  // encumbrance
  const enc=x=>parseInt(x)||0;
  out.encLoad=sum(c.weapons.map(w=>enc(w.enc)))+sum(LOCS.map(L=>c.armor[L]?enc(c.armor[L].enc):0))+sum(c.items.map(i=>enc(i.enc)*(i.qty||1)));
  out.encMax=(A.END.cur+R('Stamina','cur'))*10;
  // combat
  out.whCap=out.wth;
  out.wh=Math.min(c.cbt.wh,out.wth);
  out.inj=c.cbt.inj;
  out.R=R;
  return out;
}

/* ---------- XP costs */
function xpSkillCost(c,skill,newRank){
  const cat=CAT_OF[govAttr(c,skill)]||'Physical';
  const mf=traitList(c,'Mental Flexibility').filter(t=>(t.spec||'').toLowerCase()===cat.toLowerCase()).reduce((m,t)=>Math.max(m,t.lv||1),0);
  let mult=hasFlaw(c,'Amnesia')?5:(mf>=2?3:4);
  let cost=newRank*mult;
  if(newRank===c.attrs[govAttr(c,skill)].max&&newRank!==1&&mf<1)cost+=4;
  return cost;
}
function xpAbilCost(c,ab,cost){
  const cat=ab&&ab.cat;const mf=traitList(c,'Mental Flexibility').filter(t=>(t.spec||'').toLowerCase()===String(cat).toLowerCase()).reduce((m,t)=>Math.max(m,t.lv||1),0);
  const mult=hasFlaw(c,'Amnesia')?6:(mf>=3?4:5);return cost*mult;
}
function abilCostNum(ab,spec){const c=String(ab.c);if(/^\d+$/.test(c))return +c;const m=c.match(/^(\d+)/);return m?+m[1]:4;}

/* ---------- prerequisite check */
function prereqCheck(c,ab){
  const p=(ab.pre||'None').trim();
  if(/^none/i.test(p))return {ok:true};
  if(/GM/i.test(p))return {ok:true,gm:true,msg:'Needs GM permission'};
  if(/Fate is used/i.test(p))return c.useFate?{ok:true}:{ok:false,msg:'Fate is not used in this game'};
  let m=p.match(/Fate Score (\d+)\+/i);if(m)return c.attrs.FATE.max>=+m[1]?{ok:true}:{ok:false,msg:'Needs Fate '+m[1]+'+'};
  if(/^Magic User or Arcana/i.test(p))return (hasAbil(c,'Magic User')||rank(c,'Arcana')>=1)?{ok:true}:{ok:false,msg:'Needs Magic User or Arcana 1+'};
  if(/^Magic User/i.test(p))return hasAbil(c,'Magic User')?{ok:true}:{ok:false,msg:'Needs Magic User'};
  if(/^Super Powers/i.test(p))return hasAbil(c,'Super Powers')?{ok:true}:{ok:false,msg:'Needs Super Powers'};
  m=p.match(/^([A-Za-z ]+?)\s+(?:Rank\s+)?(\d+)\+/);
  if(m){let sk=m[1].trim();if(sk==='Reactions')sk='Reaction';if(sk==='Science')sk='Sciences';return rank(c,sk)>=+m[2]?{ok:true}:{ok:false,msg:'Needs '+sk+' '+m[2]+'+'};}
  m=p.match(/^(.+?\b(?:I|II))(\s*\(.*\))?$/);
  if(m&&DB.ability[m[1].trim()])return hasAbil(c,m[1].trim())?{ok:true}:{ok:false,msg:'Needs '+m[1].trim()};
  return {ok:true,msg:p};
}

function stepper(id,val,min=-99,max=99,lg=false){return `<span class="stepper${lg?' lg':''}" data-stepper="${id}" data-min="${min}" data-max="${max}"><button type="button" data-d="-1" aria-label="Decrease"${val<=min?' disabled':''}>−</button><output>${val}</output><button type="button" data-d="1" aria-label="Increase"${val>=max?' disabled':''}>+</button></span>`;}

async function downloadText(name,txt){try{const cl=window.claude;if(cl&&typeof cl.use==='function'){const dl=await cl.use('downloads');if(dl){try{await dl.save({filename:name,data:txt});toast('Saved');}catch(e){if(e&&e.code!=='declined')toast('Download unavailable here. Use Copy instead.');}return;}}}catch(e){}try{const b=new Blob([txt],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},500);}catch(e){toast('Download blocked here. Use Copy instead.');}}

/* ===================== DICE: roll & keep engine, modifier gathering, roll dialog ===================== */
function poolFor(attrVal,rnk,ben,pull){
  const notes=[];const a=Math.max(1,attrVal);
  let kept=Math.max(1,a-(pull||0));
  let rolled=a+rnk+ben;let bonus=0;
  const maxR=2*kept;
  if(rolled>maxR){const ex=rolled-maxR;kept+=Math.floor(ex/2);if(ex%2){bonus+=3;}rolled=maxR;notes.push(`Pool capped at ${maxR} rolled dice: ${ex} extra → +${Math.floor(ex/2)} kept${ex%2?', +3':''}`);}
  if(kept>2*a){bonus+=3*(kept-2*a);notes.push(`Kept dice capped at ${2*a}: +${3*(kept-2*a)}`);kept=2*a;}
  if(kept>rolled)kept=rolled;
  return {rolled,kept,bonus,notes};
}
function rollDice({rolled,kept,explode=true,reroll1=false,explodeOnce=false}){
  const dice=[];
  for(let i=0;i<rolled;i++){let v=d10(),rr=null;if(reroll1&&v===1){rr=1;v=d10();}dice.push({v,rr,chain:[],kept:false});}
  const order=dice.map((d,i)=>i).sort((x,y)=>dice[y].v-dice[x].v);
  order.slice(0,kept).forEach(i=>dice[i].kept=true);
  let explosions=0;
  dice.forEach(d=>{if(d.kept&&explode&&d.v===10){explosions++;let x;do{x=d10();d.chain.push(x);if(x===10&&!explodeOnce)explosions++;}while(x===10&&!explodeOnce);}});
  const total=sum(dice.filter(d=>d.kept).map(d=>d.v+sum(d.chain)));
  return {dice,total,explosions};
}
function rollPenalty(n){const dice=[];let explosions=0;for(let i=0;i<n;i++){const d={v:d10(),chain:[],kept:true};if(d.v===10){explosions++;let x;do{x=d10();d.chain.push(x);if(x===10)explosions++;}while(x===10);}dice.push(d);}return {dice,total:sum(dice.map(d=>d.v+sum(d.chain))),explosions};}
function rollPlain(n){const a=[];for(let i=0;i<n;i++)a.push(d10());return a;}
function diceHTML(dice,cls=''){return `<div class="dice anim ${cls}">`+dice.map(d=>{
  const k=d.kept?'kept':'drop';const boom=d.chain&&d.chain.length;
  const main=`<div class="die ${k}${boom?' boom':''}${cls.includes('pen')?' pen':''}" title="${d.rr?'Rerolled a 1':''}"><span>${d.v}</span></div>`;
  if(!boom)return main;return `<span class="chain">${main}${d.chain.map(x=>`<div class="die ${cls.includes('pen')?'pen':'kept'}${x===10?' boom':''}"><span>${x}</span></div>`).join('')}</span>`;}).join('')+'</div>';}

/* ---------- modifiers that apply to a skill check */
function gatherMods(c,skill,ctx={}){
  const pl=c.pl,K=calc(c),g=govAttr(c,skill),out=[],flags={trained:rank(c,skill)>0,reroll1:false,explodeOnce:false,notes:[]};
  const S=(lvl)=>bonusSet(lvl,pl);
  const add=(src,label,{ben=0,har=0,mod=0,on=true,lock=false}={})=>out.push({id:'m'+out.length,src,label,ben,har,mod,on,lock});
  const addBS=(src,label,lvl,on=true)=>{const b=S(lvl);add(src,`${label} · Level-${lvl} set (${bsLabel(lvl,pl)})`,{ben:b.ben,mod:b.mod,on});};
  const R=s=>rank(c,s);const At=a=>K.A[a].cur;
  const eq=(a,b)=>String(a||'').toLowerCase().replace('small blades','short blades').trim()===String(b||'').toLowerCase().trim();
  const inSpec=(spec,s)=>String(spec||'').toLowerCase().split(/[,;/]+/).map(x=>x.trim().replace('small blades','short blades')).includes(s.toLowerCase());
  c.abil.forEach(a=>{const n=a.n,sp=a.spec||'';
    if(n==='Skilled I'&&eq(sp,skill))addBS(n,n,0);
    if(n==='Skilled II'&&eq(sp,skill))addBS(n,n,1);
    if(n==='Alert'&&skill==='Perception')addBS(n,n,1);
    if((n==='Keen I'||n==='Keen II')&&skill==='Reaction')addBS(n,n+' (Initiative)',n==='Keen I'?1:2,!!ctx.init);
    if(n==='Animal Friend'&&skill==='Animal Handling')addBS(n,n,1);
    if(n==='Good Looks'&&skill==='Seduce')addBS(n,n,1);
    if(n==='Social Status I'&&skill==='Status')addBS(n,n,1);
    if(n==='Social Status II'&&skill==='Status')addBS(n,n,2);
    if(n==='Fast Talker'&&eq(sp,skill))addBS(n,n,1);
    if(n==='Surgeon'&&skill==='Healing')addBS(n,n+' (treating Physical Wounds)',1,!!ctx.healP);
    if(n==='Magical Studies II'&&skill==='Focus')addBS(n,n,1);
    if(n==='Long Memory'&&['Investigation','Lore','Career'].includes(skill))addBS(n,n+' (recalling distant memories)',2,false);
    if(n==='Grappler'&&(skill==='Hand to Hand'||ctx.grapple))addBS(n,n+' (grappling)',2,!!ctx.grapple);
    if(n==='Weapon Master I'&&ctx.weapon&&eq(sp,ctx.weapon.n)&&!hasAbil(c,'Weapon Master II',sp))addBS(n,n,2);
    if(n==='Weapon Master II'&&ctx.weapon&&eq(sp,ctx.weapon.n))addBS(n,n,3);
    if((n==='Weapon Master I'||n==='Weapon Master II')&&!ctx.weapon&&sp&&govAttr(c,skill)&&false){}
    const plus=(cond,label,val,on=true)=>{if(cond)add(n,`${n}: ${label} (${sgn(val)})`,{mod:val,on});};
    plus(n==='Quick Twitch'&&skill==='Reaction','AGI + PL',At('AGI')+pl);
    plus(n==='Reed in the Wind'&&skill==='Dodge','Reaction + PL',R('Reaction')+pl);
    plus(n==='Wary'&&skill==='Stealth','Perception + PL',R('Perception')+pl);
    plus(n==='Logical'&&skill==='Investigation','KNO + PL',At('KNO')+pl);
    plus(n==='Computer Expert'&&skill==='Hacking','Sysops + PL',R('Sysops')+pl);
    plus(n==='Ear to the Ground'&&skill==='Investigation','Streetwise + PL',R('Streetwise')+pl);
    plus(n==='Educated'&&skill==='Lore','Status + PL',R('Status')+pl);
    plus(n==='Nature Lover'&&skill==='Survival','Lore + PL',R('Lore')+pl);
    plus(n==='Scientific Method'&&skill==='Craft','Sciences + PL',R('Sciences')+pl);
    plus(n==='Cultural Norms'&&skill==='Etiquette','Lore + PL',R('Lore')+pl);
    plus(n==='Spy'&&skill==='Acting','Deception + PL',R('Deception')+pl);
    plus(n==='Strong Arm'&&skill==='Intimidation','STR + PL',At('STR')+pl);
    plus(n==='Takes One to Know One'&&skill==='Read Person','Deception + PL',R('Deception')+pl);
    plus(n==='Wise Words'&&skill==='Rhetoric','KNO + PL',At('KNO')+pl);
    plus(n==='Strength of Focus'&&skill==='Focus','Arcana + PL',R('Arcana')+pl);
    plus(n==='Easy to Heal'&&ctx.healSelf,'Recovery + PL',R('Recovery')+pl);
    plus(n==='Jack of All Trades'&&inSpec(sp,skill),'Career + PL',R('Career')+pl);
    if(n==='Famous'){if(['Persuasion','Seduce','Deception','Intimidation','Rhetoric'].includes(skill))add(n,`Famous: ${sp||'chosen Skill'} + PL`,{mod:(sp&&DB.skill[sp]?R(sp):0)+pl});if(skill==='Acting')add(n,'Famous: recognized',{har:1});}
    if(n==='Lucky'&&eq(sp,skill)){flags.reroll1=true;flags.notes.push('Lucky: 1s are rerolled');}
  });
  c.traits.forEach(t=>{const n=t.n,sp=t.spec||'',lv=t.lv||1;
    const attrMatch=ALL_ATTRS.find(a=>eq(sp,a)||eq(sp,ATTR_NAME[a]));
    if(n==='Genmod'&&attrMatch===g){flags.trained=true;if(lv>=2)addBS(n,'Genmod',1);if(lv>=3)flags.notes.push('Genmod 3: kept 1s also explode');}
    if(n==='Social Creature'&&attrMatch===g){flags.trained=true;addBS(n,'Social Creature',0);}
    if(n==='Nimble'&&eq(sp,skill)&&lv<3)addBS(n,'Nimble',lv===1?2:3);
    if(n==='Unnatural Beauty'&&eq(sp,skill))addBS(n,'Unnatural Beauty',Math.min(lv,3));
    if(n==='Stubborn'&&eq(sp,skill)&&lv<=2)add(n,`Stubborn: WILL × PL (${sgn(At('WILL')*pl)})`,{mod:At('WILL')*pl});
    if(n==='Unaging'&&inSpec(sp,skill))add(n,`Unaging: KNO × PL (${sgn(At('KNO')*pl)})`,{mod:At('KNO')*pl});
    if(n==='Multiple Arms'&&lv>=2&&eq(sp,skill))addBS(n,'Multiple Arms',2);
    if(n==='Zero-G'&&lv>=3&&eq(sp,skill))addBS(n,'Zero-G (in zero gravity)',3,false);
    if(n==='Machine Physiology'&&lv>=3&&(skill==='Sysops'||skill==='Hacking'))addBS(n,'Machine Physiology',1);
  });
  const H=(n,label,on=true,har=1)=>add(n,label+` (${har} Hardship${har>1?'s':''})`,{har,on});
  c.flaws.forEach(f=>{const n=f.n,sp=f.spec||'';
    const attrMatch=ALL_ATTRS.find(a=>eq(sp,a)||eq(sp,ATTR_NAME[a]));
    if(n==='Clumsy'&&g==='AGI')H(n,'Clumsy');
    if((n==='Diseased'||n==='Diseased, Mortal')&&attrMatch===g)H(n,n);
    if(n==='Loud'&&(skill==='Stealth'||skill==='Thievery'))H(n,'Loud');
    if(n==='Old'&&g==='END')H(n,'Old');
    if(n==='Young'&&g==='KNO')H(n,'Young');
    if(n==='Sickly'&&(skill==='Recovery'||skill==='Stamina'))H(n,'Sickly');
    if(n==='Delusion'&&(skill==='Read Person'||skill==='Etiquette'))H(n,'Delusion');
    if(n==='Dither'&&ctx.init)H(n,'Dither');
    if(n==='Easily Cowed'&&skill==='Intimidation')H(n,'Easily Cowed');
    if(n==='Angry'&&g==='COM')H(n,'Angry');
    if(n==='Shy'&&g==='COM')H(n,'Shy');
    if(n==='Disturbing Appearance'){if((g==='COM'||g==='PRE')&&skill!=='Intimidation')H(n,'Disturbing Appearance');if(skill==='Intimidation')addBS(n,'Disturbing Appearance',1);}
    if(n==='Emotionally Stunted'&&(skill==='Read Person'||skill==='Streetwise'))H(n,'Emotionally Stunted');
    if(n==='Outcast'&&(g==='INF'||g==='COM'))H(n,'Outcast (with higher-INF members of your society)',false);
    if(n==='Peacock'&&skill==='Stealth')H(n,'Peacock');
    if(n==='Cursed')H(n,'Cursed');
    if(n==='Low Pain Threshold'&&ctx.falter)H(n,'Low Pain Threshold');
    if(['Coward','Nervous','Addiction','Disorder','Code of Behavior','Destiny'].includes(n))H(n,n+' (when it applies)',false);
    if(n==='Lost Love'&&CAT_OF[g]==='Mental')H(n,'Lost Love (after a reminder)',false);
    if(n==='Knowledge at all Costs'&&CAT_OF[g]==='Mental')H(n,'Knowledge at all Costs (distracted)',false);
    if(n==='Permanent Wound I - Minor'&&attrMatch===g)add(n,'Permanent minor wound (-3)',{mod:-3});
    if(n==='Inept'&&eq(sp,skill))flags.notes.push('Inept: this check automatically fails.');
    if(n==='Coward'&&skill==='Courage')flags.notes.push('Coward: Courage checks automatically fail.');
    if(n==='Unlucky'){flags.explodeOnce=true;flags.notes.push('Unlucky: 10s explode only once');}
  });
  if(K.A[g]&&K.A[g].minor)add('wound',`Minor wound effect on ${g} (${K.A[g].minor})`,{mod:K.A[g].minor,lock:true});
  // armor qualities
  const worn=LOCS.map(L=>c.armor[L]).filter(Boolean);
  if(worn.some(p=>/Noisy/i.test(p.q||''))&&(skill==='Stealth'||skill==='Thievery'))H('armor','Noisy armor');
  if(worn.some(p=>/Bulky/i.test(p.q||''))&&skill==='Acrobatics')H('armor','Bulky armor');
  worn.forEach(p=>{const m=(p.q||'').match(/Unwieldy\s*(\d+)/i);if(m&&K.A.STR.cur<+m[1])H('armor',`${p.n}: Unwieldy ${m[1]}`);});
  if(skill==='Stealth'&&K.size>1)H('size',`Size ${K.size}`,true,K.size-1);
  // gear (situational: only the best one applies)
  c.gear.forEach(gr=>{if(eq(gr.skill,skill)){let lvl=+gr.lv||0;if(hasAbil(c,'Gadgeteer',skill))lvl=Math.min(4,lvl+1);addBS('gear',`${gr.n}${gr.desc?' ['+gr.desc+']':''}`,lvl,false);}});
  return {mods:out,flags};
}

/* ---------- the roll dialog */
let RS=null; // roll state
function openRoll(c,o){
  // o: {title, sub, skill, attr, rank, ctx, extra:{html(R), bind(root,R), calc(R)->{ben,har,mod,notes}, after(R,res)->html}, ap, tn, showHit, noWounds, attrOverride, label}
  const skill=o.skill||null;
  const attr=o.attr||(skill?govAttr(c,skill):'STR');
  const K=calc(c);
  const gm=skill?gatherMods(c,skill,o.ctx||{}):{mods:[],flags:{trained:true,notes:[]}};
  if(o.mods)gm.mods.push(...o.mods.map((m,i)=>Object.assign({id:'x'+i,on:true},m)));
  const rnk=o.rank!=null?o.rank:(skill?K.R(skill,'cur'):0);
  RS={c,o,skill,attr,rnk,mods:gm.mods,flags:gm.flags,ben:o.ben||0,har:o.har||0,mod:o.mod||0,pull:0,
    wounds:!o.noWounds,inj:!o.noWounds,fateBen:0,trainFP:false,burn:false,burnIgnore:false,
    tnMode:o.tn!=null?(typeof o.tn==='number'?'custom':'diff'):'none',tnIdx:typeof o.tn==='string'?DIFFS.indexOf(o.tn):1,tnVal:typeof o.tn==='number'?o.tn:'',
    apOn:o.ap!=null&&o.ap>0,ap:o.ap||0,result:null,x:{}};
  if(o.init)RS.x=o.init;
  openModal({title:o.title||skill||'Roll',sub:o.sub||'',wide:!!o.extra,body:'',foot:`<button class="btn" data-close>Close</button><button class="btn pri" id="rl-go">${IC.dice} Roll</button>`,
    onMount:m=>{$('#rl-go',m).onclick=()=>doRoll();renderRoll();}});
}
function rollTotals(){
  const R=RS,c=R.c,K=calc(c);
  let ben=R.ben+R.fateBen,har=R.har,mod=R.mod,notes=[];
  R.mods.forEach(m=>{if(m.on){ben+=m.ben;har+=m.har;mod+=m.mod;}});
  if(R.o.extra&&R.o.extra.calc){const e=R.o.extra.calc(R)||{};ben+=e.ben||0;har+=e.har||0;mod+=e.mod||0;if(e.notes)notes.push(...e.notes);}
  const ignoreAll=R.burnIgnore;
  const wh=(R.wounds&&!ignoreAll)?K.wh:0;const inj=(R.inj&&!ignoreAll)?K.inj:0;
  if(ignoreAll)har=0;
  har+=wh;mod+=inj*-3;
  if(R.burn)mod+=PLD[c.pl].burn;
  const attrVal=R.o.attrVal!=null?R.o.attrVal:K.A[R.attr].cur;
  const pool=poolFor(attrVal,R.rnk,Math.max(0,ben),Math.min(R.pull,K.A.WILL.cur));
  const trained=R.flags.trained||R.trainFP||R.o.forceTrained;
  const explode=R.o.noExplode?false:trained;
  return {ben,har,mod,wh,inj,pool,trained,explode,attrVal,notes};
}
function tnValue(){const R=RS;if(R.tnMode==='diff')return PLD[R.c.pl].tn[R.tnIdx];if(R.tnMode==='custom'&&R.tnVal!=='')return +R.tnVal;return null;}
function renderRoll(){

  </div>
  ${T.pool.notes.concat(R.flags.notes||[],T.notes).map(n=>`<div class="note">${esc(n)}</div>`).join('')}
  ${res?resultHTML(res):''}
  ${R.o.extra&&R.o.extra.html?R.o.extra.html(R):''}
  <div class="grid2">
    <div class="stack">
      <div class="sec">Adjust</div>
      <div class="opt-row"><span>Benefits<small>Extra rolled dice (Aim, Consider, GM)</small></span>${stepper('ben',R.ben,0,20)}</div>
      <div class="opt-row"><span>Hardships<small>Penalty dice added to the difficulty</small></span>${stepper('har',R.har,0,20)}</div>
      <div class="opt-row"><span>Pre-Roll modifier</span>${stepper('mod',R.mod,-60,60)}</div>

      ${!R.o.noWounds?`<label class="opt-row"><span class="check"><input type="checkbox" id="rl-wh" ${R.wounds?'checked':''}> Wound Hardships</span><span class="pill ${K.wh?'blood':''}">${K.wh}H</span></label>
      <label class="opt-row"><span class="check"><input type="checkbox" id="rl-inj" ${R.inj?'checked':''}> Injuries (-3 each)</span><span class="pill ${K.inj?'blood':''}">${K.inj?-3*K.inj:0}</span></label>`:''}
    </div>
    <div class="stack">
      <div class="sec">Applies to this check</div>
      ${R.mods.length?R.mods.map(modRow).join(''):'<div class="faint" style="font-size:13.5px">No abilities, traits, flaws or gear affect this check.</div>'}
      ${c.useFate?`<div class="sec">Fate <span class="pill brass">${c.fp} FP · score ${c.attrs.FATE.max}</span></div>
      <div class="opt-row"><span>Spend FP for Benefits</span>${stepper('fateBen',R.fateBen,0,fpMax)}</div>

      <label class="opt-row"><span class="check"><input type="checkbox" id="rl-burnI" ${R.burnIgnore?'checked':''} ${c.attrs.FATE.max<1?'disabled':''}> Burn a Fate Point: ignore all Hardships & Injuries</span></label>`:''}
    </div>
  </div>
  <div class="stack">
    <div class="sec">Difficulty</div>
    <div class="row">
      <button class="chip" data-tnm="none" aria-pressed="${R.tnMode==='none'}">Opposed / none</button>
      ${DIFFS.map((d,i)=>`<button class="chip" data-tni="${i}" aria-pressed="${R.tnMode==='diff'&&R.tnIdx===i}">${d} ${PLD[c.pl].tn[i]}</button>`).join('')}
      <label class="row nw" style="gap:6px"><span class="lbl">TN</span><input type="number" id="rl-tn" class="inline-num" value="${esc(R.tnMode==='custom'?R.tnVal:'')}" placeholder="—"></label>
    </div>
    ${R.o.ap!=null?`<label class="check"><input type="checkbox" id="rl-ap" ${R.apOn?'checked':''}> Advance my AP by ${R.ap} on the Combat Track</label>`:''}
  </div>`;
  body.scrollTop=sc;
  bindSteppers(body,id=>R[id],(id,v)=>{R[id]=v;renderRoll();});
  $$('[data-mod]',body).forEach(cb=>cb.onchange=()=>{const m=R.mods.find(x=>x.id===cb.dataset.mod);m.on=cb.checked;renderRoll();});
  const on=(id,f)=>{const el=$('#'+id,body);if(el)el.onchange=()=>{f(el);renderRoll();};};
  on('rl-wh',el=>R.wounds=el.checked);on('rl-inj',el=>R.inj=el.checked);on('rl-train',el=>R.trainFP=el.checked);on('rl-burn',el=>R.burn=el.checked);on('rl-burnI',el=>R.burnIgnore=el.checked);on('rl-ap',el=>R.apOn=el.checked);
  $$('[data-tni]',body).forEach(b=>b.onclick=()=>{R.tnMode='diff';R.tnIdx=+b.dataset.tni;renderRoll();});
  $$('[data-tnm]',body).forEach(b=>b.onclick=()=>{R.tnMode='none';renderRoll();});
  const tn=$('#rl-tn',body);if(tn)tn.onchange=()=>{R.tnVal=tn.value;R.tnMode=tn.value===''?'none':'custom';renderRoll();};
  if(R.o.extra&&R.o.extra.bind)R.o.extra.bind(body,R);
}
function doRoll(){
  const R=RS,c=R.c,T=rollTotals();
  const r=rollDice({rolled:T.pool.rolled,kept:T.pool.kept,explode:T.explode,reroll1:R.flags.reroll1,explodeOnce:R.flags.explodeOnce});
  const pen=rollPenalty(T.har);
  const total=r.total+T.pool.bonus+T.mod;
  const net=total-pen.total;
  const tn=tnValue();
  const res={r,pen,total,net,tn,pool:T.pool,mod:T.mod,har:T.har,explode:T.explode,ok:tn==null?null:total>=tn+pen.total,los:tn==null?null:total-(tn+pen.total)};
  if(R.o.showHit){const d=Math.abs(net)%10;res.hit={d,loc:HIT_LOC(d),side:(d===0||(d>=3&&d<=7))?'':(d%2?'Left':'Right')};}
  // spend resources
  if(c.useFate){let spend=R.fateBen+(R.trainFP?1:0);if(spend){c.fp=Math.max(0,c.fp-spend);}
    let burns=(R.burn?1:0)+(R.burnIgnore?1:0);for(let i=0;i<burns;i++)burnFate(c);
    R.fateBen=0;R.trainFP=false;R.burn=false;R.burnIgnore=false;}
  if(R.apOn&&R.ap){c.cbt.ap+=R.ap;}
  res.extraHTML=R.o.extra&&R.o.extra.after?R.o.extra.after(R,res):'';
  R.result=res;
  logRoll(c,(R.o.title||R.skill||'Roll'),res);
  if(R.o.onResult)R.o.onResult(res,R);
  save();renderRoll();
  if(window.refreshView)refreshView(true);
  const b=modalBody();if(b)b.scrollTop=0;
}
function resultHTML(res){
  const verdict=res.ok==null?'':`<span class="verdict ${res.ok?'ok':'no'}">${res.ok?'Success':'Failure'}</span><span class="muted">${res.ok?res.los+' Levels of Success':(-res.los)+' Levels of Failure'} vs TN ${res.tn}${res.pen.total?` + ${res.pen.total} penalty`:''}</span>`;
  return `<div class="panel" style="border-color:color-mix(in srgb,var(--steel) 45%,var(--line))">
    <div class="roll-total"><span class="big">${res.total}</span>${res.pen.total||res.har?`<span class="muted">− ${res.pen.total} penalty = <b style="color:var(--ink)">${res.net}</b> net</span>`:''}${verdict}</div>
    <div style="margin-top:10px">${diceHTML(res.r.dice)}</div>
    ${res.pen.dice.length?`<div style="margin-top:8px"><div class="lbl">Penalty dice</div>${diceHTML(res.pen.dice,'pen')}</div>`:''}
    <div class="faint" style="font-size:12.5px;margin-top:8px">Kept ${res.r.total}${res.pool.bonus?` + ${res.pool.bonus} pool`:''}${res.mod?` ${sgn(res.mod)} modifier`:''}${res.r.explosions?` · ${res.r.explosions} explosion${res.r.explosions>1?'s':''}`:''}${!res.explode?' · untrained, no explosions':''}</div>
    ${res.hit?`<div class="row" style="margin-top:8px"><span class="pill steel">Hit: ${res.hit.side?res.hit.side+' ':''}${res.hit.loc}</span><span class="faint" style="font-size:12.5px">rightmost digit ${res.hit.d} of the net attack</span></div>`:''}
    ${res.extraHTML||''}
  </div>`;
}
function logRoll(c,label,res){c.log.unshift({t:Date.now(),label,total:res.total,net:res.net,ok:res.ok,los:res.los,tn:res.tn,pen:res.pen.total,ex:res.r.explosions});if(c.log.length>60)c.log.length=60;}
function burnFate(c){if(c.attrs.FATE.max<=0)return;c.attrs.FATE.max-=1;c.fp=Math.min(c.fp,c.attrs.FATE.max);if(rank(c,'Focus')>c.attrs.FATE.max){c.skills.Focus=c.attrs.FATE.max;toast('Focus reduced to match Fate');}toast('Fate Point burnt');}

    </div>

}

const UI={view:'home',tab:'stats',edit:false,charId:null,skillFilter:'trained',skillQ:'',gen:null,compQ:'',compCat:'All'};
const ACT={};
function C(){return getChar(UI.charId);}
function touch(c){c.updated=Date.now();save();}
function setPath(o,p,v){const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++){if(x[k[i]]==null)x[k[i]]={};x=x[k[i]];}x[k[k.length-1]]=v;}
function getPath(o,p){return p.split('.').reduce((x,k)=>x==null?x:x[k],o);}
function bindInputs(root,obj,onChange){
  $$('[data-bind]',root).forEach(el=>{
    const p=el.dataset.bind;const num=el.type==='number';
    const handler=()=>{let v=el.type==='checkbox'?el.checked:el.value;if(num)v=v===''?0:+v;setPath(obj,p,v);onChange&&onChange(p,el);};
    el.addEventListener(el.tagName==='SELECT'||el.type==='checkbox'||el.dataset.live==null?'change':'input',handler);
    if(el.dataset.live!=null)el.addEventListener('change',handler);
  });
}

function sheetTopbar(c){

/* ---------- SKILLS */
function tabSkills(c,K){
  const ed=UI.edit;const q=UI.skillQ.toLowerCase();
  const list=skillList(c);
  const groups={};
  list.forEach(s=>{const g=govAttr(c,s.n);if(!groups[g])groups[g]=[];groups[g].push(s);});
  const show=s=>{if(q&&!s.n.toLowerCase().includes(q))return false;if(UI.skillFilter==='trained'&&!ed&&!q)return rank(c,s.n)>0;return true;};
  const row=s=>{const r=rank(c,s.n);const g=govAttr(c,s.n);const A=K.A[g];const eff=Math.min(r,A.cur);const pool=poolFor(A.cur,eff,0,0);
    const cap=A.max;const dots=[];for(let i=1;i<=Math.max(cap,r);i++)dots.push(`<i class="${i<=eff?'on':''}${i>A.cur?' cap':''}"></i>`);
    const changed=DB.skill[s.n]&&DB.skill[s.n].a!==g;
    return `<div class="skill-row${r?'':' untrained'}">
      <button class="sn" data-act="skillInfo" data-s="${esc(s.n)}" style="border:0;background:none;text-align:left;padding:0"><b>${esc(s.n)}</b>${changed||s.custom?`<small>${changed?'Uses '+g:''}${s.custom?' Custom skill':''}</small>`:''}</button>
      ${ed?stepper('rank:'+s.n,r,0,Math.max(10,cap)):`<span class="rank-dots" aria-label="Rank ${r}">${dots.join('')}</span>`}
      <span class="rk">${ed?'':`r${pool.rolled}/k${pool.kept}`}</span>
      <button class="rollbtn" data-act="rollSkill" data-s="${esc(s.n)}" aria-label="Roll ${esc(s.n)}">${IC.dice}<span class="num">${r}</span></button>
    </div>`;};
  let html=`<div class="row" style="margin-bottom:12px">
    <div class="search" style="flex:1;min-width:180px">${IC.search}<input type="search" id="sk-q" placeholder="Search skills" value="${esc(UI.skillQ)}"></div>
    ${ed?'':`<div class="seg" role="group"><button data-act="skFilter" data-f="trained" aria-pressed="${UI.skillFilter==='trained'}">Trained</button><button data-act="skFilter" data-f="all" aria-pressed="${UI.skillFilter==='all'}">All</button></div>`}
  </div>`;
  let any=false;
  POOLS.forEach(cat=>{CATS[cat].forEach(a=>{const g=(groups[a]||[]).filter(show);if(!g.length)return;any=true;
    html+=`<div class="skill-group"><div class="sec"><b>${a}</b> ${ATTR_NAME[a]} <span class="faint num" style="letter-spacing:0">${K.A[a].cur}</span></div><div class="list">${g.map(row).join('')}</div></div>`;});});
  if(!any)html+=`<div class="empty">${UI.skillFilter==='trained'?'No trained skills yet. Switch to <b>All</b> to roll untrained checks, or use Edit mode to add ranks.':'No skills match.'}</div>`;
  if(ed)html+=`<div class="panel"><div class="sec">Custom skill</div><div class="faint" style="font-size:13px;margin-bottom:8px">GMs can split a broad skill (for example Drive into Groundcraft and Spacecraft).</div><div class="row"><input type="text" id="cs-n" placeholder="Skill name" style="flex:2;min-width:160px"><select id="cs-a" style="flex:1;min-width:110px">${ALL_ATTRS.map(a=>`<option>${a}</option>`).join('')}</select><button class="btn" data-act="addCustomSkill">${IC.plus} Add</button></div>
  ${c.custom.length?`<div class="list" style="margin-top:8px">${c.custom.map((s,i)=>`<div class="item"><div class="main"><b>${esc(s.n)}</b> <span class="faint">${s.a}</span></div><button class="icon-btn" data-act="delCustomSkill" data-i="${i}" aria-label="Remove">${IC.trash}</button></div>`).join('')}</div>`:''}</div>`;
  return html;
}
