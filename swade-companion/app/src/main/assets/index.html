CH.hbReq = (el, d) => { const r = T.hb._req; if (d.f === 'attr') { const v = +el.value; if (v) r.attrs[d.k] = v; else delete r.attrs[d.k]; } else if (d.f === 'skillId') r.skills[+d.i][0] = el.value; else if (d.f === 'skillDie') r.skills[+d.i][1] = +el.value; else if (d.f === 'edge') r.edges[+d.i] = el.value; else if (d.f === 'wc') r.wc = el.checked; else if (d.f === 'arcane') r.arcane = +el.value; else r[d.f] = el.value; render(); };
A.hbReqAdd = d => { const r = T.hb._req; if (d.w === 'skill') r.skills.push(['', 2]); else r.edges.push(''); render(); };
A.hbReqDel = d => { const r = T.hb._req; if (d.w === 'skill') r.skills.splice(+d.i, 1); else r.edges.splice(+d.i, 1); render(); };
A.hbModAdd = () => { T.hb.mods = T.hb.mods || []; T.hb.mods.push({ id: 'm' + uid().slice(0, 4), name: '', cost: 1, text: '' }); render(); };
A.hbModDel = d => { T.hb.mods.splice(+d.i, 1); render(); };
CH.hbMod = (el, d) => { const m = T.hb.mods[+d.i]; m[d.f] = d.f === 'cost' ? (+el.value || 0) : d.f === 'per' ? el.checked : el.value; if (d.f === 'dmg' && !el.value) delete m.dmg; };
function hbForm(s, C) {
  const h = T.hb; const k = h._kind;
  const f = (key, label, type, ph) => `<label class="fld"><span>${label}</span><input class="inp" id="hb-${key}" ${type ? `type="${type}"` : ''} value="${esc(h[key] == null ? '' : h[key])}" placeholder="${esc(ph || '')}" data-c="hb" data-f="${key}"></label>`;
  const dieSel = (val, attrs, none) => `<select class="inp" ${attrs}>${none ? '<option value="0">—</option>' : ''}${[1, 2, 3, 4, 5].map(st => `<option value="${st}" ${+val === st ? 'selected' : ''}>${ENG.dieLabel(st)}</option>`).join('')}</select>`;
  let body = '';
  if (k === 'edges') {
    const r = h._req;
    const cats = [...new Set([...SW.EDGE_CATS, ...ENG.list(C.edges).map(e => e.cat)])];
    body = `<div class="grid g2" style="gap:10px">${f('name', 'Name')}<label class="fld"><span>Category</span><input class="inp" list="hbcats" value="${esc(h.cat)}" data-c="hb" data-f="cat"><datalist id="hbcats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></label></div>
      <label class="fld"><span>Summary</span><textarea class="inp" style="min-height:70px" data-c="hb" data-f="sum">${esc(h.sum)}</textarea></label>
      <div class="well stack tight"><span class="lbl">Requirements</span>
        <div class="row"><label class="fld" style="width:140px"><span>Rank</span><select class="inp" data-c="hbReq" data-f="rank">${ENG.RANKS.map(x => `<option value="${x}" ${r.rank === x ? 'selected' : ''}>${ENG.RANK_NAME[x]}</option>`).join('')}</select></label><label class="chk small" style="align-self:flex-end"><input type="checkbox" ${r.wc ? 'checked' : ''} data-c="hbReq" data-f="wc"><span>Wild Card only</span></label>
          <label class="fld" style="width:200px"><span>Arcane Background</span><select class="inp" data-c="hbReq" data-f="ab"><option value="">Not required</option><option value="any" ${r.ab === 'any' ? 'selected' : ''}>Any</option>${ENG.list(C.abs).map(a => `<option value="${a.id}" ${r.ab === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></label></div>
        <div class="row tight">${SW.ATTRS.map(a => `<label class="fld" style="width:96px"><span>${a.name}</span>${dieSel(r.attrs[a.id] || 0, `data-c="hbReq" data-f="attr" data-k="${a.id}"`, true)}</label>`).join('')}</div>
        ${r.skills.map(([sk, v], i) => `<div class="row tight" style="flex-wrap:nowrap"><select class="inp" data-c="hbReq" data-f="skillId" data-i="${i}"><option value="">skill…</option>${ENG.list(C.skills).map(x => `<option value="${x.id}" ${sk === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>${dieSel(v, `data-c="hbReq" data-f="skillDie" data-i="${i}" style="max-width:90px"`)}<button class="btn ghost xs" data-a="hbReqDel" data-w="skill" data-i="${i}">✕</button></div>`).join('')}
        ${r.edges.map((e, i) => `<div class="row tight" style="flex-wrap:nowrap"><select class="inp" data-c="hbReq" data-f="edge" data-i="${i}"><option value="">Edge…</option>${ENG.list(C.edges).map(x => `<option value="${x.id}" ${e === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select><button class="btn ghost xs" data-a="hbReqDel" data-w="edge" data-i="${i}">✕</button></div>`).join('')}
        <div class="row tight"><button class="btn ghost xs" data-a="hbReqAdd" data-w="skill">+ Skill requirement</button><button class="btn ghost xs" data-a="hbReqAdd" data-w="edge">+ Edge requirement</button></div>
        <span class="tiny muted">Reads as: ${esc(ENG.reqText(C, { req: formToReq(r) }))}</span>
      </div>
      <div class="row">${f('page', 'Page ref', '', 'e.g. 42 or setting book p.12')}<label class="chk small"><input type="checkbox" ${h.multi ? 'checked' : ''} data-c="hb" data-f="multi"><span>Can be taken more than once</span></label></div>
      ${fxEditor(h.fx, 'hb', 'fx')}`;
  } else if (k === 'hindrances') {
    body = `<div class="grid g2" style="gap:10px">${f('name', 'Name')}<label class="fld"><span>Severity</span><select class="inp" data-c="hb" data-f="sev">${['Minor', 'Major', 'Both'].map(x => `<option ${h.sev === x ? 'selected' : ''} value="${x}">${x === 'Both' ? 'Minor or Major' : x}</option>`).join('')}</select></label></div>
      <label class="fld"><span>Summary</span><textarea class="inp" style="min-height:70px" data-c="hb" data-f="sum">${esc(h.sum)}</textarea></label>${f('page', 'Page ref')}
      ${h.sev === 'Both' ? `<span class="lbl">Minor effects</span>${fxEditor(h.fx, 'hb', 'fx')}<span class="lbl">Major effects</span>${fxEditor(h.fxMajor, 'hb', 'fxMajor')}` : fxEditor(h.fx, 'hb', 'fx')}`;
  } else if (k === 'powers') {
    body = `<div class="grid g2" style="gap:10px">${f('name', 'Name')}<label class="fld"><span>Rank</span><select class="inp" data-c="hb" data-f="rank">${ENG.RANKS.map(x => `<option value="${x}" ${h.rank === x ? 'selected' : ''}>${ENG.RANK_NAME[x]}</option>`).join('')}</select></label>
      ${f('pp', 'Power Points (number, or S for special)')}${f('range', 'Range', '', 'Sm, Sm×2, Touch, Self, Cone')}${f('dur', 'Duration', '', '5, I, 1 hr, 10 min')}${f('dmg', 'Damage dice (if it deals damage)', '', '2d6')}${f('page', 'Page ref')}
      <label class="fld"><span>Effect on self (sheet tracking)</span><select class="inp" data-c="hb" data-f="self"><option value="">None</option>${[['boost', 'Boost a Trait'], ['protection', 'Armor bonus'], ['smite', 'Weapon damage bonus'], ['relief', 'Remove Fatigue/Shaken'], ['heal', 'Remove Wounds'], ['note', 'Just track it']].map(([v, n]) => `<option value="${v}" ${h.self === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
      <label class="fld"><span>Summary</span><textarea class="inp" style="min-height:70px" data-c="hb" data-f="sum">${esc(h.sum)}</textarea></label>
      <div class="well stack tight"><span class="lbl">Power-specific modifiers</span>${(h.mods || []).map((m, i) => `<div class="grid" style="grid-template-columns:minmax(0,2fr) 70px minmax(0,3fr) auto auto;gap:6px;align-items:center"><input class="inp" placeholder="Name" value="${esc(m.name)}" data-c="hbMod" data-i="${i}" data-f="name"><input class="inp" type="number" value="${m.cost || 0}" data-c="hbMod" data-i="${i}" data-f="cost" title="PP cost"><input class="inp" placeholder="Effect" value="${esc(m.text || '')}" data-c="hbMod" data-i="${i}" data-f="text"><label class="chk tiny"><input type="checkbox" ${m.per ? 'checked' : ''} data-c="hbMod" data-i="${i}" data-f="per"><span>each</span></label><button class="btn ghost xs" data-a="hbModDel" data-i="${i}">✕</button></div>`).join('')}<button class="btn ghost xs" style="align-self:flex-start" data-a="hbModAdd">Add modifier</button></div>`;
  } else if (k === 'skills') {
    body = `<div class="grid g2" style="gap:10px">${f('name', 'Name')}<label class="fld"><span>Linked attribute</span><select class="inp" data-c="hb" data-f="attr">${SW.ATTRS.map(a => `<option value="${a.id}" ${h.attr === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}</select></label></div>
      <label class="fld"><span>Summary</span><input class="inp" value="${esc(h.sum)}" data-c="hb" data-f="sum"></label>
      <label class="chk small"><input type="checkbox" ${h.core ? 'checked' : ''} data-c="hb" data-f="core"><span>Core skill (everyone starts at d4)</span></label>`;
  } else if (k === 'abs') {
    body = `<div class="grid g2" style="gap:10px">${f('name', 'Name')}<label class="fld"><span>Arcane skill</span><select class="inp" data-c="hb" data-f="skill">${ENG.list(C.skills).map(x => `<option value="${x.id}" ${h.skill === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>${f('powers', 'Starting powers', 'number')}${f('pp', 'Power Points', 'number')}</div>
      <label class="fld"><span>Summary</span><textarea class="inp" style="min-height:70px" data-c="hb" data-f="sum">${esc(h.sum)}</textarea></label>
      <p class="tiny muted" style="margin:0">Need a new arcane skill? Add it under Skills first.</p>`;
  } else {
    T.cg = h; h.kind = k;
    body = gearFields(h, 'hb').replace(/data-c="cgField"/g, 'data-c="hbG"') + `<label class="fld" style="max-width:240px"><span>Era</span><select class="inp" data-c="hbG" data-k="era"><option value="">Any era</option>${SW.ERAS.map(e => `<option value="${e.id}" ${h.era === e.id ? 'selected' : ''}>${e.name}</option>`).join('')}</select></label>`;
  }
  return `<div class="panel stack">${hdr((h._edit ? 'Edit ' : h._copy ? 'Customize ' : 'New ') + esc(HB_KINDS.find(x => x[0] === k)[1].replace(/s$/, '').toLowerCase()), h._copy ? '<small>replaces the core version in this setting</small>' : '')}
    ${body}
    <div class="row"><button class="btn" data-a="hbSave">Save</button><button class="btn ghost" data-a="hbCancel">Cancel</button></div></div>`;
}
CH.hbG = (el, d) => { const num = ['cost', 'wt', 'ap', 'rof', 'parry', 'reach', 'armor', 'cover', 'minStr', 'shots'].includes(d.k); T.hb[d.k] = num ? (+el.value || 0) : el.value; if (d.k === 'kind') { U().hbKind = el.value; T.hb._kind = el.value; render(); } };
A.hbSave = () => {
  const s = curSetting(); const h = T.hb; const k = h._kind;
  if (!(h.name || '').trim()) { toast('Give it a name first.'); return; }
  const C = ENG.content(s);
  const out = clone(h);
  if (!out.id) { out.id = slug(out.name); if (C[k] && C[k].has(out.id)) out.id += '-' + uid().slice(0, 4); }
  if (k === 'edges') { out.req = formToReq(h._req); }
  if (k === 'hindrances') { if (out.sev === 'Both') { out.fxMinor = out.fx; out.fxMajor = out.fxMajor; delete out.fx; } else delete out.fxMajor; }
  if (k === 'powers') { out.pp = String(out.pp).toUpperCase() === 'S' ? 'S' : (+out.pp || 1); if (!out.self) delete out.self; if (!out.dmg) delete out.dmg; }
  if (['melee', 'ranged', 'armor', 'shields', 'gear'].includes(k)) { delete out.kind; if (!out.era) delete out.era; }
  Object.keys(out).filter(x => x.startsWith('_')).forEach(x => delete out[x]);
  delete out.hb; delete out.off;
  s.hb[k] = s.hb[k] || [];
  const i = s.hb[k].findIndex(x => x.id === out.id); if (i >= 0) s.hb[k][i] = out; else s.hb[k].push(out);
  T.hb = null; rerender(); toast(out.name + ' saved to ' + s.name + '.');
};

/* ---------- core content toggles ---------- */
function sCore(s) {
  const C = ENG.content(s);
  const block = (k, n) => {
    const items = ENG.list(C[k], true).sort((a, b) => a.name.localeCompare(b.name));
    const off = items.filter(x => x.off).length;
    return `<details class="panel"><summary style="cursor:pointer" class="row between"><b style="font:800 17px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em">${n}</b><span class="small muted">${items.length - off} of ${items.length} available</span></summary>
      <div class="row tight" style="margin-top:10px">${items.map(x => `<button class="chip" aria-pressed="${!x.off}" data-a="offToggle" data-k="${k}" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div></details>`;
  };
  return `<div class="stack"><p class="small" style="margin:0">Hide core options that don’t exist in this world. Hidden entries vanish from the builder but stay on heroes who already have them.</p>
    ${block('races', 'Races')}${block('edges', 'Edges')}${block('hindrances', 'Hindrances')}${block('powers', 'Powers')}${block('abs', 'Arcane Backgrounds')}${block('skills', 'Skills')}${block('melee', 'Melee weapons')}${block('ranged', 'Ranged weapons')}${block('armor', 'Armor')}${block('shields', 'Shields')}${block('gear', 'Gear')}</div>`;
}
A.offToggle = d => { const s = curSetting(); s.off = s.off || {}; const l = s.off[d.k] = s.off[d.k] || []; const i = l.indexOf(d.id); if (i >= 0) l.splice(i, 1); else l.push(d.id); save(); render(); };

/* ---------- packs ---------- */
function sPacks(s) {
  return `<div class="panel stack">${hdr('Share this setting')}
      <p class="small" style="margin:0">A setting pack holds the Setting Rules, starting funds, homebrew, custom races, and hidden core options. Send it to your players so their builders match yours.</p>
      <div class="row"><button class="btn" data-a="packExport">Export setting pack</button><button class="btn ghost" data-a="packImport">Import setting pack</button></div>
    </div>
    <div class="panel stack">${hdr('Everything')}
      <p class="small" style="margin:0">Back up every hero and setting in this browser, or restore a backup.</p>
      <div class="row"><button class="btn ghost" data-a="backupAll">Back up all</button><button class="btn ghost" data-a="importChar">Restore / import</button></div>
    </div>`;
}
A.packExport = () => { const s = curSetting(); exportBox('Setting pack — ' + esc(s.name), slug(s.name) + '.swade-setting.json', { type: 'swade-setting', v: 1, setting: s }); };
A.packImport = () => importBox('Import a setting pack', 'Paste or choose a setting pack exported from this app. It’s added as a new setting.', data => {
  const s = data.type === 'swade-setting' ? data.setting : (data.rules && data.hb ? data : null);
  if (!s) throw new Error('That isn’t a setting pack.');
  importSetting(s); return (s.name || 'Setting') + ' imported.';
});

/* ---------------- codex ---------------- */
const CODEX_KINDS = [['all', 'Everything'], ['edges', 'Edges'], ['hindrances', 'Hindrances'], ['powers', 'Powers'], ['races', 'Races'], ['skills', 'Skills'], ['rules', 'Setting Rules'], ['gear', 'Gear & weapons'], ['states', 'States']];
const STATES = [
  { name: 'Distracted', sum: '−2 to all Trait rolls until the end of your next turn.' }, { name: 'Vulnerable', sum: 'Actions and attacks against you are +2 until the end of your next turn (doesn’t stack with The Drop).' },
  { name: 'Entangled', sum: 'Can’t move; Distracted while Entangled.' }, { name: 'Bound', sum: 'Can’t move, Distracted and Vulnerable, no physical actions except breaking free.' },
  { name: 'Fatigued / Exhausted', sum: '−1 / −2 to all Trait rolls; another level Incapacitates. Recovers one level per hour unless noted.' },
  { name: 'Shaken', sum: 'Only move and take free actions. Spirit roll at the start of your turn to recover; a Benny removes it anytime.' },
  { name: 'Stunned', sum: 'Distracted, prone, can’t act or move; attackers get The Drop. Vigor at the start of each turn: success revives (Distracted and Vulnerable), a raise recovers fully.' },
  { name: 'Wounds', sum: 'Each Wound is −1 Pace (min 1″) and −1 to Trait rolls (max −3). More than three Incapacitates a Wild Card.' },
  { name: 'Incapacitated', sum: 'Vigor roll: Critical Failure dies; failure = permanent injury and Bleeding Out; success = injury heals with Wounds; raise = injury gone in 24 hours.' },
  { name: 'Bleeding Out', sum: 'Vigor at the start of each turn: failure perishes, success survives this round, a raise stabilizes. A Healing roll stabilizes.' },
];
function viewCodex() {
  const s = (curChar() && settingOf(curChar())) || curSetting();
  return `<div class="stack" style="gap:16px">
    <div class="row between"><div><div class="h-display">Codex</div><div class="h-sub">Rules reference for ${esc(s.name)} · page numbers refer to the Adventure Edition core book</div></div></div>
    ${s.notes ? `<div class="panel">${hdr('Setting notes')}<p style="margin:0;white-space:pre-wrap">${esc(s.notes)}</p></div>` : ''}
    <div class="filter"><input class="inp" id="codexQ" placeholder="Search Edges, powers, gear, rules…" value="${esc(U().codexQ || '')}" data-i="codexQ" style="max-width:360px"><span class="seg">${CODEX_KINDS.map(([k, n]) => `<button aria-pressed="${(U().codexKind || 'all') === k}" data-a="codexKind" data-k="${k}">${n}</button>`).join('')}</span></div>
    <div id="codexList" class="opts">${codexList(s)}</div>
  </div>`;
}
function codexList(s) {
  const C = ENG.content(s); const q = (U().codexQ || '').toLowerCase(); const kind = U().codexKind || 'all';
  const out = [];
  const add = (k, label, x, meta, body) => out.push({ k, label, name: x.name, meta, body, page: x.page, hb: x.hb });
  if (kind === 'all' || kind === 'edges') ENG.list(C.edges).forEach(e => add('edges', e.cat + ' Edge', e, 'Req: ' + ENG.reqText(C, e), e.sum));
  if (kind === 'all' || kind === 'hindrances') ENG.list(C.hindrances).forEach(h => add('hindrances', 'Hindrance · ' + (h.sev === 'Both' ? 'Minor/Major' : h.sev), h, '', h.sum));
  if (kind === 'all' || kind === 'powers') ENG.list(C.powers).forEach(p => add('powers', 'Power · ' + ENG.RANK_NAME[p.rank], p, `${p.pp} PP · Range ${p.range} · Duration ${p.dur}${(p.mods || []).length ? ' · Mods: ' + p.mods.map(m => m.name + ' (+' + (m.cost != null ? m.cost : m.opts.map(o => o.cost).join('/')) + ')').join(', ') : ''}`, p.sum));
  if (kind === 'all' || kind === 'races') ENG.list(C.races).forEach(r => add('races', 'Race', r, ENG.raceInstances(r, []).map(x => ENG.abilityName(C, x)).join(' · '), r.sum || ''));
  if (kind === 'all' || kind === 'skills') ENG.list(C.skills).forEach(x => add('skills', 'Skill · ' + ENG.ATTR_NAME[x.attr] + (x.core ? ' · core' : ''), x, '', x.sum));
  if (kind === 'all' || kind === 'rules') SW.RULES.forEach(r => add('rules', 'Setting Rule' + (C.rules.has(r.id) ? ' · in play' : ''), r, '', r.sum));
  if (kind === 'all' || kind === 'states') STATES.forEach(r => add('states', 'State', Object.assign({ page: 203 }, r), '', r.sum));
  if (kind === 'all' || kind === 'gear') {
    ENG.list(C.melee).filter(C.eraOk).forEach(x => add('gear', 'Melee weapon', x, `${x.dmg}${x.ap ? ', AP ' + x.ap : ''}${x.parry ? ', Parry ' + sgn(x.parry) : ''}${x.reach ? ', Reach ' + x.reach : ''} · Min Str ${ENG.dieLabel(x.minStr)} · ${money(s, x.cost)}`, x.notes || ''));
    ENG.list(C.ranged).filter(C.eraOk).forEach(x => add('gear', 'Ranged weapon', x, `${x.range} · ${x.dmg}${x.ap ? ', AP ' + x.ap : ''} · RoF ${x.rof || 1} · ${money(s, x.cost)}`, x.notes || ''));
    ENG.list(C.armor).filter(C.eraOk).forEach(x => add('gear', 'Armor', x, `${sgn(x.armor)} ${x.loc} · Min Str ${ENG.dieLabel(x.minStr)} · ${money(s, x.cost)}`, x.notes || ''));
    ENG.list(C.shields).filter(C.eraOk).forEach(x => add('gear', 'Shield', x, `Parry ${sgn(x.parry)}, Cover ${x.cover || 0} · ${money(s, x.cost)}`, x.notes || ''));
    ENG.list(C.gear).filter(C.eraOk).forEach(x => add('gear', x.cat || 'Gear', x, money(s, x.cost) + ' · ' + x.wt + ' lb', x.notes || ''));
  }
  const res = out.filter(x => !q || (x.name + ' ' + x.meta + ' ' + x.body + ' ' + x.label).toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
  if (!res.length) return '<div class="empty" style="grid-column:1/-1">Nothing matches.</div>';
  return res.slice(0, 300).map(x => `<div class="opt"><div class="row between"><h4>${esc(x.name)}</h4><span class="row tight">${x.hb ? '<span class="pill">homebrew</span>' : ''}${pg(x.page)}</span></div><span class="lbl">${esc(x.label)}</span>${x.meta ? `<div class="req">${esc(x.meta)}</div>` : ''}${x.body ? `<p>${esc(x.body)}</p>` : ''}</div>`).join('') + (res.length > 300 ? `<div class="empty" style="grid-column:1/-1">${res.length - 300} more — refine the search.</div>` : '');
}
IN.codexQ = el => { U().codexQ = el.value; save(); $('#codexList').innerHTML = codexList((curChar() && settingOf(curChar())) || curSetting()); };
A.codexKind = d => { U().codexKind = d.k; rerender(); };

/* ---------------- boot ---------------- */
applyTheme();
render();

</script>
</body>
</html>
