name: Build Savage Worlds Companion APK

on:
  push:
    branches:
      - main
      - ccr-9aeb7d21-x3h0uv
    paths:
      - 'swade-companion/**'
      - '.github/workflows/swade-companion-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swade-companion-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swade-companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Use signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SW_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SW_KEYSTORE_PASSWORD: ${{ secrets.SW_KEYSTORE_PASSWORD }}
          SW_KEY_ALIAS: ${{ secrets.SW_KEY_ALIAS }}
          SW_KEY_PASSWORD: ${{ secrets.SW_KEY_PASSWORD }}
        run: |
          # Empty secrets fall back to the sideload keystore in keystore/.
          for v in SW_KEYSTORE_PASSWORD SW_KEY_ALIAS SW_KEY_PASSWORD; do
            [ -z "${!v}" ] && unset "$v"
          done
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: |
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/savage-worlds-companion.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: savage-worlds-companion-apk
          path: dist-apk/savage-worlds-companion.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="savage-worlds-companion-android-${{ github.run_number }}"
          gh release create "$tag" ../dist-apk/savage-worlds-companion.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Savage Worlds Companion (Android build ${{ github.run_number }})" \
            --notes "Installable Android APK of the Savage Worlds Companion, built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Download savage-worlds-companion.apk below and open it on your phone." \
            --prerelease
