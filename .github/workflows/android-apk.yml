name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/mobile-app-development-u9f5u4
    paths:
      - 'bending-companion/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bending-companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bending-companion/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: bending-companion/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p ../dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk ../dist-apk/bending-companion.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bending-companion-apk
          path: dist-apk/bending-companion.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-build-${{ github.run_number }}"
          gh release create "$tag" ../dist-apk/bending-companion.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Bending Companion (Android build ${{ github.run_number }})" \
            --notes "Installable Android APK built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}." \
            --prerelease
