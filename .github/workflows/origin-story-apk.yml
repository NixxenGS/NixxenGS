name: Build Origin Story APK

on:
  push:
    branches:
      - main
      - claude/ttrpg-mobile-app-ddzz0w
    paths:
      - 'origin-story/**'
      - '.github/workflows/origin-story-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origin-story-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: origin-story
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: origin-story/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: origin-story/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p ../dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk ../dist-apk/origin-story.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: origin-story-apk
          path: dist-apk/origin-story.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="origin-story-android-${{ github.run_number }}"
          gh release create "$tag" ../dist-apk/origin-story.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Origin Story (Android build ${{ github.run_number }})" \
            --notes "Installable Android APK of Origin Story (Sentinel Comics RPG companion), built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}." \
            --prerelease
